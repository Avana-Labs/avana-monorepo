# Report only (Josue, 2026-11-13): the spec has done its job and the contracts are in manual review, so no spec
# check may fail a pull request or a run. Every step continues on error; results stay in the job summaries and
# artifacts. A new AMM integration may switch its own rows back on.
name: spec

# Spec-stage verification: Z3, SymPy, simulations, Hypothesis, Quint and the traceability check
# (trace.py), split into the parts of spec/05-verification/run_all.sh, one job each, run in parallel.
#
# - `trace` runs on every pull request and push to main that touches the paths below, and on every manual run:
#   the licence-header check, `run_all.sh trace` (fails on a duplicate ID, a link to an undefined ID or an
#   unaccepted requirement change) and a check that the committed traceability.md matches the one trace.py
#   regenerates.
# - `model` runs one job per other part (`run_all.sh --list`: each z3/ folder, sympy, simulation, hypothesis,
#   quint), each bounded at 4 hours; a part fails when any check differs from its recorded result. These jobs run
#   every night at 06:00 UTC, on every release tag (`v*`) and by hand, never on a pull request or a push to main.
# - `spec-gate` passes only when `plan` and `trace` passed and, in a nightly, release or manual run, every model part
#   passed; elsewhere the model parts are skipped and the gate accepts that.

on:
  pull_request:
    paths:
      - "spec/**"
      - "contracts/src/**"
      - "contracts/test/**"
      - "contracts/certora/**"
      - ".github/workflows/spec.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "spec/**"
      - "contracts/src/**"
      - "contracts/test/**"
      - "contracts/certora/**"
      - ".github/workflows/spec.yml"
  schedule:
    # Nightly at 06:00 UTC on main (GitHub runs a schedule on the default branch only).
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  # A newer pull-request run cancels the older one on the same ref; runs on main finish, so a model part is never
  # cancelled by the next push.
  group: spec-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      parts: ${{ steps.parts.outputs.parts }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        continue-on-error: true
        with:
          persist-credentials: false

      - name: List the model parts
        continue-on-error: true
        id: parts
        working-directory: spec/05-verification
        run: |
          parts=$(./run_all.sh --list | grep -vx trace | jq -R . | jq -cs .)
          echo "parts: $parts"
          echo "parts=$parts" >>"$GITHUB_OUTPUT"

  model:
    name: run_all.sh ${{ matrix.part }}
    needs: plan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    defaults:
      run:
        working-directory: spec/05-verification
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        continue-on-error: true
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        continue-on-error: true
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spec/05-verification/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        continue-on-error: true
        if: matrix.part == 'quint'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: spec/05-verification/package-lock.json

      - name: Install pinned tools
        continue-on-error: true
        env:
          PART: ${{ matrix.part }}
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          if [ "$PART" = quint ]; then npm ci; fi

      - name: Run the part
        continue-on-error: true
        env:
          PART: ${{ matrix.part }}
        run: ./run_all.sh "$PART"

  trace:
    name: run_all.sh trace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spec/05-verification
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        continue-on-error: true
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        continue-on-error: true
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spec/05-verification/requirements.txt

      - name: Licence headers (spec-stage scripts and the Solidity they check)
        continue-on-error: true
        run: ../../contracts/script/check-licence.sh

      - name: Install pinned tools
        continue-on-error: true
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Traceability (trace.py)
        continue-on-error: true
        run: ./run_all.sh trace

      - name: Fail if traceability.md is stale
        continue-on-error: true
        # trace.py regenerates traceability.md; a diff means the committed matrix was not refreshed.
        run: git diff --exit-code -- traceability.md

  spec-gate:
    name: spec-gate
    if: always()
    needs: [plan, model, trace]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every part passed
        continue-on-error: true
        env:
          LONG: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
          PLAN: ${{ needs.plan.result }}
          MODEL: ${{ needs.model.result }}
          TRACE: ${{ needs.trace.result }}
        run: |
          fail=0
          [ "$PLAN" = success ] || { echo "plan: $PLAN"; fail=1; }
          [ "$TRACE" = success ] || { echo "trace: $TRACE"; fail=1; }
          if [ "$LONG" = true ]; then
            [ "$MODEL" = success ] || { echo "model parts: $MODEL"; fail=1; }
          elif [ "$MODEL" = skipped ]; then
            echo "model parts: skipped, they run nightly, on every release tag and by hand"
          else
            echo "model parts: $MODEL outside a nightly, release or manual run, expected skipped"
            fail=1
          fi
          exit $fail
