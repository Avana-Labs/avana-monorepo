name: spec

# Spec-stage verification: Z3, SymPy, simulations, Hypothesis, Quint and the traceability check
# (trace.py). run_all.sh exits non-zero if any check differs from its recorded result, or if
# trace.py finds a duplicate ID, a link to an undefined ID, or an unaccepted requirement change.

on:
  pull_request:
    paths:
      - "spec/**"
      - "contracts/src/**"
      - "contracts/test/**"
      - "contracts/certora/**"
      - ".github/workflows/spec.yml"
  push:
    branches: [main]
    paths:
      - "spec/**"
      - "contracts/src/**"
      - "contracts/test/**"
      - "contracts/certora/**"
      - ".github/workflows/spec.yml"
  workflow_dispatch:

concurrency:
  group: spec-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: run_all.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: spec/05-verification
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spec/05-verification/requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: spec/05-verification/package-lock.json

      - name: Licence headers (spec-stage scripts and the Solidity they check)
        run: ../../contracts/script/check-licence.sh

      - name: Install pinned tools
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          npm ci

      - name: Run every spec-stage check
        run: ./run_all.sh

      - name: Fail if traceability.md is stale
        # trace.py regenerates traceability.md; a diff means the committed matrix was not refreshed.
        run: git diff --exit-code -- traceability.md
