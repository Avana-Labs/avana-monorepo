name: web

# The web app in web/ (`@avana/web`, one package of the npm workspace whose root is the repository's package.json).
# Every pull request and push to main that changes it, services/convex (the app imports its Convex API), the workspace
# manifests or this file installs the whole workspace with npm ci from the lock file (lifecycle scripts never run), then
# runs the app's lint, typecheck, unit tests and a production build. The build needs no secrets: every environment
# variable may be empty (web/.env.example lists them).
# Tool versions are pinned: Node by .nvmrc, every action by commit SHA (the release tag in the trailing comment),
# every direct dependency by exact version and every transitive one by the lock file.

on:
  pull_request:
    paths:
      - "web/**"
      - "services/convex/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "services/convex/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
