name: mutation-gate

# Mutation gates every night on main (06:00 UTC) and on every release tag (`v*`) over each layer's contracts
# (security/mutation-layers.json). By hand (workflow_dispatch): one layer or all six. Pull requests run contracts.yml
# only. `plan` lists the targets with script/ci-shards.py, so a new contract or test file gets its own job on the next
# run; every target then runs in its own job of at most 4 hours:
# - mutate: slither-mutate, one job per contract and mutator group (the three groups together test every mutant of
#   one run, and more, since a group never skips lines another group left uncaught);
# - gambit: Gambit expression mutants, one job per contract (at most 20 mutants of 5 minutes each);
# - necessist: Necessist, one job per test file;
# - certora-mutate: certoraMutate, one job per Certora conf; without the CERTORAKEY secret each job passes with a
#   warning and runs nothing.
# `mutation-summary` passes only when every job passed.
# Tool versions are pinned: Foundry by contracts/.foundry-version, Node by .nvmrc, every action by commit SHA (the
# release tag in the trailing comment), dependencies by soldeer.lock, Python tools (Slither, Halmos, Semgrep, ...)
# by contracts/requirements.txt and contracts/requirements-mythril.txt, solhint and @openzeppelin/upgrades-core by
# contracts/package-lock.json, Echidna, Medusa, Aderyn and hevm by version and sha256, the Semgrep rules and 4naly3er
# by commit and Necessist by crate version in contracts/script/install-security-tools.sh; Gambit is the binary in the
# pinned certora-cli wheel.

on:
  schedule:
    # Nightly at 06:00 UTC on main (GitHub runs a schedule on the default branch only).
    - cron: "0 6 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      layer:
        description: "Layer (security/mutation-layers.json)"
        required: true
        type: choice
        default: all
        options: [all, "2.1", "2.2", "2.3", "2.4", "2.5", "2.6"]

concurrency:
  # A newer run waits for the running gates instead of cancelling them.
  group: mutation-gate-${{ github.ref }}-${{ inputs.layer || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_VERSION: "0.13.1"
  # Empty: every layer.
  LAYERS: ${{ (inputs.layer != '' && inputs.layer != 'all') && inputs.layer || '' }}

defaults:
  run:
    working-directory: contracts

jobs:
  plan:
    name: plan the jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      contracts: ${{ steps.plan.outputs.contracts }}
      groups: ${{ steps.plan.outputs.groups }}
      tests: ${{ steps.plan.outputs.tests }}
      confs: ${{ steps.plan.outputs.confs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: List every target (script/ci-shards.py)
        id: plan
        run: |
          set -euo pipefail
          # Each list is computed before it is written, so a failing listing fails this job.
          contracts=$(python3 script/ci-shards.py mutate --layers "$LAYERS")
          groups=$(python3 script/ci-shards.py mutator-groups)
          tests=$(python3 script/ci-shards.py necessist --layers "$LAYERS")
          confs=$(python3 script/ci-shards.py certora-mutate --layers "$LAYERS")
          printf '%s\n' "contracts=$contracts" "groups=$groups" "tests=$tests" "confs=$confs" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Aave V4 and Uniswap v3 builds
    # The mutation jobs' isolated copies link out-aave/ and out-univ3/, which the Aave V4 and Uniswap v3 fixtures
    # deploy from (vm.getCode).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - run: |
          forge soldeer install
          FOUNDRY_PROFILE=aave forge build
          FOUNDRY_PROFILE=univ3 forge build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: out-aave
          path: contracts/out-aave
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: out-univ3
          path: contracts/out-univ3
          if-no-files-found: error
          retention-days: 7

  mutate-statements:
    name: mutate ${{ matrix.layer }} ${{ matrix.contract }} (group 1)
    # slither-mutate on one contract with mutator group 1 of script/ci-shards.py (CR and RR); each mutant runs the
    # contract's Foundry tests with MUTATE_TIMEOUT (300 seconds). Uncaught mutants are a report for the layer gate
    # review; a tool error fails. One job per group keeps each matrix under GitHub's 256 legs.
    needs: [plan, build]
    if: needs.plan.outputs.contracts != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.contracts) }}
    env:
      MUTATE_LAYERS: ${{ matrix.layer }}
      MUTATE_CONTRACTS: ${{ matrix.contract }}
      MUTATE_MUTATORS: ${{ fromJSON(needs.plan.outputs.groups)[0].mutators }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Install dependencies and pinned tools
        run: |
          forge soldeer install
          # out-aave arrives as an artifact, so no build here installs the pinned solc that security-slow.sh looks up;
          # compiling one small file into a throwaway folder makes Foundry install it.
          forge build src/types/AccountGateStatus.sol --out "$RUNNER_TEMP/solc-out" --cache-path "$RUNNER_TEMP/solc-cache"
          script/install-security-tools.sh --python
          .venv/bin/slither-mutate --list-mutators | python3 script/ci-shards.py mutators-check

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: out-aave
          path: contracts/out-aave

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: out-univ3
          path: contracts/out-univ3

      - name: slither-mutate on ${{ matrix.contract }}, mutators ${{ env.MUTATE_MUTATORS }}
        run: script/security-slow.sh mutate

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutate-${{ matrix.layer }}-${{ matrix.contract }}-1
          path: |
            contracts/out-security/mutation
            !contracts/out-security/mutation/root
          retention-days: 30

  mutate-operators:
    name: mutate ${{ matrix.layer }} ${{ matrix.contract }} (group 2)
    # slither-mutate on one contract with mutator group 2 of script/ci-shards.py (operator replacements), as above.
    needs: [plan, build]
    if: needs.plan.outputs.contracts != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.contracts) }}
    env:
      MUTATE_LAYERS: ${{ matrix.layer }}
      MUTATE_CONTRACTS: ${{ matrix.contract }}
      MUTATE_MUTATORS: ${{ fromJSON(needs.plan.outputs.groups)[1].mutators }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Install dependencies and pinned tools
        run: |
          forge soldeer install
          # out-aave arrives as an artifact, so no build here installs the pinned solc that security-slow.sh looks up;
          # compiling one small file into a throwaway folder makes Foundry install it.
          forge build src/types/AccountGateStatus.sol --out "$RUNNER_TEMP/solc-out" --cache-path "$RUNNER_TEMP/solc-cache"
          script/install-security-tools.sh --python
          .venv/bin/slither-mutate --list-mutators | python3 script/ci-shards.py mutators-check

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: out-aave
          path: contracts/out-aave

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: out-univ3
          path: contracts/out-univ3

      - name: slither-mutate on ${{ matrix.contract }}, mutators ${{ env.MUTATE_MUTATORS }}
        run: script/security-slow.sh mutate

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutate-${{ matrix.layer }}-${{ matrix.contract }}-2
          path: |
            contracts/out-security/mutation
            !contracts/out-security/mutation/root
          retention-days: 30

  mutate-others:
    name: mutate ${{ matrix.layer }} ${{ matrix.contract }} (group 3)
    # slither-mutate on one contract with mutator group 3 of script/ci-shards.py (the other mutators), as above.
    needs: [plan, build]
    if: needs.plan.outputs.contracts != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.contracts) }}
    env:
      MUTATE_LAYERS: ${{ matrix.layer }}
      MUTATE_CONTRACTS: ${{ matrix.contract }}
      MUTATE_MUTATORS: ${{ fromJSON(needs.plan.outputs.groups)[2].mutators }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Install dependencies and pinned tools
        run: |
          forge soldeer install
          # out-aave arrives as an artifact, so no build here installs the pinned solc that security-slow.sh looks up;
          # compiling one small file into a throwaway folder makes Foundry install it.
          forge build src/types/AccountGateStatus.sol --out "$RUNNER_TEMP/solc-out" --cache-path "$RUNNER_TEMP/solc-cache"
          script/install-security-tools.sh --python
          .venv/bin/slither-mutate --list-mutators | python3 script/ci-shards.py mutators-check

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: out-aave
          path: contracts/out-aave

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: out-univ3
          path: contracts/out-univ3

      - name: slither-mutate on ${{ matrix.contract }}, mutators ${{ env.MUTATE_MUTATORS }}
        run: script/security-slow.sh mutate

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutate-${{ matrix.layer }}-${{ matrix.contract }}-3
          path: |
            contracts/out-security/mutation
            !contracts/out-security/mutation/root
          retention-days: 30

  gambit:
    name: gambit ${{ matrix.layer }} ${{ matrix.contract }}
    # Gambit mutants of one contract (layer cap, fixed seed), each built with GAMBIT_BUILD_TIMEOUT (1500 seconds) and
    # run against its tests with GAMBIT_TIMEOUT (300 seconds); any survived or timed-out mutant not accepted in
    # security/gambit-triage.json fails the job. A Lens file's mutant rebuilds the via-IR Lens modules (several
    # minutes each), so 20 of them need more than 240 minutes; 360 is the hosted-runner maximum.
    needs: [plan, build]
    if: needs.plan.outputs.contracts != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.contracts) }}
    env:
      MUTATE_LAYERS: ${{ matrix.layer }}
      MUTATE_CONTRACTS: ${{ matrix.contract }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Install dependencies and pinned tools
        run: |
          forge soldeer install
          # out-aave arrives as an artifact, so no build here installs the pinned solc that security-slow.sh looks up;
          # compiling one small file into a throwaway folder makes Foundry install it.
          forge build src/types/AccountGateStatus.sol --out "$RUNNER_TEMP/solc-out" --cache-path "$RUNNER_TEMP/solc-cache"
          script/install-security-tools.sh --python --gambit

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: out-aave
          path: contracts/out-aave

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: out-univ3
          path: contracts/out-univ3

      - name: Gambit on ${{ matrix.contract }}
        run: script/security-slow.sh gambit

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gambit-${{ matrix.layer }}-${{ matrix.contract }}
          path: |
            contracts/out-security/gambit
            !contracts/out-security/gambit/root
          retention-days: 30

  necessist:
    name: necessist ${{ matrix.layer }} ${{ matrix.test }}
    # Necessist on one test file of the layer, NECESSIST_TIMEOUT (300 seconds) per removal; removals that leave the
    # tests passing are a report for the layer gate review; a tool error fails.
    needs: [plan, build]
    if: needs.plan.outputs.tests != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tests) }}
    env:
      MUTATE_LAYERS: ${{ matrix.layer }}
      NECESSIST_TESTS: ${{ matrix.test }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Cache the pinned Necessist build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/tools
          key: necessist-${{ runner.os }}-${{ hashFiles('contracts/script/install-security-tools.sh') }}

      - name: Install dependencies and pinned tools
        # Necessist has no release binaries; the runner's preinstalled cargo builds the pinned crate into tools/bin.
        run: |
          forge soldeer install
          # out-aave arrives as an artifact, so no build here installs the pinned solc that security-slow.sh looks up;
          # compiling one small file into a throwaway folder makes Foundry install it.
          forge build src/types/AccountGateStatus.sol --out "$RUNNER_TEMP/solc-out" --cache-path "$RUNNER_TEMP/solc-cache"
          script/install-security-tools.sh --python --necessist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: out-aave
          path: contracts/out-aave

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: out-univ3
          path: contracts/out-univ3

      - name: Necessist on ${{ matrix.test }}
        run: script/security-slow.sh necessist

      - name: Name the report
        id: name
        if: ${{ !cancelled() }}
        working-directory: .
        env:
          TEST_FILE: ${{ matrix.test }}
        run: echo "name=$(basename "$TEST_FILE" .sol)" >> "$GITHUB_OUTPUT"

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: necessist-${{ matrix.layer }}-${{ steps.name.outputs.name }}
          path: |
            contracts/out-security/necessist
            !contracts/out-security/necessist/root
          retention-days: 30

  certora-mutate:
    name: certoraMutate ${{ matrix.conf }}
    # certoraMutate on one conf (the conf's `mutations` section); it submits to the Certora cloud and waits for every
    # mutant's result. Needs the CERTORAKEY secret: without it the job reports "not run" and fails, since this workflow
    # runs only when the mutation gate is due. At most six run at a time, the number of Certora jobs the account keeps
    # open at once.
    needs: plan
    if: needs.plan.outputs.confs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.confs) }}
    env:
      CERTORAKEY: ${{ secrets.CERTORAKEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Not run without a Certora key
        if: env.CERTORAKEY == ''
        run: |
          echo "::error title=certoraMutate not run::The CERTORAKEY secret is not set; certoraMutate did not run on ${{ matrix.conf }}."
          echo "**certoraMutate on ${{ matrix.conf }}: not run.** The CERTORAKEY secret is not set." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Read the pinned Foundry version
        if: env.CERTORAKEY != ''
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        if: env.CERTORAKEY != ''
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: env.CERTORAKEY != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/requirements.txt

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: env.CERTORAKEY != ''
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.CERTORAKEY != ''
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Install dependencies and certora-cli
        if: env.CERTORAKEY != ''
        run: |
          forge soldeer install
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/solc-0.8.28" https://github.com/ethereum/solidity/releases/download/v0.8.28/solc-static-linux
          chmod +x "$HOME/.local/bin/solc-0.8.28"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: certoraMutate certora/conf/${{ matrix.conf }}.conf
        if: env.CERTORAKEY != ''
        env:
          CONF: ${{ matrix.conf }}
        run: |
          mkdir -p "out-security/certora-mutate/$CONF"
          .venv/bin/certoraMutate "certora/conf/$CONF.conf" --sync --poll_timeout 210 \
            --dump_csv "out-security/certora-mutate/$CONF/results.csv" \
            --dump_link "out-security/certora-mutate/$CONF/link.txt" 2>&1 | tee "out-security/certora-mutate/$CONF/run.log"
          rc=${PIPESTATUS[0]}
          test -s "out-security/certora-mutate/$CONF/results.csv" || { echo "certoraMutate wrote no results for $CONF"; exit 1; }
          exit "$rc"

      - name: Upload reports
        if: ${{ !cancelled() && env.CERTORAKEY != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: certora-mutate-${{ matrix.conf }}
          path: contracts/out-security/certora-mutate
          retention-days: 30

  mutation-summary:
    # The one check of this workflow: it passes only when the plan and every job passed. A job with no leg is skipped
    # by its `if` (the selected layers hold no such target); with the plan and the build passed, skipped can mean
    # nothing else.
    name: mutation-summary
    if: always()
    needs: [plan, build, mutate-statements, mutate-operators, mutate-others, gambit, necessist, certora-mutate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        working-directory: .
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[]
            | select(.value.result != "success")
            | select(.value.result != "skipped" or .key == "plan" or .key == "build")
            | .key] | join(", ")')
          if [ -n "$bad" ]; then echo "not passed: $bad"; exit 1; fi
