name: mutation-gate

# Mutation gates over each layer's contracts (security/mutation-layers.json), by hand only (workflow_dispatch; no
# schedule and no tag trigger since 2026-11-17): one layer or all six, optionally
# only some contracts and tools. Pull requests run contracts.yml only. `plan` lists the targets with script/ci-shards.py, so a new contract
# or test file gets its own job on the next run; every job then runs in at most 4 hours:
# - mutants: lists slither-mutate's mutants of every target once (script/mutation-slither.py list: one Slither run
#   over the project) and splits each contract into shards of at most 40 mutants;
# - mutate: one job per shard (three matrix jobs, since a matrix holds at most 256 legs);
# - gambit: Gambit expression mutants, one job per contract (at most 20 mutants);
# - necessist: Necessist, one job per test file;
# - certora-mutate: certoraMutate, one job per Certora conf, only while the repository variable CERTORA_ENABLED is
#   `true` (paused since 2026-11-13); without the CERTORAKEY secret each job passes with a
#   warning and runs nothing.
# Every mutant builds in the `mutation` profile of foundry.toml (no optimizer, no via-IR outside the files that need
# it) and compiles only src/ and its own tests. A timed-out mutant is its own outcome, never counted as killed.
# With `changed_only`, a run tests only what changed: script/mutation-ledger.py keys every target by its file, its
# tests and everything they import, and the `ledger` job keeps the passed reports per key (Actions cache
# mutation-ledger-*); a target whose key has a passed report of every job is skipped. Without it, everything runs.
# `mutation-summary` passes only when every job passed.
# Tool versions are pinned: Foundry by contracts/.foundry-version, Node by .nvmrc, every action by commit SHA (the
# release tag in the trailing comment), dependencies by soldeer.lock, Python tools (Slither, Halmos, Semgrep, ...)
# by contracts/requirements.txt and contracts/requirements-mythril.txt, solhint and @openzeppelin/upgrades-core by
# contracts/package-lock.json, Echidna, Medusa, Aderyn and hevm by version and sha256, the Semgrep rules and 4naly3er
# by commit and Necessist by crate version in contracts/script/install-security-tools.sh; Gambit is the binary in the
# pinned certora-cli wheel.

on:
  workflow_dispatch:
    inputs:
      layer:
        description: "Layer (security/mutation-layers.json)"
        required: true
        type: choice
        default: all
        options: [all, "2.1", "2.2", "2.3", "2.4", "2.5", "2.6"]
      contracts:
        description: "Contracts (space-separated file names; empty: every contract of the layer)"
        required: false
        type: string
        default: ""
      tools:
        description: "Tools (space-separated: mutate gambit necessist certora-mutate)"
        required: false
        type: string
        default: "mutate gambit necessist certora-mutate"
      changed_only:
        description: "Only targets changed since their last passed report"
        required: false
        type: boolean
        default: false

concurrency:
  # A newer run waits for the running gates instead of cancelling them.
  group: mutation-gate-${{ github.ref }}-${{ inputs.layer || 'all' }}-${{ inputs.contracts || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_VERSION: "0.13.1"
  # Empty: every layer, every contract.
  LAYERS: ${{ (inputs.layer != '' && inputs.layer != 'all') && inputs.layer || '' }}
  CONTRACTS: ${{ inputs.contracts || '' }}
  TOOLS: ${{ inputs.tools || 'mutate gambit necessist certora-mutate' }}
  CHANGED_ONLY: ${{ inputs.changed_only && 'true' || 'false' }}

defaults:
  run:
    working-directory: contracts

jobs:
  plan:
    name: plan the jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mutate: ${{ steps.plan.outputs.mutate }}
      gambit: ${{ steps.plan.outputs.gambit }}
      tests: ${{ steps.plan.outputs.tests }}
      confs: ${{ steps.plan.outputs.confs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Restore the ledger of passed reports
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/out-security/ledger
          key: mutation-ledger-${{ github.run_id }}
          restore-keys: mutation-ledger-

      - name: List every target (script/mutation-ledger.py, script/ci-shards.py)
        id: plan
        run: |
          set -euo pipefail
          mkdir -p out-security/plan
          p=out-security/plan
          # Each list is computed before it is written, so a failing listing fails this job.
          python3 script/mutation-ledger.py keys --layers "$LAYERS" --contracts "$CONTRACTS" >"$p/keys.json"
          if [ "$CHANGED_ONLY" = true ]; then
            python3 script/mutation-ledger.py current out-security/ledger "$p/keys.json" >"$p/current.json"
          else
            echo '[]' >"$p/current.json"
          fi
          sel=(--layers "$LAYERS" --contracts "$CONTRACTS" --keys "$p/keys.json" --skip "$p/current.json")
          gambit=$(python3 script/ci-shards.py gambit "${sel[@]}")
          tests=$(python3 script/ci-shards.py necessist "${sel[@]}")
          confs=$(python3 script/ci-shards.py certora-mutate --layers "$LAYERS")
          on() { case " $TOOLS " in *" $1 "*) echo "$2" ;; *) echo '[]' ;; esac; }
          {
            echo "mutate=$(on mutate true)"
            echo "gambit=$(on gambit "$gambit")"
            echo "tests=$(on necessist "$tests")"
            echo "confs=$(on certora-mutate "$confs")"
          } | sed 's/^mutate=\[\]$/mutate=false/' | tee -a "$GITHUB_OUTPUT"
          {
            echo "### Mutation plan"
            echo "- targets current in the ledger, skipped: $(jq length "$p/current.json") of $(jq length "$p/keys.json")"
            echo "- Gambit: $(jq length <<<"$gambit") jobs; Necessist: $(jq length <<<"$tests") jobs"
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-plan
          path: contracts/out-security/plan
          retention-days: 30

  mutants:
    name: list the slither-mutate mutants
    # One Slither run over the project (the `mutation` profile build) lists every mutant of each target to run
    # (script/mutation-slither.py list); script/ci-shards.py then splits each target into shards of at most 40
    # mutants (more when the shards would pass three matrices of 256) and deals them over mutate-1 to mutate-3.
    needs: plan
    if: needs.plan.outputs.mutate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      mutate1: ${{ steps.shards.outputs.mutate1 }}
      mutate2: ${{ steps.shards.outputs.mutate2 }}
      mutate3: ${{ steps.shards.outputs.mutate3 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Install dependencies and pinned tools
        run: |
          forge soldeer install
          script/install-security-tools.sh --solc --python
          .venv/bin/slither-mutate --list-mutators | python3 script/ci-shards.py mutators-check

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mutation-plan
          path: contracts/out-security/plan

      - name: List the mutants (script/mutation-slither.py list)
        env:
          FOUNDRY_PROFILE: mutation
        run: |
          set -euo pipefail
          p=out-security/plan
          .venv/bin/python script/mutation-slither.py list out-security/lists --layers "$LAYERS" --contracts "$CONTRACTS" \
            --skip "$p/current.json" >"$p/totals.json"

      - name: Split the targets into shards (script/ci-shards.py)
        id: shards
        run: |
          set -euo pipefail
          p=out-security/plan
          python3 script/ci-shards.py mutate --totals "$p/totals.json" --keys "$p/keys.json" --chunks 3 >"$p/mutate.json"
          for k in 0 1 2; do echo "mutate$((k + 1))=$(jq -c ".chunks[$k]" "$p/mutate.json")"; done | tee -a "$GITHUB_OUTPUT"
          echo "- slither-mutate: $(jq '.mutants' "$p/mutate.json") mutants in $(jq '[.chunks[] | length] | add' "$p/mutate.json") jobs of at most $(jq '.per_job' "$p/mutate.json")" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-lists
          path: |
            contracts/out-security/lists
            contracts/out-security/plan/totals.json
            contracts/out-security/plan/mutate.json
          if-no-files-found: error
          retention-days: 30

  build:
    name: dependency builds
    # The mutation jobs' isolated copies link these outputs, which the test fixtures deploy from (vm.getCode and
    # deployCode of out-aave/, out-univ3/, out-univ3-periphery/, out-slipstream-v1/, out-slipstream-main/,
    # out-aerodrome/, out-univ4/, out-permit2/); the same builds as contracts.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - run: |
          forge soldeer install
          script/install-security-tools.sh --solc
          for p in aave univ3 univ3-periphery slipstream-v1 slipstream-main aerodrome univ4 permit2; do FOUNDRY_PROFILE=$p forge build; done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-deps
          path: |
            contracts/out-aave
            contracts/out-univ3
            contracts/out-univ3-periphery
            contracts/out-slipstream-v1
            contracts/out-slipstream-main
            contracts/out-aerodrome
            contracts/out-univ4
            contracts/out-permit2
          if-no-files-found: error
          retention-days: 7

  mutate-1:
    name: mutate ${{ matrix.layer }} ${{ matrix.contract }} (shard ${{ matrix.shard }} of ${{ matrix.shards }})
    # One shard of a contract's slither-mutate mutants (script/mutation-slither.py through security-slow.sh mutate):
    # the mutants whose index i has i mod shards = shard - 1, each built and tested in the `mutation` profile with
    # MUTATE_TIMEOUT (600 seconds, compile and tests together). Survivors and timeouts are a report for the layer
    # gate review; failing tests without a mutant or a tool error fail. The plan deals the shards over 3 matrix
    # jobs (mutate-1 to mutate-3), each under GitHub's 256 legs.
    needs: [mutants, build]
    if: needs.mutants.outputs.mutate1 != '[]' && needs.mutants.outputs.mutate1 != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.mutants.outputs.mutate1) }}
    env:
      MUTATE_LAYERS: ${{ matrix.layer }}
      MUTATE_CONTRACTS: ${{ matrix.contract }}
      MUTATE_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
      MUTATE_LISTS: out-security/lists
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Install dependencies and pinned tools
        run: |
          forge soldeer install
          script/install-security-tools.sh --solc
          # The dependency outputs arrive as an artifact, so no build here installs the pinned solc that
          # security-slow.sh looks up; compiling one small file into a throwaway folder makes Foundry install it.
          forge build src/types/MarketTypes.sol --out "$RUNNER_TEMP/solc-out" --cache-path "$RUNNER_TEMP/solc-cache"
          # The shard jobs run no Slither (the mutants job listed the mutants): a bare venv is enough.
          python3 -m venv .venv

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mutation-deps
          path: contracts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mutation-lists
          path: contracts/out-security

      - name: slither-mutate mutants of ${{ matrix.contract }}, shard ${{ matrix.shard }} of ${{ matrix.shards }}
        run: script/security-slow.sh mutate

      - name: Record the passed report for the ledger
        env:
          LAYER: ${{ matrix.layer }}
          CONTRACT: ${{ matrix.contract }}
          KEY: ${{ matrix.key }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          python3 script/mutation-ledger.py done "out-security/mutation/$LAYER/$CONTRACT" "mutate:$LAYER:$CONTRACT" "$KEY" \
            --shard "$SHARD" --shards "$SHARDS"

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutate-${{ matrix.layer }}-${{ matrix.contract }}-${{ matrix.shard }}
          path: |
            contracts/out-security/mutation
            !contracts/out-security/mutation/root
          retention-days: 30

  mutate-2:
    name: mutate ${{ matrix.layer }} ${{ matrix.contract }} (shard ${{ matrix.shard }} of ${{ matrix.shards }})
    # One shard of a contract's slither-mutate mutants (script/mutation-slither.py through security-slow.sh mutate):
    # the mutants whose index i has i mod shards = shard - 1, each built and tested in the `mutation` profile with
    # MUTATE_TIMEOUT (600 seconds, compile and tests together). Survivors and timeouts are a report for the layer
    # gate review; failing tests without a mutant or a tool error fail. The plan deals the shards over 3 matrix
    # jobs (mutate-1 to mutate-3), each under GitHub's 256 legs.
    needs: [mutants, build]
    if: needs.mutants.outputs.mutate2 != '[]' && needs.mutants.outputs.mutate2 != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.mutants.outputs.mutate2) }}
    env:
      MUTATE_LAYERS: ${{ matrix.layer }}
      MUTATE_CONTRACTS: ${{ matrix.contract }}
      MUTATE_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
      MUTATE_LISTS: out-security/lists
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Install dependencies and pinned tools
        run: |
          forge soldeer install
          script/install-security-tools.sh --solc
          # The dependency outputs arrive as an artifact, so no build here installs the pinned solc that
          # security-slow.sh looks up; compiling one small file into a throwaway folder makes Foundry install it.
          forge build src/types/MarketTypes.sol --out "$RUNNER_TEMP/solc-out" --cache-path "$RUNNER_TEMP/solc-cache"
          # The shard jobs run no Slither (the mutants job listed the mutants): a bare venv is enough.
          python3 -m venv .venv

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mutation-deps
          path: contracts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mutation-lists
          path: contracts/out-security

      - name: slither-mutate mutants of ${{ matrix.contract }}, shard ${{ matrix.shard }} of ${{ matrix.shards }}
        run: script/security-slow.sh mutate

      - name: Record the passed report for the ledger
        env:
          LAYER: ${{ matrix.layer }}
          CONTRACT: ${{ matrix.contract }}
          KEY: ${{ matrix.key }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          python3 script/mutation-ledger.py done "out-security/mutation/$LAYER/$CONTRACT" "mutate:$LAYER:$CONTRACT" "$KEY" \
            --shard "$SHARD" --shards "$SHARDS"

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutate-${{ matrix.layer }}-${{ matrix.contract }}-${{ matrix.shard }}
          path: |
            contracts/out-security/mutation
            !contracts/out-security/mutation/root
          retention-days: 30

  mutate-3:
    name: mutate ${{ matrix.layer }} ${{ matrix.contract }} (shard ${{ matrix.shard }} of ${{ matrix.shards }})
    # One shard of a contract's slither-mutate mutants (script/mutation-slither.py through security-slow.sh mutate):
    # the mutants whose index i has i mod shards = shard - 1, each built and tested in the `mutation` profile with
    # MUTATE_TIMEOUT (600 seconds, compile and tests together). Survivors and timeouts are a report for the layer
    # gate review; failing tests without a mutant or a tool error fail. The plan deals the shards over 3 matrix
    # jobs (mutate-1 to mutate-3), each under GitHub's 256 legs.
    needs: [mutants, build]
    if: needs.mutants.outputs.mutate3 != '[]' && needs.mutants.outputs.mutate3 != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.mutants.outputs.mutate3) }}
    env:
      MUTATE_LAYERS: ${{ matrix.layer }}
      MUTATE_CONTRACTS: ${{ matrix.contract }}
      MUTATE_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
      MUTATE_LISTS: out-security/lists
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Install dependencies and pinned tools
        run: |
          forge soldeer install
          script/install-security-tools.sh --solc
          # The dependency outputs arrive as an artifact, so no build here installs the pinned solc that
          # security-slow.sh looks up; compiling one small file into a throwaway folder makes Foundry install it.
          forge build src/types/MarketTypes.sol --out "$RUNNER_TEMP/solc-out" --cache-path "$RUNNER_TEMP/solc-cache"
          # The shard jobs run no Slither (the mutants job listed the mutants): a bare venv is enough.
          python3 -m venv .venv

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mutation-deps
          path: contracts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mutation-lists
          path: contracts/out-security

      - name: slither-mutate mutants of ${{ matrix.contract }}, shard ${{ matrix.shard }} of ${{ matrix.shards }}
        run: script/security-slow.sh mutate

      - name: Record the passed report for the ledger
        env:
          LAYER: ${{ matrix.layer }}
          CONTRACT: ${{ matrix.contract }}
          KEY: ${{ matrix.key }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          python3 script/mutation-ledger.py done "out-security/mutation/$LAYER/$CONTRACT" "mutate:$LAYER:$CONTRACT" "$KEY" \
            --shard "$SHARD" --shards "$SHARDS"

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutate-${{ matrix.layer }}-${{ matrix.contract }}-${{ matrix.shard }}
          path: |
            contracts/out-security/mutation
            !contracts/out-security/mutation/root
          retention-days: 30

  gambit:
    name: gambit ${{ matrix.layer }} ${{ matrix.contract }}
    # Gambit mutants of one contract (layer cap, fixed seed), each built and tested in the `mutation` profile with
    # GAMBIT_TIMEOUT (600 seconds, compile and tests together; no separate `forge build`: forge test compiles src/
    # and the matched tests only); any survived or timed-out mutant not accepted in security/gambit-triage.json fails
    # the job.
    needs: [plan, build]
    if: needs.plan.outputs.gambit != '[]' && needs.plan.outputs.gambit != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.gambit) }}
    env:
      MUTATE_LAYERS: ${{ matrix.layer }}
      MUTATE_CONTRACTS: ${{ matrix.contract }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Install dependencies and pinned tools
        run: |
          forge soldeer install
          script/install-security-tools.sh --solc
          # The dependency outputs arrive as an artifact, so no build here installs the pinned solc that
          # security-slow.sh looks up; compiling one small file into a throwaway folder makes Foundry install it.
          forge build src/types/MarketTypes.sol --out "$RUNNER_TEMP/solc-out" --cache-path "$RUNNER_TEMP/solc-cache"
          script/install-security-tools.sh --solc --python --gambit

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mutation-deps
          path: contracts

      - name: Gambit on ${{ matrix.contract }}
        run: script/security-slow.sh gambit

      - name: Record the passed report for the ledger
        env:
          LAYER: ${{ matrix.layer }}
          CONTRACT: ${{ matrix.contract }}
          KEY: ${{ matrix.key }}
        run: python3 script/mutation-ledger.py done "out-security/gambit/$LAYER/$CONTRACT" "gambit:$LAYER:$CONTRACT" "$KEY"

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gambit-${{ matrix.layer }}-${{ matrix.contract }}
          path: |
            contracts/out-security/gambit
            !contracts/out-security/gambit/root
          retention-days: 30

  necessist:
    name: necessist ${{ matrix.layer }} ${{ matrix.test }}
    # Necessist on one test file of the layer, NECESSIST_TIMEOUT (300 seconds) per removal, in the `mutation` profile
    # (a file declaring a test of the release build's gas in the default profile); removals that leave the tests
    # passing are a report for the layer gate review; a tool error fails.
    needs: [plan, build]
    if: needs.plan.outputs.tests != '[]' && needs.plan.outputs.tests != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tests) }}
    env:
      MUTATE_LAYERS: ${{ matrix.layer }}
      NECESSIST_TESTS: ${{ matrix.test }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Cache the pinned Necessist build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/tools
          key: necessist-${{ runner.os }}-${{ hashFiles('contracts/script/install-security-tools.sh') }}

      - name: Install dependencies and pinned tools
        # Necessist has no release binaries; the runner's preinstalled cargo builds the pinned crate into tools/bin.
        run: |
          forge soldeer install
          script/install-security-tools.sh --solc
          # The dependency outputs arrive as an artifact, so no build here installs the pinned solc that
          # security-slow.sh looks up; compiling one small file into a throwaway folder makes Foundry install it.
          forge build src/types/MarketTypes.sol --out "$RUNNER_TEMP/solc-out" --cache-path "$RUNNER_TEMP/solc-cache"
          script/install-security-tools.sh --solc --python --necessist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mutation-deps
          path: contracts

      - name: Necessist on ${{ matrix.test }}
        run: script/security-slow.sh necessist

      - name: Record the passed report for the ledger
        env:
          LAYER: ${{ matrix.layer }}
          TESTS: ${{ matrix.test }}
          KEYS: ${{ matrix.keys }}
        run: |
          read -ra keys <<<"$KEYS"
          i=0
          for t in $TESTS; do
            python3 script/mutation-ledger.py done out-security/necessist "necessist:$LAYER:$t" "${keys[$i]:--}"
            i=$((i + 1))
          done

      - name: Name the report
        id: name
        if: ${{ !cancelled() }}
        working-directory: .
        env:
          TEST_FILE: ${{ matrix.test }}
        run: echo "name=$(basename "${TEST_FILE##* }" .sol)" >> "$GITHUB_OUTPUT"

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: necessist-${{ matrix.layer }}-${{ steps.name.outputs.name }}
          path: |
            contracts/out-security/necessist
            !contracts/out-security/necessist/root
          retention-days: 30

  certora-mutate:
    name: certoraMutate ${{ matrix.conf }}
    # certoraMutate on one conf (the conf's `mutations` section); it submits to the Certora cloud and waits for every
    # mutant's result. Needs the CERTORAKEY secret: without it the job reports "not run" and fails, since this workflow
    # runs only when the mutation gate is due. At most six run at a time, the number of Certora jobs the account keeps
    # open at once.
    # Paused since 2026-11-13 (Josue): runs only when the repository variable CERTORA_ENABLED is `true`; otherwise the
    # job is skipped, which mutation-summary accepts.
    needs: plan
    if: vars.CERTORA_ENABLED == 'true' && needs.plan.outputs.confs != '[]' && needs.plan.outputs.confs != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.confs) }}
    env:
      CERTORAKEY: ${{ secrets.CERTORAKEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Not run without a Certora key
        if: env.CERTORAKEY == ''
        run: |
          echo "::error title=certoraMutate not run::The CERTORAKEY secret is not set; certoraMutate did not run on ${{ matrix.conf }}."
          echo "**certoraMutate on ${{ matrix.conf }}: not run.** The CERTORAKEY secret is not set." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Read the pinned Foundry version
        if: env.CERTORAKEY != ''
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        if: env.CERTORAKEY != ''
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: env.CERTORAKEY != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/requirements.txt

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: env.CERTORAKEY != ''
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.CERTORAKEY != ''
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Install dependencies and certora-cli
        if: env.CERTORAKEY != ''
        run: |
          forge soldeer install
          script/install-security-tools.sh --solc
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/solc-0.8.28" https://github.com/ethereum/solidity/releases/download/v0.8.28/solc-static-linux
          chmod +x "$HOME/.local/bin/solc-0.8.28"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: certoraMutate certora/conf/${{ matrix.conf }}.conf
        if: env.CERTORAKEY != ''
        env:
          CONF: ${{ matrix.conf }}
        run: |
          mkdir -p "out-security/certora-mutate/$CONF"
          .venv/bin/certoraMutate "certora/conf/$CONF.conf" --sync --poll_timeout 210 \
            --dump_csv "out-security/certora-mutate/$CONF/results.csv" \
            --dump_link "out-security/certora-mutate/$CONF/link.txt" 2>&1 | tee "out-security/certora-mutate/$CONF/run.log"
          rc=${PIPESTATUS[0]}
          test -s "out-security/certora-mutate/$CONF/results.csv" || { echo "certoraMutate wrote no results for $CONF"; exit 1; }
          exit "$rc"

      - name: Upload reports
        if: ${{ !cancelled() && env.CERTORAKEY != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: certora-mutate-${{ matrix.conf }}
          path: contracts/out-security/certora-mutate
          retention-days: 30


  ledger:
    name: ledger of passed reports
    # Adds this run's passed reports to the ledger (script/mutation-ledger.py merge), keyed by each target's key, and
    # keeps it as the next mutation-ledger-* cache, so the next `changed_only` run skips what did not change. Runs after
    # every job, whatever their results: only reports with a `done` file (written when the job's tool step passed)
    # are kept.
    if: always() && needs.plan.result == 'success'
    needs: [plan, mutants, mutate-1, mutate-2, mutate-3, gambit, necessist]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Restore the ledger of passed reports
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/out-security/ledger
          key: mutation-ledger-${{ github.run_id }}
          restore-keys: mutation-ledger-

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mutation-plan
          path: contracts/out-security/plan

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "{mutate,gambit,necessist}-*"
          path: contracts/out-security/reports

      - name: Merge this run's passed reports
        run: |
          mkdir -p out-security/reports
          python3 script/mutation-ledger.py merge out-security/ledger out-security/reports out-security/plan/keys.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the ledger
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/out-security/ledger
          key: mutation-ledger-${{ github.run_id }}-${{ github.run_attempt }}

  mutation-summary:
    # The one check of this workflow: it passes only when the plan and every job passed. A job with no leg is skipped
    # by its `if` (the selected layers, contracts or tools hold no such target, or every target is current in the
    # ledger); with the plan and the build passed, skipped can mean nothing else.
    name: mutation-summary
    if: always()
    needs: [plan, build, mutants, mutate-1, mutate-2, mutate-3, gambit, necessist, certora-mutate, ledger]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        working-directory: .
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[]
            | select(.value.result != "success")
            | select(.value.result != "skipped" or .key == "plan" or .key == "build")
            | .key] | join(", ")')
          if [ -n "$bad" ]; then echo "not passed: $bad"; exit 1; fi
