name: security-slow

# Slow security tier every night on main (06:00 UTC), on every release tag (`v*`), by hand (workflow_dispatch): Echidna, Medusa, Halmos, hevm and Mythril with the slow-tier budgets. Pull requests run contracts.yml only.
# The `build` job compiles once (script/security-slow.sh build, and the build Halmos runs); `plan` lists the targets
# from that build with script/ci-shards.py; every target then runs in its own job, reusing the build: one per Echidna
# harness (both modes), one per Medusa harness, one per Halmos test function (a 5-hour budget in a 6-hour job), one per
# hevm target (each harness's assertion entry points, each src/ contract), and one per group of eight src/ contracts
# for Mythril; every other job has at most 4 hours. A new harness, Halmos test or src/ contract gets its own job on the
# next run. `slow-gate` passes only when every job passed; a Halmos check of contracts/security/halmos-bounds.json that
# its budget ends without a counterexample passes its job as "bounded, no violation found" (see the halmos job).
# By hand, `campaign` runs the pre-audit fuzzing campaign of one layer instead: every harness of the layer gets 24
# hours of Echidna per mode and 24 hours of Medusa, as eight parallel 3-hour jobs per harness and mode, each with a
# fresh seed and starting from the stored corpus; `campaign-merge` then joins the eight corpora of each harness and
# stores the result as that harness's corpus, which every later slow-tier run replays.
# Tool versions are pinned: Foundry by contracts/.foundry-version, Node by .nvmrc, every action by commit SHA (the
# release tag in the trailing comment), dependencies by soldeer.lock, Python tools (Slither, Halmos, Semgrep, ...)
# by contracts/requirements.txt and contracts/requirements-mythril.txt, solhint and @openzeppelin/upgrades-core by
# contracts/package-lock.json, Echidna, Medusa, Aderyn and hevm by version and sha256, the Semgrep rules and 4naly3er
# by commit and Necessist by crate version in contracts/script/install-security-tools.sh; Gambit is the binary in the
# pinned certora-cli wheel.

on:
  schedule:
    # Nightly at 06:00 UTC on main (GitHub runs a schedule on the default branch only).
    - cron: "0 6 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      campaign:
        description: "Pre-audit 24-hour Echidna and Medusa campaign of one layer (none: the slow tier)"
        required: true
        type: choice
        default: none
        options: [none, "2.1", "2.2", "2.3", "2.4", "2.5", "2.6", other]

concurrency:
  # A newer run waits for the running slow tier instead of cancelling it; a campaign has its own group.
  group: security-slow-${{ github.ref }}-${{ inputs.campaign || 'none' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_VERSION: "0.13.1"
  # Slow-tier budgets: per harness and mode for the fuzzers, per query for hevm. The fuzz seed is fresh every run.
  ECHIDNA_TEST_LIMIT: "1000000"
  ECHIDNA_TIMEOUT: "1800"
  MEDUSA_TIMEOUT: "1800"
  HEVM_SMT_TIMEOUT: "600"
  HALMOS_LOOP: "16"
  # A campaign job fuzzes one harness in one mode for 3 hours (ECHIDNA_TIMEOUT and MEDUSA_TIMEOUT 10,800 in the
  # campaign jobs); eight of them make the 24 hours.
  CAMPAIGN_SEGMENTS: "8"
  CAMPAIGN: ${{ inputs.campaign || 'none' }}

defaults:
  run:
    working-directory: contracts

jobs:
  build:
    name: slow-tier build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - run: forge soldeer install

      - name: Build src/, test/ and script/ with build info
        run: |
          script/security-slow.sh build
          test -d out-security/build/all/build-info

      - name: Build for Halmos (the command Halmos runs, so each Halmos job finds it compiled)
        if: env.CAMPAIGN == 'none'
        env:
          FOUNDRY_DYNAMIC_TEST_LINKING: "false"
        run: forge build --ast --root . --extra-output storageLayout metadata

      - name: Upload the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slow-build
          path: |
            contracts/out-security/build
            contracts/out-security/build-all.txt
            contracts/out
            contracts/cache
          if-no-files-found: error
          retention-days: 7

  plan:
    name: plan the jobs
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      echidna: ${{ steps.plan.outputs.echidna }}
      medusa: ${{ steps.plan.outputs.medusa }}
      halmos: ${{ steps.plan.outputs.halmos }}
      hevm: ${{ steps.plan.outputs.hevm }}
      mythril: ${{ steps.plan.outputs.mythril }}
      campaign-harnesses: ${{ steps.plan.outputs.campaign-harnesses }}
      campaign-echidna: ${{ steps.plan.outputs.campaign-echidna }}
      campaign-medusa: ${{ steps.plan.outputs.campaign-medusa }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: slow-build
          path: contracts

      - name: List every target (script/ci-shards.py)
        id: plan
        run: |
          set -euo pipefail
          B=out-security/build/all
          # Each list is computed before it is written, so a failing listing fails this job.
          out() { echo "$1=$2" | tee -a "$GITHUB_OUTPUT"; }
          if [ "$CAMPAIGN" = none ]; then
            for t in echidna medusa hevm mythril; do legs=$(python3 script/ci-shards.py "$t" "$B"); out "$t" "$legs"; done
            legs=$(python3 script/ci-shards.py halmos); out halmos "$legs"
            for t in campaign-harnesses campaign-echidna campaign-medusa; do out "$t" '[]'; done
          else
            for t in echidna medusa halmos hevm mythril; do out "$t" '[]'; done
            legs=$(python3 script/ci-shards.py campaign-harnesses "$B" "$CAMPAIGN"); out campaign-harnesses "$legs"
            legs=$(python3 script/ci-shards.py campaign "$B" "$CAMPAIGN" echidna); out campaign-echidna "$legs"
            legs=$(python3 script/ci-shards.py campaign "$B" "$CAMPAIGN" medusa); out campaign-medusa "$legs"
          fi

  echidna:
    name: echidna ${{ matrix.harness }}
    needs: plan
    if: needs.plan.outputs.echidna != '[]'
    runs-on: ubuntu-24.04
    # Property and assertion mode at ECHIDNA_TIMEOUT (30 minutes) each: about 1 hour 10 minutes with set-up.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.echidna) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Cache pinned security binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/tools/bin
          key: security-bin-echidna-${{ runner.os }}-${{ hashFiles('contracts/script/install-security-tools.sh') }}

      - name: Install dependencies and pinned tools
        env:
          BINARIES: echidna
        run: |
          forge soldeer install
          script/install-security-tools.sh --binaries --python

      - name: Reuse the build job's output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: slow-build
          path: contracts

      - name: Restore the harness's corpus of earlier runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/out-security/corpus
          key: security-corpus-echidna-${{ matrix.harness }}-${{ github.run_id }}
          restore-keys: security-corpus-echidna-${{ matrix.harness }}-

      - name: Echidna on ${{ matrix.harness }}, property and assertion mode
        env:
          ECHIDNA_HARNESSES: ${{ matrix.harness }}
        run: script/security-slow.sh echidna

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-slow-echidna-${{ matrix.harness }}
          path: |
            contracts/out-security
            !contracts/out-security/build
            !contracts/out-security/corpus
          retention-days: 30

  medusa:
    name: medusa ${{ matrix.harness }}
    needs: plan
    if: needs.plan.outputs.medusa != '[]'
    # FALLBACK (not in use): Medusa now fuzzes each harness on a build of its own file and imports
    # (script/security-slow.sh medusa), since on the build of everything every job of run 43387180884 lost its
    # runner 10 to 16 minutes in. If a harness's campaign still loses the 4-vCPU, 16 GB runner, move this job (and
    # campaign-medusa) to a larger runner, for example `runs-on: ubuntu-24.04-8core` once one is set up for the
    # organisation; the workers, timeout and test limit stay as they are.
    runs-on: ubuntu-24.04
    # A build of the harness, one campaign at MEDUSA_TIMEOUT (30 minutes) plus Medusa's Slither pass: under 1 hour
    # with set-up.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.medusa) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Cache pinned security binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/tools/bin
          key: security-bin-medusa-${{ runner.os }}-${{ hashFiles('contracts/script/install-security-tools.sh') }}

      - name: Install dependencies and pinned tools
        env:
          BINARIES: medusa
        run: |
          forge soldeer install
          script/install-security-tools.sh --binaries --python

      - name: Reuse the build job's output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: slow-build
          path: contracts

      - name: Restore the harness's corpus of earlier runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/out-security/corpus
          key: security-corpus-medusa-${{ matrix.harness }}-${{ github.run_id }}
          restore-keys: security-corpus-medusa-${{ matrix.harness }}-

      - name: Medusa on ${{ matrix.harness }}
        env:
          MEDUSA_HARNESSES: ${{ matrix.harness }}
        run: script/security-slow.sh medusa

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-slow-medusa-${{ matrix.harness }}
          path: |
            contracts/out-security
            !contracts/out-security/build
            !contracts/out-security/corpus
          retention-days: 30

  halmos:
    name: halmos ${{ matrix.contract }}.${{ matrix.check }}
    needs: plan
    if: needs.plan.outputs.halmos != '[]'
    runs-on: ubuntu-24.04
    # One Halmos test function at loop 16. Halmos runs a contract's tests one after another and has no wall-clock
    # bound of its own (--solver-timeout-assertion 0), so each check runs alone in a job of GitHub's maximum time,
    # 6 hours, and within a wall-clock budget of 5 hours (HALMOS_TIMEOUT below, or the check's entry in
    # contracts/security/halmos-bounds.json), so the job ends with its log and outcome uploaded instead of being
    # cancelled. Outcomes (script/halmos-outcome.py): a counterexample fails; a listed check that the budget or a
    # solver timeout ends without one is "bounded, no violation found" (not run to completion), passes the job and
    # is written to the job summary, a warning annotation and out-security/halmos-outcome.json; an unlisted check
    # that runs out fails, so a new slow check is noticed. The 23 listed checks were cancelled at 6 hours in run
    # 43492412351; their fuzz twins run at 10,000 runs on every pull request.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.halmos) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Install dependencies and pinned tools
        run: |
          forge soldeer install
          script/install-security-tools.sh --python

      - name: Reuse the build job's output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: slow-build
          path: contracts

      - name: Halmos on ${{ matrix.contract }}.${{ matrix.check }} (${{ matrix.file }})
        env:
          HALMOS_CONTRACTS: ${{ matrix.contract }}
          HALMOS_TESTS: ${{ matrix.check }}
          # Halmos and its solver run in a systemd scope capped at 14 GB of the runner's 16 GB, without swap, so a
          # check that needs more ends with "OUT OF MEMORY" in this log instead of the runner shutting down (run
          # 43387180884, check_PROP_019_legSlippage). It runs one solver thread (script/security-slow.sh).
          SECURITY_MEMORY_MAX: "14G"
          # 5 hours of wall clock for a check not in contracts/security/halmos-bounds.json (each listed check has its
          # own budget there), leaving the rest of the 6 hours for set-up, the SIGKILL grace and the upload. The
          # script requires "1 passed; 0 failed" for a pass, since each job runs one check.
          HALMOS_TIMEOUT: "18000"
        run: script/security-slow.sh halmos

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-slow-halmos-${{ matrix.contract }}-${{ matrix.check }}
          path: |
            contracts/out-security
            !contracts/out-security/build
            !contracts/out-security/corpus
          retention-days: 30

  hevm:
    name: hevm ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.hevm != '[]'
    runs-on: ubuntu-24.04
    # One harness's assertion entry points, or one src/ contract's runtime code, at HEVM_SMT_TIMEOUT per query. hevm
    # has no wall-clock bound of its own; the job timeout is the bound.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.hevm) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Cache pinned security binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/tools/bin
          key: security-bin-hevm-${{ runner.os }}-${{ hashFiles('contracts/script/install-security-tools.sh') }}

      - name: Install dependencies and pinned tools
        env:
          BINARIES: hevm
        run: |
          forge soldeer install
          script/install-security-tools.sh --binaries --python

      - name: Reuse the build job's output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: slow-build
          path: contracts

      - name: hevm on ${{ matrix.target }}
        env:
          HEVM_TARGETS: ${{ matrix.target }}
          # One z3 instance per hevm run with 10 GB (hevm's default is one instance per CPU at 1 GB each, and z3 ran
          # out of memory at 1 GB in run 43387180884), and hevm with its solver in a systemd scope capped at 14 GB of
          # the runner's 16 GB, without swap, so a run that needs more ends with "OUT OF MEMORY" in this log instead
          # of the runner shutting down (PositionProxyProperties in that run). The local anvil chain runs outside it.
          HEVM_SMT_MEMORY: "10240"
          SECURITY_MEMORY_MAX: "14G"
        run: script/security-slow.sh hevm

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-slow-hevm-${{ matrix.id }}
          path: |
            contracts/out-security
            !contracts/out-security/build
            !contracts/out-security/corpus
          retention-days: 30

  mythril:
    name: mythril group ${{ matrix.group }}
    needs: plan
    if: needs.plan.outputs.mythril != '[]'
    runs-on: ubuntu-24.04
    # Up to eight contracts at MYTHRIL_EXECUTION_TIMEOUT (15 minutes) each, plus the issue checks: about 2 hours.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.mythril) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Install dependencies and pinned tools
        run: |
          forge soldeer install
          script/install-security-tools.sh --python

      - name: Reuse the build job's output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: slow-build
          path: contracts

      - name: Mythril on ${{ matrix.contracts }}
        env:
          MYTHRIL_CONTRACTS: ${{ matrix.contracts }}
        run: script/security-slow.sh mythril

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-slow-mythril-${{ matrix.group }}
          path: |
            contracts/out-security
            !contracts/out-security/build
            !contracts/out-security/corpus
          retention-days: 30

  campaign-echidna-property:
    name: campaign echidna ${{ matrix.harness }} property ${{ matrix.segment }}/8
    needs: plan
    if: needs.plan.outputs.campaign-echidna != '[]'
    runs-on: ubuntu-24.04
    # 3 hours of fuzzing plus set-up and the crytic export.
    timeout-minutes: 230
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.campaign-echidna) }}
    env:
      ECHIDNA_MODES: property
      ECHIDNA_TIMEOUT: "10800"
      # The time bound ends the campaign; the call limit is set above anything 3 hours reaches.
      ECHIDNA_TEST_LIMIT: "1000000000000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Cache pinned security binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/tools/bin
          key: security-bin-echidna-${{ runner.os }}-${{ hashFiles('contracts/script/install-security-tools.sh') }}

      - name: Install dependencies and pinned tools
        env:
          BINARIES: echidna
        run: |
          forge soldeer install
          script/install-security-tools.sh --binaries --python

      - name: Reuse the build job's output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: slow-build
          path: contracts

      - name: Restore the harness's stored corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
