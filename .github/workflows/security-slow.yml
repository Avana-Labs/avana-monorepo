          retention-days: 30

  campaign-merge:
    name: campaign corpus ${{ matrix.harness }}
    # Joins the eight segment corpora of each harness and mode (corpus files are named by content, so the union is a
    # plain copy) and stores them as the harness's corpus, which the next slow-tier run and campaign restore. Runs
    # after every segment ended, also when one failed, so the corpus of a campaign that found a failure is kept.
    needs: [plan, campaign-echidna-property, campaign-echidna-assertion, campaign-medusa]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.campaign-harnesses != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.campaign-harnesses) }}
    steps:
      - name: Echidna corpus, property mode
        if: matrix.echidna
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: campaign-corpus-echidna-${{ matrix.harness }}-property-*
          path: contracts/out-security/corpus/echidna/${{ matrix.harness }}-property
          merge-multiple: true

      - name: Echidna corpus, assertion mode
        if: matrix.echidna
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: campaign-corpus-echidna-${{ matrix.harness }}-assertion-*
          path: contracts/out-security/corpus/echidna/${{ matrix.harness }}-assertion
          merge-multiple: true

      - name: Store the merged Echidna corpus
        if: matrix.echidna
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/out-security/corpus
          key: security-corpus-echidna-${{ matrix.harness }}-${{ github.run_id }}

      - name: Set the Echidna corpus aside
        working-directory: .
        run: mkdir -p merged && mv contracts/out-security/corpus merged/ 2>/dev/null || true

      - name: Medusa corpus
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: campaign-corpus-medusa-${{ matrix.harness }}-*
          path: contracts/out-security/corpus/medusa/${{ matrix.harness }}
          merge-multiple: true

      - name: Store the merged Medusa corpus
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/out-security/corpus
          key: security-corpus-medusa-${{ matrix.harness }}-${{ github.run_id }}

      - name: Count the merged corpus
        working-directory: .
        run: |
          [ -d merged/corpus ] && cp -R merged/corpus/. contracts/out-security/corpus/
          find contracts/out-security/corpus -mindepth 2 -maxdepth 2 -type d | while read -r d; do
            echo "$d: $(find "$d" -type f | wc -l | tr -d ' ') files"
          done

      - name: Upload the merged corpus
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: campaign-corpus-${{ matrix.harness }}
          path: contracts/out-security/corpus
          retention-days: 90

  slow-gate:
    # The one check of this workflow: it passes only when the build, the plan and every job passed. A job with no
    # leg is skipped by its `if` (no target of that kind, or a campaign run, which skips the slow-tier jobs, or the
    # slow tier, which skips the campaign jobs); with the build and the plan passed, skipped can mean nothing else.
    name: slow-gate
    if: always()
    needs:
      - build
      - plan
      - echidna
      - medusa
      - halmos
      - hevm
      - mythril
      - campaign-echidna-property
      - campaign-echidna-assertion
      - campaign-medusa
      - campaign-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        working-directory: .
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[]
            | select(.value.result != "success")
            | select(.value.result != "skipped" or .key == "build" or .key == "plan")
            | .key] | join(", ")')
          if [ -n "$bad" ]; then echo "not passed: $bad"; exit 1; fi
