name: security-slow

# Slow security tier, by hand only (workflow_dispatch; no schedule and no tag trigger since 2026-11-17): Echidna,
# Medusa, Halmos, hevm and Mythril with the slow-tier budgets. Run it after
# a large protocol change and on the commit of a release tag before an upgrade (script/upgrade-operation.py needs a
# successful slow-tier run on the implementation's commit). Pull requests run contracts.yml only.
# The `build` job compiles once (script/security-slow.sh build, and the build Halmos runs); `plan` lists the targets
# from that build with script/ci-shards.py; every target then runs in its own job, reusing the build: one per Echidna
# harness (both modes), one per Medusa harness, one per Halmos test function (a 1-hour budget), six for hevm (its
# targets, each harness's assertion entry points and each src/ contract, in batches of about equal time), and one per
# group of eight src/ contracts for Mythril. hevm and Mythril analyse each src/ source once, from the artifact of the
# compiler profile it is deployed with (script/security-targets.py `deployed`); every other job has at most 4 hours. A new harness, Halmos test or src/ contract gets its own job on the
# next run. `slow-gate` passes only when every job passed; a Halmos check that does not complete within its budget
# fails its job (see the halmos job). By hand, `tools: halmos` runs only the Halmos jobs (of `halmos_contracts` and `halmos_checks`).
# By hand, `campaign` runs the pre-audit fuzzing campaign of one layer instead: every harness of the layer gets 24
# hours of Echidna per mode and 24 hours of Medusa, as eight parallel 3-hour jobs per harness and mode, each with a
# fresh seed and starting from the stored corpus; `campaign-merge` then joins the eight corpora of each harness and
# stores the result as that harness's corpus, which every later slow-tier run replays.
# Tool versions are pinned: Foundry by contracts/.foundry-version, Node by .nvmrc, every action by commit SHA (the
# release tag in the trailing comment), dependencies by soldeer.lock, Python tools (Slither, Halmos, Semgrep, ...)
# by contracts/requirements.txt and contracts/requirements-mythril.txt, solhint and @openzeppelin/upgrades-core by
# contracts/package-lock.json, Echidna, Medusa, Aderyn and hevm by version and sha256, the Semgrep rules and 4naly3er
# by commit and Necessist by crate version in contracts/script/install-security-tools.sh; Gambit is the binary in the
# pinned certora-cli wheel.

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: "Pre-audit 24-hour Echidna and Medusa campaign of one layer (none: the slow tier)"
        required: true
        type: choice
        default: none
        options: [none, "2.1", "2.2", "2.3", "2.4", "2.5", "2.6", other]
      tools:
        description: "Slow-tier tools to run (all, or halmos alone)"
        required: false
        type: choice
        default: all
        options: [all, halmos]
      halmos_contracts:
        description: "Halmos test contracts to run, space-separated (empty: all)"
        required: false
        type: string
        default: ""
      halmos_checks:
        description: "Halmos check functions to run, space-separated (empty: all of the selected contracts)"
        required: false
        type: string
        default: ""
      only:
        # One or a few slow-tier targets, to prove a change to them without the whole tier: the plan keeps only these
        # (Halmos then runs none), and a name that matches no target fails the plan.
        description: "Only these targets, space-separated: echidna:<Harness>, medusa:<Harness>, hevm:harness:<Name>, hevm:src:<Name>, mythril:<Contract> (empty: all)"
        required: false
        type: string
        default: ""

concurrency:
  # A newer run waits for the running slow tier instead of cancelling it; a campaign has its own group.
  group: security-slow-${{ github.ref }}-${{ inputs.campaign || 'none' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_VERSION: "0.13.1"
  # Slow-tier budgets: per harness and mode for the fuzzers, per query and per entry point for hevm. The fuzz seed is
  # fresh every run and each harness starts from its stored corpus. In runs 43595414156 to 43677588077 coverage stopped
  # growing between 3 s and 12 minutes into a 30-minute campaign (Echidna) and branches stayed flat after 2 to 6
  # minutes (Medusa), so each campaign gets 10 minutes; the pre-audit campaign (`campaign`) keeps its 24 hours.
  ECHIDNA_TEST_LIMIT: "100000"
  ECHIDNA_TIMEOUT: "600"
  MEDUSA_TIMEOUT: "600"
  HEVM_SMT_TIMEOUT: "600"
  # Wall clock per hevm run (one entry point of a harness, or one src/ contract): past it the entry point fails as
  # timed out (a src/ contract is reported, as when explored partially). See script/security-slow.sh hevm_symbolic.
  HEVM_ENTRY_TIMEOUT: "5400"
  # Entry points whose timeout is reported, not failed (space-separated <Harness>.<entry>). None today.
  HEVM_TIMEOUT_REPORTED: ""
  # hevm targets per run go to this many jobs (script/hevm-batches.py, by the times in script/hevm-timings.json).
  HEVM_BATCHES: "6"
  HALMOS_LOOP: "16"
  # A campaign job fuzzes one harness in one mode for 3 hours (ECHIDNA_TIMEOUT and MEDUSA_TIMEOUT 10,800 in the
  # campaign jobs); eight of them make the 24 hours.
  CAMPAIGN_SEGMENTS: "8"
  CAMPAIGN: ${{ inputs.campaign || 'none' }}
  TOOLS: ${{ inputs.tools || 'all' }}
  HALMOS_ONLY_CONTRACTS: ${{ inputs.halmos_contracts || '' }}
  HALMOS_ONLY_CHECKS: ${{ inputs.halmos_checks || '' }}
  ONLY: ${{ inputs.only || '' }}

defaults:
  run:
    working-directory: contracts

jobs:
  build:
    name: slow-tier build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Install dependencies and the pinned solc versions
        run: |
          forge soldeer install
          script/install-security-tools.sh --solc

      - name: Build src/, test/ and script/ with build info
        # The strict pass and the build-info build serve Echidna, Medusa, hevm and Mythril; a run of the Halmos jobs
        # alone (`tools: halmos`) skips both. The full tier keeps the strict warnings check.
        if: env.TOOLS != 'halmos'
        run: |
          script/security-slow.sh build
          test -d out-security/build/all/build-info

      # The Halmos build's output and cache from an earlier run: forge then recompiles only the files that changed.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.CAMPAIGN == 'none'
        with:
          path: |
            contracts/out-halmos
            contracts/cache-halmos
          key: halmos-build-${{ hashFiles('contracts/.foundry-version', 'contracts/foundry.toml', 'contracts/soldeer.lock', 'contracts/src/**/*.sol', 'contracts/test/**/*.sol') }}
          restore-keys: halmos-build-

      - name: Build for Halmos (the command Halmos runs, so each Halmos job finds it compiled)
        if: env.CAMPAIGN == 'none'
        env:
          FOUNDRY_DYNAMIC_TEST_LINKING: "false"
          FOUNDRY_PROFILE: halmos
        run: forge build --ast --root . --extra-output storageLayout metadata

      - name: Upload the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slow-build
          path: |
            contracts/out-security/build
            contracts/out-security/build-all.txt
            contracts/out-halmos
            contracts/cache-halmos
          if-no-files-found: error
          retention-days: 7

  plan:
    name: plan the jobs
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      echidna: ${{ steps.plan.outputs.echidna }}
      medusa: ${{ steps.plan.outputs.medusa }}
      halmos: ${{ steps.plan.outputs.halmos }}
      hevm: ${{ steps.plan.outputs.hevm }}
      mythril: ${{ steps.plan.outputs.mythril }}
      campaign-harnesses: ${{ steps.plan.outputs.campaign-harnesses }}
      campaign-echidna: ${{ steps.plan.outputs.campaign-echidna }}
      campaign-medusa: ${{ steps.plan.outputs.campaign-medusa }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: slow-build
          path: contracts

      - name: List every target (script/ci-shards.py)
        id: plan
        run: |
          set -euo pipefail
          B=out-security/build/all
          # Each list is computed before it is written, so a failing listing fails this job.
          out() { echo "$1=$2" | tee -a "$GITHUB_OUTPUT"; }
          if [ "$CAMPAIGN" = none ]; then
            # By hand, `tools: halmos` runs the Halmos jobs alone, `halmos_contracts` keeps those of the named test
            # contracts and `halmos_checks` those of the named check functions.
            # `only`: the names given for a tool ("<tool>:<name>"), space-separated; the tool runs nothing when none.
            pick() { tr ' ' '\n' <<<"$ONLY" | sed -n "s/^$1://p" | tr '\n' ' '; }
            # keep <legs> <field> <names>: the legs whose <field> is one of <names>; fails when a name matches none.
            keep() {
              local kept
              kept=$(jq -c --arg f "$2" --arg names "$3" '($names | split(" ") | map(select(. != ""))) as $n
                | map(select(.[$f] as $v | $n | index($v)))' <<<"$1")
              for n in $3; do
                jq -e --arg f "$2" --arg n "$n" 'any(.[]; .[$f] == $n)' <<<"$kept" >/dev/null || { echo "no target: $n" >&2; return 1; }
              done
              echo "$kept"
            }
            for w in $ONLY; do
              [[ "$w" =~ ^(echidna|medusa|hevm|mythril):. ]] || { echo "only: $w is not <echidna|medusa|hevm|mythril>:<name>"; exit 1; }
            done
            for t in echidna medusa hevm mythril; do
              if [ "$TOOLS" = halmos ]; then out "$t" '[]'; continue; fi
              legs=$(python3 script/ci-shards.py "$t" "$B")
              if [ -n "$ONLY" ]; then
                names=$(pick "$t")
                if [ -z "$names" ]; then legs='[]'
                elif [ "$t" = mythril ]; then
                  # One group of the named contracts; security-mythril.sh fails on a name it does not find.
                  legs=$(jq -cn --arg c "${names% }" '[{group: "only", contracts: $c}]')
                elif [ "$t" = hevm ]; then legs=$(keep "$legs" target "$names")
                else legs=$(keep "$legs" harness "$names"); fi
              fi
              # hevm: the targets in HEVM_BATCHES jobs of about equal time instead of one job each.
              [ "$t" != hevm ] || [ "$legs" = '[]' ] || legs=$(python3 script/hevm-batches.py "$HEVM_BATCHES" <<<"$legs")
              out "$t" "$legs"
            done
            legs=$(python3 script/ci-shards.py halmos)
            [ -z "$ONLY" ] || legs='[]'
            if [ -n "$HALMOS_ONLY_CONTRACTS" ]; then
              legs=$(echo "$legs" | jq -c --arg names "$HALMOS_ONLY_CONTRACTS"                 '($names | split(" ") | map(select(. != ""))) as $n | map(select(.contract as $c | $n | index($c)))')
              [ "$legs" != '[]' ] || { echo "no Halmos check in: $HALMOS_ONLY_CONTRACTS"; exit 1; }
            fi
            if [ -n "$HALMOS_ONLY_CHECKS" ]; then
              legs=$(echo "$legs" | jq -c --arg names "$HALMOS_ONLY_CHECKS"                 '($names | split(" ") | map(select(. != ""))) as $n | map(select(.check as $c | $n | index($c)))')
              [ "$legs" != '[]' ] || { echo "no Halmos check named: $HALMOS_ONLY_CHECKS"; exit 1; }
            fi
            out halmos "$legs"
            for t in campaign-harnesses campaign-echidna campaign-medusa; do out "$t" '[]'; done
          else
            for t in echidna medusa halmos hevm mythril; do out "$t" '[]'; done
            legs=$(python3 script/ci-shards.py campaign-harnesses "$B" "$CAMPAIGN"); out campaign-harnesses "$legs"
            legs=$(python3 script/ci-shards.py campaign "$B" "$CAMPAIGN" echidna); out campaign-echidna "$legs"
            legs=$(python3 script/ci-shards.py campaign "$B" "$CAMPAIGN" medusa); out campaign-medusa "$legs"
          fi

  echidna:
    name: echidna ${{ matrix.harness }}
    needs: plan
    if: needs.plan.outputs.echidna != '[]'
    runs-on: ubuntu-24.04
    # Property and assertion mode at ECHIDNA_TIMEOUT (10 minutes) each: about 30 minutes with set-up.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.echidna) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Cache pinned security binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/tools/bin
          key: security-bin-echidna-${{ runner.os }}-${{ hashFiles('contracts/script/install-security-tools.sh') }}

      - name: Install dependencies and pinned tools
        env:
          BINARIES: echidna
        run: |
          forge soldeer install
          script/install-security-tools.sh --solc --binaries --python

      - name: Reuse the build job's output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: slow-build
          path: contracts

      - name: Restore the harness's corpus of earlier runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/out-security/corpus
          key: security-corpus-echidna-${{ matrix.harness }}-${{ github.run_id }}
          restore-keys: security-corpus-echidna-${{ matrix.harness }}-

      - name: Echidna on ${{ matrix.harness }}, property and assertion mode
        env:
          ECHIDNA_HARNESSES: ${{ matrix.harness }}
        run: script/security-slow.sh echidna

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-slow-echidna-${{ matrix.harness }}
          path: |
            contracts/out-security
            !contracts/out-security/build
            !contracts/out-security/corpus
          retention-days: 30

  medusa:
    name: medusa ${{ matrix.harness }}
    needs: plan
    if: needs.plan.outputs.medusa != '[]'
    # FALLBACK (not in use): Medusa now fuzzes each harness on a build of its own file and imports
    # (script/security-slow.sh medusa), since on the build of everything every job of run 43387180884 lost its
    # runner 10 to 16 minutes in. If a harness's campaign still loses the 4-vCPU, 16 GB runner, move this job (and
    # campaign-medusa) to a larger runner, for example `runs-on: ubuntu-24.04-8core` once one is set up for the
    # organisation; the workers, timeout and test limit stay as they are.
    runs-on: ubuntu-24.04
    # A build of the harness, one campaign at MEDUSA_TIMEOUT (10 minutes) with one worker per CPU, plus Medusa's
    # Slither pass: about 25 minutes with set-up.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.medusa) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Cache pinned security binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/tools/bin
          key: security-bin-medusa-${{ runner.os }}-${{ hashFiles('contracts/script/install-security-tools.sh') }}

      - name: Install dependencies and pinned tools
        env:
          BINARIES: medusa
        run: |
          forge soldeer install
          script/install-security-tools.sh --solc --binaries --python

      - name: Reuse the build job's output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: slow-build
          path: contracts

      - name: Restore the harness's corpus of earlier runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/out-security/corpus
          key: security-corpus-medusa-${{ matrix.harness }}-${{ github.run_id }}
          restore-keys: security-corpus-medusa-${{ matrix.harness }}-

      - name: Medusa on ${{ matrix.harness }}
        env:
          MEDUSA_HARNESSES: ${{ matrix.harness }}
        run: script/security-slow.sh medusa

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-slow-medusa-${{ matrix.harness }}
          path: |
            contracts/out-security
            !contracts/out-security/build
            !contracts/out-security/corpus
          retention-days: 30

  halmos:
    name: halmos ${{ matrix.contract }}.${{ matrix.check }}
    needs: plan
    if: needs.plan.outputs.halmos != '[]'
    runs-on: ubuntu-24.04
    # One Halmos test function at loop 16. Halmos runs a contract's tests one after another and has no wall-clock
    # bound of its own (--solver-timeout-assertion 0), so each check runs alone in its job, within a wall-clock budget
    # of 1 hour (HALMOS_TIMEOUT below), so the job ends with its log and outcome uploaded instead of being cancelled.
    # Outcomes (script/halmos-outcome.py): a counterexample fails, and so does a check that the budget or a solver
    # timeout ends before it completes; every check is written to the job summary and out-security/halmos-outcome.json.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.halmos) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Install dependencies and pinned tools
        # Bitwuzla: the pinned solver of the checks annotated `--solver bitwuzla`; Halmos finds it on PATH (tools/bin).
        run: |
          forge soldeer install
          BINARIES=bitwuzla script/install-security-tools.sh --solc --python --binaries

      - name: Reuse the build job's output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: slow-build
          path: contracts

      - name: Halmos on ${{ matrix.contract }}.${{ matrix.check }} (${{ matrix.file }})
        env:
          # The build job's Halmos build (out-halmos/), so Halmos finds every file compiled.
          FOUNDRY_PROFILE: halmos
          HALMOS_CONTRACTS: ${{ matrix.contract }}
          HALMOS_TESTS: ${{ matrix.check }}
          # Halmos and its solver run in a systemd scope capped at 14 GB of the runner's 16 GB, without swap, so a
          # check that needs more ends with "OUT OF MEMORY" in this log instead of the runner shutting down (run
          # 43387180884, check_PROP_019_legSlippage). It runs one solver thread (script/security-slow.sh).
          SECURITY_MEMORY_MAX: "14G"
          # 1 hour of wall clock per check (each completes in well under 40 minutes), leaving the rest of the job for
          # set-up, the SIGKILL grace and the upload. The script requires "1 passed; 0 failed" for a pass, since each
          # job runs one check; contracts/security/halmos-bounds.json must list no check.
          HALMOS_TIMEOUT: "3600"
        run: script/security-slow.sh halmos

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-slow-halmos-${{ matrix.contract }}-${{ matrix.check }}
          path: |
            contracts/out-security
            !contracts/out-security/build
            !contracts/out-security/corpus
          retention-days: 30

  hevm:
    name: hevm batch ${{ matrix.batch }}
    needs: plan
    if: needs.plan.outputs.hevm != '[]'
    runs-on: ubuntu-24.04
    # A batch of targets (each harness's assertion entry points, each src/ contract's runtime code), about 2.2 hours
    # each by the measured times, at HEVM_SMT_TIMEOUT per query and HEVM_ENTRY_TIMEOUT per entry point, so no target
    # takes the job's time from the others. The job limit stays under GitHub's 6 hours.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.hevm) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Cache pinned security binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/tools/bin
          key: security-bin-hevm-${{ runner.os }}-${{ hashFiles('contracts/script/install-security-tools.sh') }}

      - name: Install dependencies and pinned tools
        env:
          BINARIES: hevm
        run: |
          forge soldeer install
          script/install-security-tools.sh --solc --binaries --python

      - name: Reuse the build job's output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: slow-build
          path: contracts

      - name: hevm on batch ${{ matrix.batch }} (${{ matrix.targets }})
        env:
          HEVM_TARGETS: ${{ matrix.targets }}
          # One z3 instance per hevm run with 10 GB (hevm's default is one instance per CPU at 1 GB each, and z3 ran
          # out of memory at 1 GB in run 43387180884), and hevm with its solver in a systemd scope capped at 14 GB of
          # the runner's 16 GB, without swap, so a run that needs more ends with "OUT OF MEMORY" in this log instead
          # of the runner shutting down (PositionProxyProperties in that run). The local anvil chain runs outside it.
          HEVM_SMT_MEMORY: "10240"
          SECURITY_MEMORY_MAX: "14G"
        run: script/security-slow.sh hevm

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-slow-hevm-${{ matrix.id }}
          path: |
            contracts/out-security
            !contracts/out-security/build
            !contracts/out-security/corpus
          retention-days: 30

  mythril:
