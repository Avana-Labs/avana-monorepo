      - name: Reuse the build job's output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: slow-build
          path: contracts

      - name: Restore the harness's stored corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/out-security/corpus
          key: security-corpus-medusa-${{ matrix.harness }}-
          restore-keys: security-corpus-medusa-${{ matrix.harness }}-

      - name: Medusa on ${{ matrix.harness }}, segment ${{ matrix.segment }}
        env:
          MEDUSA_HARNESSES: ${{ matrix.harness }}
        run: script/security-slow.sh medusa

      - name: Upload this segment's corpus
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: campaign-corpus-medusa-${{ matrix.harness }}-${{ matrix.segment }}
          path: contracts/out-security/corpus/medusa/${{ matrix.harness }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
