      - name: Install dependencies and pinned tools
        env:
          BINARIES: echidna
        run: |
          forge soldeer install
          script/install-security-tools.sh --binaries --python

      - name: Reuse the build job's output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: slow-build
          path: contracts

      - name: Restore the harness's stored corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: contracts/out-security/corpus
          key: security-corpus-echidna-${{ matrix.harness }}-
          restore-keys: security-corpus-echidna-${{ matrix.harness }}-

      - name: Echidna on ${{ matrix.harness }}, assertion mode, segment ${{ matrix.segment }}
        env:
          ECHIDNA_HARNESSES: ${{ matrix.harness }}
        run: script/security-slow.sh echidna

      - name: Upload this segment's corpus
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: campaign-corpus-echidna-${{ matrix.harness }}-assertion-${{ matrix.segment }}
          path: contracts/out-security/corpus/echidna/${{ matrix.harness }}-assertion
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: campaign-echidna-${{ matrix.harness }}-assertion-${{ matrix.segment }}
          path: |
            contracts/out-security
            !contracts/out-security/build
            !contracts/out-security/corpus
          retention-days: 30

  campaign-medusa:
    name: campaign medusa ${{ matrix.harness }} ${{ matrix.segment }}/8
    needs: plan
    if: needs.plan.outputs.campaign-medusa != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 230
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.campaign-medusa) }}
    env:
      MEDUSA_TIMEOUT: "10800"
      # 0: no call limit, so the time bound ends the campaign.
      MEDUSA_TEST_LIMIT: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
