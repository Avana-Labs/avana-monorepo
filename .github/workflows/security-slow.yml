      - name: Upload this segment's corpus
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: campaign-corpus-echidna-${{ matrix.harness }}-property-${{ matrix.segment }}
          path: contracts/out-security/corpus/echidna/${{ matrix.harness }}-property
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: campaign-echidna-${{ matrix.harness }}-property-${{ matrix.segment }}
          path: |
            contracts/out-security
            !contracts/out-security/build
            !contracts/out-security/corpus
          retention-days: 30

