    env:
      MEDUSA_TIMEOUT: "10800"
      # 0: no call limit, so the time bound ends the campaign.
      MEDUSA_TEST_LIMIT: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
