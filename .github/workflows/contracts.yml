name: contracts

# Foundry workspace in contracts/: format, build, tests by profile, Halmos, SMTChecker, Certora and the two security
# tiers (fast-security on every push and pull request, slow-security nightly and on demand).
# Tool versions are pinned: Foundry by contracts/.foundry-version, Node by .nvmrc, every action by commit SHA (the
# release tag in the trailing comment), dependencies by soldeer.lock, Python tools (Slither, Halmos, Semgrep, ...)
# by contracts/requirements.txt and contracts/requirements-mythril.txt, solhint and @openzeppelin/upgrades-core by
# contracts/package-lock.json, Echidna, Medusa, Aderyn and hevm by version and sha256, the Semgrep rules and 4naly3er
# by commit and Necessist by crate version in contracts/script/install-security-tools.sh; Gambit is the binary in the
# pinned certora-cli wheel.

on:
  pull_request:
    paths:
      - "contracts/**"
      - "audit/**/*.sol"
      - "spec/05-verification/trace.py"
      - ".github/workflows/contracts.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "audit/**/*.sol"
      - "spec/05-verification/trace.py"
      - ".github/workflows/contracts.yml"
  schedule:
    # Nightly slow security tier (02:30 UTC).
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      layer:
        description: "Layer gate (2.1 ... 2.6): also run slither-mutate, Gambit and Necessist over that layer's contracts"
        required: false
        default: ""

concurrency:
  # The nightly run and push runs on main never cancel each other, and each manually dispatched layer gate has its
  # own group, so gates for different layers run side by side.
  group: contracts-${{ github.ref }}-${{ github.event_name }}-${{ inputs.layer || 'all' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.13.1"

defaults:
  run:
    working-directory: contracts

jobs:
  build:
    name: fmt, lint, build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Cache Soldeer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Install dependencies (soldeer.lock)
        # TEST-001: install fails if foundry.toml and soldeer.lock disagree.
        run: forge soldeer install

      - name: Check formatting
        run: forge fmt --check

      - name: File size limits (Q-240)
        # Implementation files at most 500 lines of code, interface files at most 300 lines including NatSpec.
        run: script/check-file-size.sh

      - name: Licence headers
        # BUSL-1.1 SPDX and Avana Labs copyright on every Avana-owned .sol file; ported files carry the identifier in
        # security/licence-allowlist.txt; no file carries UNLICENSED (LICENSING.md, THIRD_PARTY_LICENSES.md).
        run: script/check-licence.sh

      - name: Lint src
        run: forge lint src

      - name: Check the Foundry version against contracts/.foundry-version
        run: |
          forge --version | grep -F "Version: ${FOUNDRY_VERSION#v}"

      - name: Build
        run: forge build --sizes

      - name: Restore the base branch's contract sizes
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: contracts/out-security/sizes-base.json
          key: sizes-main-${{ github.event.pull_request.base.sha }}
          restore-keys: sizes-main-

      - name: Contract-size margins (EIP-170 minus security/size-margins.json), with the change against main
        run: |
          if [ -f out-security/sizes-base.json ]; then
            script/check-sizes.sh --base out-security/sizes-base.json | tee sizes.txt
          else
            script/check-sizes.sh | tee sizes.txt
          fi
          { echo '### Contract sizes'; echo '```'; cat sizes.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Record this commit's sizes as the base for pull requests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp out-security/sizes.json out-security/sizes-base.json

      - name: Save the base sizes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: contracts/out-security/sizes-base.json
          key: sizes-main-${{ github.sha }}

      - name: Build Aave V4 with Aave's compiler settings
        run: FOUNDRY_PROFILE=aave forge build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forge-out
          path: |
            contracts/out
            contracts/out-aave
          retention-days: 7

  test:
    name: tests (ci profile)
    if: github.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - run: forge soldeer install

      - name: Unit, fuzz, integration, hostile and invariant suites (10,000 runs, TEST-007)
        # A fresh seed per run widens coverage over time; the seed is printed for reproduction.
        run: |
          SEED=$(printf '0x%x' "$(date +%s)")
          echo "fuzz seed: $SEED"
          forge test --fuzz-seed "$SEED" -vvv

      - name: Gas snapshots (test/gas against the committed snapshots/)
        # The gas profile sets gas_snapshot_check: a measured value that differs from snapshots/<Group>.json fails the
        # step. `make gas` rewrites the snapshots; a PR that changes gas commits them.
        env:
          FOUNDRY_PROFILE: gas
          FORGE_SNAPSHOT_CHECK: "true"
        run: |
          if find test/gas -name '*.t.sol' 2>/dev/null | grep -q .; then
            forge test -vvv
          else
            echo "test/gas has no suites"
          fi

  invariant:
    name: deep invariant campaign
    if: github.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      FOUNDRY_PROFILE: invariant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - run: forge soldeer install

      - name: Invariant suites (2,000 runs, depth 400)
        run: forge test -vvv

  fork:
    name: Ethereum and Base fork tests
    # GitHub gives no repository secrets to pull requests opened from another repository or by Dependabot, so those
    # skip this job instead of failing it; pushes to main, other pull requests and manual runs always run it.
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FOUNDRY_PROFILE: fork
      RPC_MAINNET: ${{ secrets.RPC_MAINNET }}
      RPC_BASE: ${{ secrets.RPC_BASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require fork configuration
        # Fork blocks are pinned in test/utils/fixtures/ForkConstants.sol (TEST-003), never taken from CI variables.
        run: |
          test -n "$RPC_MAINNET" || { echo "secret RPC_MAINNET is not set"; exit 1; }
          test -n "$RPC_BASE" || { echo "secret RPC_BASE is not set"; exit 1; }

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Cache fork RPC responses for the pinned blocks
        # Keyed on the file that holds both pins, so a new Ethereum or Base block starts a fresh cache.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.foundry/cache/rpc
          key: rpc-${{ hashFiles('contracts/test/utils/fixtures/ForkConstants.sol') }}

      - run: forge soldeer install

      - name: Build Aave V4 artifacts for the fork fixture
        run: FOUNDRY_PROFILE=aave forge build

      - name: Fork tests (Uniswap v3, Chainlink, GHO FlashMinter, GSMs, Sky LitePSM)
        run: forge test -vvv

      - name: Hostile-component tests on the fork
        run: AVANA_FIXTURE=fork forge test --match-path 'test/hostile/**' -vvv

  differential:
    name: FFI differential (LPOracle vs mpmath)
    if: github.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FOUNDRY_PROFILE: differential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - run: forge soldeer install

      - name: Install the Python reference
        run: |
          python -m venv .venv
          if [ -f test/differential/reference/requirements.txt ]; then
            .venv/bin/pip install -r test/differential/reference/requirements.txt
          fi

      - name: Differential fuzzing (TEST-037)
        run: forge test -vvv

  halmos:
    name: Halmos
    if: github.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # Halmos has no deployCode cheatcode; dynamic test linking turns `new C(...)` in setUp into deployCode.
      FOUNDRY_DYNAMIC_TEST_LINKING: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/requirements.txt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - run: forge soldeer install

      - name: Install pinned Python tools
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Symbolic tests (check_PROP_*)
        run: |
          if grep -rqs --include='*.sol' 'function check_' test/halmos; then
            .venv/bin/halmos --root . --match-contract 'HalmosTest$' --loop 8 --solver-timeout-assertion 0
          else
            echo "test/halmos has no check_ functions"
          fi

  smtchecker:
    name: SMTChecker
    if: github.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FOUNDRY_PROFILE: smt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - run: forge soldeer install

      - name: Model-check the contracts listed in [profile.smt.model_checker]
        # Unproved targets are reported as warnings; a counterexample is a compiler error.
        run: forge build --force 2>&1 | tee smt.log

      - name: Fail on counterexamples
        # Counterexamples read "... happens here"; unproved targets read "... might happen here".
        run: "! grep -q 'happens here' smt.log"

  certora:
    name: Certora
    if: github.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CERTORAKEY: ${{ secrets.CERTORAKEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Skip without a Certora key
        if: env.CERTORAKEY == ''
        run: echo "CERTORAKEY is not configured; Certora rules were not run."

      - name: Read the pinned Foundry version

        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"


      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        if: env.CERTORAKEY != ''
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: env.CERTORAKEY != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/requirements.txt

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: env.CERTORAKEY != ''
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.CERTORAKEY != ''
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Install dependencies and certora-cli
        if: env.CERTORAKEY != ''
        run: |
          forge soldeer install
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/solc-0.8.28" https://github.com/ethereum/solidity/releases/download/v0.8.28/solc-static-linux
          chmod +x "$HOME/.local/bin/solc-0.8.28"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run every configuration in certora/conf
        if: env.CERTORAKEY != ''
        run: |
          status=0
          for conf in certora/conf/*.conf; do
            echo "=== $conf"
            .venv/bin/certoraRun "$conf" --wait_for_results all || status=1
          done
          exit $status

  traceability:
    name: traceability
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: spec/05-verification
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: "Every @custom:spec and verifies: tag names a defined ID"
        run: python3 trace.py

      - name: Coverage gaps (requirements without a test, property or Solidity link)
        # Reported in the job summary; blocking per TEST-008 once implementations and tests exist.
        continue-on-error: true
        run: |
          rc=0; python3 trace.py --strict > strict.txt || rc=$?
          { echo '### trace.py --strict'; echo '```'; tail -n 200 strict.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  coverage:
    name: branch coverage (per-file minimums)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - run: forge soldeer install

      - name: Build Aave V4 artifacts for the fixture
        run: FOUNDRY_PROFILE=aave forge build

      - name: forge coverage (coverage profile) and the minimums of security/coverage-thresholds.json
        run: script/check-coverage.sh

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: contracts/out-security/coverage
          retention-days: 14

  fast-security:
    name: security (fast tier)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Cache pinned security binaries, Semgrep rules and 4naly3er
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            contracts/tools/bin
            contracts/tools/semgrep-smart-contracts
            contracts/tools/4naly3er
          key: security-bin-${{ runner.os }}-${{ hashFiles('contracts/script/install-security-tools.sh') }}

      - name: Install dependencies and pinned tools (Slither, Semgrep, solhint, upgrades-core, Aderyn, rules, 4naly3er)
        env:
          BINARIES: aderyn
        run: |
          forge soldeer install
          script/install-security-tools.sh --binaries --python --node --rules --4naly3er

      - name: "forge fmt, file size, licence headers, forge lint, build, CVL methods check, solhint, Slither, upgradeability check, Aderyn, Semgrep, 4naly3er, storage layout"
        # Every contract under src/ is in scope as soon as it exists; the gates and triage files are in
        # slither.config.json, aderyn.toml, .solhint.json, foundry.toml [lint] and security/.
        run: script/security-fast.sh

      - name: Upload Slither SARIF
        if: ${{ !cancelled() && hashFiles('contracts/out-security/slither.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: contracts/out-security/slither.sarif
          category: slither

      - name: Upload Aderyn SARIF
        if: ${{ !cancelled() && hashFiles('contracts/out-security/aderyn.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: contracts/out-security/aderyn.sarif
          category: aderyn

      - name: Upload Semgrep SARIF
        if: ${{ !cancelled() && hashFiles('contracts/out-security/semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: contracts/out-security/semgrep.sarif
          category: semgrep

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-fast
          path: |
            contracts/out-security
            !contracts/out-security/build
          retention-days: 14

  slow-security:
    name: security (slow tier, ${{ matrix.tool }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # One leg per tool, so each has its own timeout and a stuck tool never starves the others.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: echidna
            binaries: echidna
            timeout: 300
          - tool: medusa
            binaries: medusa
            timeout: 300
          - tool: halmos
            binaries: ""
            timeout: 240
          - tool: hevm
            binaries: hevm
            timeout: 180
          - tool: mythril
            binaries: ""
            timeout: 240
    env:
      # Nightly budgets: per harness and mode for the fuzzers, per query for hevm. The fuzz seed is fresh every night.
      ECHIDNA_TEST_LIMIT: "1000000"
      ECHIDNA_TIMEOUT: "1800"
      MEDUSA_TIMEOUT: "1800"
      HEVM_SMT_TIMEOUT: "600"
      HALMOS_LOOP: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Cache pinned security binaries
        if: matrix.binaries != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: contracts/tools/bin
          key: security-bin-${{ matrix.tool }}-${{ runner.os }}-${{ hashFiles('contracts/script/install-security-tools.sh') }}

      - name: Install dependencies and pinned tools
        env:
          BINARIES: ${{ matrix.binaries }}
        run: |
          forge soldeer install
          script/install-security-tools.sh --binaries --python

      - name: Restore the fuzzing corpus of earlier nightly runs
        if: matrix.tool == 'echidna' || matrix.tool == 'medusa'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: contracts/out-security/corpus
          key: security-corpus-${{ matrix.tool }}-${{ github.run_id }}
          restore-keys: security-corpus-${{ matrix.tool }}-

      - name: Build src/, test/ and script/ with build info
        run: script/security-slow.sh build

      - name: Run ${{ matrix.tool }} on every harness and contract
        run: script/security-slow.sh ${{ matrix.tool }}

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-slow-${{ matrix.tool }}
          path: |
            contracts/out-security
            !contracts/out-security/build
            !contracts/out-security/corpus
          retention-days: 30

  layer-gate:
    name: layer gate ${{ inputs.layer }} (${{ matrix.tool }})
    # Foundry-suite mutation testing (slither-mutate statement mutants, Gambit expression mutants) and Necessist over
    # one layer's contracts (security/mutation-layers.json), run by hand at each layer gate: workflow_dispatch with the
    # `layer` input. The gambit leg fails on any surviving mutant not accepted in security/gambit-triage.json.
    if: github.event_name == 'workflow_dispatch' && inputs.layer != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        tool: [mutate, gambit, necessist]
    env:
      MUTATE_LAYERS: ${{ inputs.layer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Foundry version
        run: echo "FOUNDRY_VERSION=$(cat .foundry-version)" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: contracts/dependencies
          key: soldeer-${{ hashFiles('contracts/soldeer.lock') }}

      - name: Install dependencies and pinned tools
        # Necessist has no release binaries; the runner's preinstalled cargo builds the pinned crate into tools/bin.
        run: |
          forge soldeer install
          FOUNDRY_PROFILE=aave forge build
          script/install-security-tools.sh --python
          if [ "${{ matrix.tool }}" = gambit ]; then script/install-security-tools.sh --gambit; fi
          if [ "${{ matrix.tool }}" = necessist ]; then script/install-security-tools.sh --necessist; fi

      - name: Run ${{ matrix.tool }} on layer ${{ inputs.layer }}
        run: script/security-slow.sh ${{ matrix.tool }}

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layer-gate-${{ inputs.layer }}-${{ matrix.tool }}
          path: |
            contracts/out-security/mutation
            contracts/out-security/gambit
            contracts/out-security/necessist
            !contracts/out-security/mutation/root
            !contracts/out-security/gambit/root
            !contracts/out-security/necessist/root
          retention-days: 30
