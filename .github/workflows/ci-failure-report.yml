name: ci-failure-report

# Records why a CI run failed, so the reason is kept after the run's page scrolls away. When contracts, spec,
# security-slow, mutation-gate, gitleaks, services or models finishes:
# - on main (push or a manual run): a failure opens a GitHub issue labelled `ci-failure` (or comments on the open issue
#   of the same workflow and commit) with the failed jobs, failed steps, GitHub's annotations, the error lines and the
#   log tail of each failed step and links to the run and its artifacts; the next success of that workflow on main
#   comments on and closes its open `ci-failure` issues;
# - on a pull request: a failure adds the same report as a comment on the pull request.
# `.github/scripts/ci-failure-report.sh` builds the report. A workflow_run workflow runs from the default branch, so
# changes to this file take effect once merged into main.

on:
  workflow_run:
    workflows: [contracts, spec, security-slow, mutation-gate, gitleaks, services, models]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ci-failure-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  report:
    name: record the run's result
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'startup_failure' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Write the report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: bash .github/scripts/ci-failure-report.sh
