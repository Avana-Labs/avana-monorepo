name: models

# Python and Quint models outside the spec-stage quick path. Every pull request and every push to main runs the
# formal-verification areas of audit/formal-verification/ (each area's run.sh: every Z3, enumeration and Quint model,
# then check_ids.py where the area has one), the user simulation of audit/user-simulation/ (the reported run with
# --extra-seeds 4, and the deployment-topology grid one seed per job) and contract_checklist.py --all --check
# --links-only: every contract key of contract_checklist.py, and the TEST rows on no contract's checklist, must be
# linked by a tag on a test of their own (a row is "not run" here, since this workflow runs no test; contracts.yml's
# evidence job checks that the linked tests ran and passed), and check-mock-counterparts.py: every mocked external has a
# fork test on its chain (TEST-005). The nightly run (06:00 UTC), every
# release tag (`v*`) and every manual run also run the topology simulator checks of spec/05-verification/quint/topology_run.sh, the part that
# run_all.sh --nightly adds to the quick path; spec.yml runs the quick path. A simulation job also fails when a run
# reports an invariant violation, since run_simulation.py exits 0 whenever it completes.
# Tool versions are pinned: Python packages by spec/05-verification/requirements.txt, Quint by
# spec/05-verification/package-lock.json, Node by .nvmrc, every action by commit SHA (the release tag in the trailing
# comment).

on:
  pull_request:
    paths:
      - "audit/formal-verification/**"
      - "audit/user-simulation/**"
      - "audit/traceability/**"
      - "audit/design-review/**"
      - "spec/**"
      - "contracts/src/**"
      - "contracts/test/**"
      - "contracts/certora/**"
      - "contracts/script/check-mock-counterparts.py"
      - "contracts/script/mock-counterparts.json"
      - ".github/workflows/models.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "audit/formal-verification/**"
      - "audit/user-simulation/**"
      - "audit/traceability/**"
      - "audit/design-review/**"
      - "spec/**"
      - "contracts/src/**"
      - "contracts/test/**"
      - "contracts/certora/**"
      - "contracts/script/check-mock-counterparts.py"
      - "contracts/script/mock-counterparts.json"
      - ".github/workflows/models.yml"
  schedule:
    # Nightly at 06:00 UTC on main (GitHub runs a schedule on the default branch only).
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  # A newer pull-request run cancels the older one on the same ref; runs on main finish.
  group: models-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  formal-verification:
    name: formal verification (${{ matrix.area }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        area: [control, custody, liquidation]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spec/05-verification/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: spec/05-verification/package-lock.json

      - name: Install pinned tools
        working-directory: spec/05-verification
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          npm ci

      - name: Every model of the area, then the spec-ID check
        # run.sh uses spec/05-verification/.venv/bin/python and spec/05-verification/node_modules/.bin/quint, with the
        # sample counts, steps and seeds recorded in the area's RUNS.md.
        run: bash audit/formal-verification/${{ matrix.area }}/run.sh

  user-simulation:
    name: user simulation (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The reported run: base, mainnet-feeds and literal-repay-quote at seed 20261109, base at 20261110…20261113.
          - name: variants and extra seeds
            args: --extra-seeds 4
          # The deployment-topology grid (T1, T2, T3 in every scenario), at the script's default 8 seeds, one per job.
          - name: topology seed 20261109
            args: --topology --seed 20261109 --seeds 1
          - name: topology seed 20261110
            args: --topology --seed 20261110 --seeds 1
          - name: topology seed 20261111
            args: --topology --seed 20261111 --seeds 1
          - name: topology seed 20261112
            args: --topology --seed 20261112 --seeds 1
          - name: topology seed 20261113
            args: --topology --seed 20261113 --seeds 1
          - name: topology seed 20261114
            args: --topology --seed 20261114 --seeds 1
          - name: topology seed 20261115
            args: --topology --seed 20261115 --seeds 1
          - name: topology seed 20261116
            args: --topology --seed 20261116 --seeds 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spec/05-verification/requirements.txt

      - name: Install pinned tools
        working-directory: spec/05-verification
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: run_simulation.py ${{ matrix.args }}
        env:
          ARGS: ${{ matrix.args }}
          OUT: ${{ runner.temp }}/simulation
          LOG: ${{ runner.temp }}/simulation.log
        run: |
          set -o pipefail
          # --jobs of at least 2: the parallel path prints each run's invariant violations, which the next lines read.
          jobs=$(nproc); [ "$jobs" -ge 2 ] || jobs=2
          # shellcheck disable=SC2086 # ARGS holds several arguments
          spec/05-verification/.venv/bin/python audit/user-simulation/run_simulation.py $ARGS --jobs "$jobs" --out "$OUT" | tee "$LOG"
          grep -q 'violations ' "$LOG" || { echo "::error::no run printed its invariant violations"; exit 1; }
          if grep 'violations ' "$LOG" | grep -v 'violations none$'; then
            echo "::error::invariant violations in the runs above"; exit 1
          fi

      - name: Upload summaries and tables
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: user-simulation-${{ strategy.job-index }}
          path: ${{ runner.temp }}/simulation
          retention-days: 14

  contract-checklists:
    name: contract checklists (--check)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spec/05-verification/requirements.txt

      - name: Install pinned tools
        working-directory: spec/05-verification
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Every row of every contract linked by a test of its own (contract_checklist.py --all --check --links-only)
        # Every key of contract_checklist.CONTRACTS, so a contract cannot drop out of the check by having no committed
        # checklist file, and the TEST rows on no contract's checklist (--uncovered). A row fails when no tag on a test
        # of its own names it, or its only tests use a stand-in for the contract (evidence.STAND_INS).
        run: |
          rc=0
          spec/05-verification/.venv/bin/python spec/05-verification/contract_checklist.py --all --check --links-only \
            --summary checklists.md || rc=$?
          cat checklists.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Every mocked external has a fork test on its chain (check-mock-counterparts.py, TEST-005)
        # contracts/script/mock-counterparts.json lists each external a unit test may mock, its mocks and the fork
        # tests that cover it; fails on an unlisted mock of an external and on an external with mocks and no fork test.
        if: ${{ !cancelled() }}
        run: |
          rc=0
          python3 contracts/script/check-mock-counterparts.py --markdown > mock-counterparts.md || rc=$?
          { echo '### Mock counterparts (TEST-005)'; cat mock-counterparts.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  quint-topology:
    # The topology simulator runs of quint/topology_run.sh (1,000 traces x 25 steps per check), which
    # run_all.sh --nightly adds to the quick path.
    name: quint topology simulator (topology_run.sh)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: spec/05-verification
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: spec/05-verification/package-lock.json

      - name: Install pinned tools
        run: npm ci

      - name: Every topology simulator check
        env:
          QNT_LOGS: ${{ runner.temp }}/quint-topology
        run: bash quint/topology_run.sh

      - name: Upload the traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quint-topology
          path: ${{ runner.temp }}/quint-topology
          retention-days: 14

  gate:
    # Passes only when every job above passed, or a long job was skipped outside a nightly, release or manual run.
    name: models-gate
    if: always()
    needs: [formal-verification, user-simulation, contract-checklists, quint-topology]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        working-directory: ${{ runner.temp }}
        env:
          RESULTS: ${{ toJSON(needs) }}
          LONG: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
          MAIN_ONLY: '["quint-topology"]'
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r --argjson long "$LONG" --argjson main_only "$MAIN_ONLY" '
            [to_entries[]
             | select(.value.result != "success")
             | select((.value.result == "skipped" and ($long | not) and (.key as $k | $main_only | any(.[]; . == $k))) | not)
             | .key] | join(", ")')
          if [ -n "$bad" ]; then echo "not passed: $bad"; exit 1; fi
