#
# The compose stack against a local anvil rehearsal (contracts/script/e2e/e2e-local.sh), layered over compose.yaml.
# contracts/script/e2e/services-compose.sh writes the environment files into AVANA_COMPOSE_ENV and runs:
#
#   docker compose -f services/compose.yaml -f services/compose.anvil.yaml up --build
#
# The rehearsal manifest is mounted from contracts/deployments-local/<network>/ at /local; the indexer runs with
# INDEXER_NETWORK_SET=local, which keeps its rows in an embedded PGlite store, so PostgreSQL is not started. The services
# reach the anvil node on the host through host.docker.internal, and through anvil-fallback as their second provider (the
# same node: the monitor refuses a fallback equal to its primary). compose.yaml still needs POSTGRES_PASSWORD and
# KEEPER_TLS_DIR set; the script sets both (a throwaway password and kill-switch certificates).

services:
  indexer:
    env_file: !override
      - ${AVANA_COMPOSE_ENV:?set AVANA_COMPOSE_ENV to the folder of the rehearsal env files}/indexer.env
    environment: !override {}
    depends_on: !reset {}
    extra_hosts:
      - host.docker.internal:host-gateway
      - anvil-fallback:host-gateway
    volumes:
      - ../contracts/deployments-local/${AVANA_NETWORK:-anvil}:/local:ro

  keeper:
    env_file: !override
      - ${AVANA_COMPOSE_ENV:?}/keeper.env
    extra_hosts:
      - host.docker.internal:host-gateway
      - anvil-fallback:host-gateway
    volumes:
      - ../contracts/deployments-local/${AVANA_NETWORK:-anvil}:/local:ro

  monitor:
    env_file: !override
      - ${AVANA_COMPOSE_ENV:?}/monitor.env
    extra_hosts:
      - host.docker.internal:host-gateway
      - anvil-fallback:host-gateway
    volumes:
      - ../contracts/deployments-local/${AVANA_NETWORK:-anvil}:/local:ro

  postgres:
    profiles: [postgres]
