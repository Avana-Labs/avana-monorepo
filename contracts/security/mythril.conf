# Mythril settings, read by script/security-mythril.sh (sourced as shell variables).

# Detection modules. Every module of Mythril 0.24.8 runs except IntegerArithmetics: solc 0.8 checks arithmetic and
# reverts on overflow, and its optimizer compiles `x == c` to `SUB` + `ISZERO`, which Mythril reports as an underflow
# on bytecode; unchecked blocks are covered by Slither, Halmos and the SMTChecker profile instead.
MYTHRIL_MODULES="AccidentallyKillable,ArbitraryJump,ArbitraryStorage,ArbitraryDelegateCall,EtherThief,Exceptions,ExternalCalls,MultipleSends,PredictableVariables,RequirementsViolation,StateChangeAfterCall,TransactionOrderDependence,TxOrigin,UncheckedRetval,UnexpectedEther,UserAssertions"

# Symbolic transactions per contract: three cover set-up, a state change and the call that exploits it.
MYTHRIL_TX_COUNT=3
# Seconds of symbolic execution per contract; the nightly job's step timeout bounds the whole run.
MYTHRIL_EXECUTION_TIMEOUT=900
# Milliseconds per solver query.
MYTHRIL_SOLVER_TIMEOUT=100000
MYTHRIL_MAX_DEPTH=128
