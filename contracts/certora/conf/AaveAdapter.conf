{
  // AaveAdapter with Collateralization linked: backing gap across the two, mint and burn amounts and holders,
  // proxy binding and registry origin, repay from any payer, repay-with-collateral session, admin roles.
  // PROP-001, 006, 007, 009 (origin), 033, 034 (role changes), 054, 064 (binding), 065, 070 (Adapter), 072
  // (Adapter side). Holds for the reviewed Adapter (Q-223).
  // The router serves the views and the roles; each entry-point body runs by delegatecall in one of four immutable
  // logic contracts, linked below so the prover resolves the delegatecalls to their real code.
  "files": [
    "src/proxy/position-proxy/PositionProxy.sol:PositionProxy",
    "src/policy/aave-adapter/AaveAdapter.sol:AaveAdapter",
    "src/policy/aave-adapter/AaveAdapterUserLogic.sol:AaveAdapterUserLogic",
    "src/policy/aave-adapter/AaveAdapterExitLogic.sol:AaveAdapterExitLogic",
    "src/policy/aave-adapter/AaveAdapterCollateralLogic.sol:AaveAdapterCollateralLogic",
    "src/policy/aave-adapter/AaveAdapterSettlementLogic.sol:AaveAdapterSettlementLogic",
    "src/custody/collateralization/Collateralization.sol:Collateralization"
  ],
  "verify": "AaveAdapter:certora/specs/AaveAdapter.spec",
  // CI installs solc 0.8.28 on PATH under this exact name (REQ-ARCH-053 compiler pin).
  "solc": "solc-0.8.28",
  "solc_evm_version": "cancun",
  // Optimizer runs of foundry.toml [profile.default] for the Adapter and the PositionProxy, and the compilation
  // restriction of foundry.toml for Collateralization.sol (IR pipeline, 200 runs, as Collateralization.conf), so every
  // verified bytecode is the deployed bytecode.
  "solc_optimize_map": {
    "PositionProxy": "10000",
    "AaveAdapter": "10000",
    "AaveAdapterUserLogic": "10000",
    "AaveAdapterExitLogic": "10000",
    "AaveAdapterCollateralLogic": "10000",
    "AaveAdapterSettlementLogic": "10000",
    "Collateralization": "200"
  },
  "solc_via_ir_map": {
    "PositionProxy": false,
    "AaveAdapter": false,
    "AaveAdapterUserLogic": false,
    "AaveAdapterExitLogic": false,
    "AaveAdapterCollateralLogic": false,
    "AaveAdapterSettlementLogic": false,
    "Collateralization": true
  },
  // Remappings of contracts/remappings.txt.
  "packages": [
    "forge-std=dependencies/forge-std-1.17.0/src",
    "halmos-cheatcodes=dependencies/halmos-cheatcodes-6da4e69/src",
    "@openzeppelin/contracts=dependencies/@openzeppelin-contracts-5.1.0",
    "@openzeppelin/contracts-upgradeable=dependencies/@openzeppelin-contracts-upgradeable-5.1.0",
    "aave-v4=dependencies/aave-v4-a3ef63e/src",
    "@uniswap/v3-core=dependencies/uniswap-v3-core-5ea68a7",
    "@uniswap/v3-periphery=dependencies/uniswap-v3-periphery-24ccf01",
    "gho-core=dependencies/gho-core-c6335a0/src",
    "solady=dependencies/solady-0.1.26/src"
  ],
  // loop_iter 8 covers Collateralization's records-list walks (the 5.2 bound) and the reserves named in
  // repayAllAndWithdraw and the Spoke's reserve scan for DebtRemaining.
  "optimistic_loop": true,
  "loop_iter": "8",
  // Every external call of the verified contract is summarised in the spec or targets an external contract whose fallback is never reached (Avana sends no ETH and makes no empty-calldata calls), so an unresolved fallback cannot change state.
  "optimistic_fallback": true,
  // Hashed inputs are fixed-size: mapping keys (one or two words), the CREATE2 preimage of a proxy address (85 bytes), the CREATE3 salt and the ERC-7201 namespace ids; none exceeds the 224-byte bound, so the bounded-length hashing model is exact for these contracts.
  "optimistic_hashing": true,
  "hashing_length_bound": "224",
  // Each logic contract reads its own copy of the implementation immutables (the router checks they are equal through
  // `logicConfig()`), so the Collateralization immutable is linked in the router and in every logic contract; each
  // logic's `_SELF` is its own address, so `_onlyDelegated` admits exactly the router's delegatecalls; the router's
  // `_*_LOGIC` immutables name the four logic contracts; every PositionProxy names this Adapter, and Collateralization's
  // `_ADAPTER` is the Adapter.
  "link": [
    "PositionProxy:_ADAPTER=AaveAdapter",
    "AaveAdapter:_USER_LOGIC=AaveAdapterUserLogic",
    "AaveAdapter:_EXIT_LOGIC=AaveAdapterExitLogic",
    "AaveAdapter:_COLLATERAL_LOGIC=AaveAdapterCollateralLogic",
    "AaveAdapter:_SETTLEMENT_LOGIC=AaveAdapterSettlementLogic",
    "AaveAdapter:_COLLATERALIZATION=Collateralization",
    "AaveAdapterUserLogic:_COLLATERALIZATION=Collateralization",
    "AaveAdapterExitLogic:_COLLATERALIZATION=Collateralization",
    "AaveAdapterCollateralLogic:_COLLATERALIZATION=Collateralization",
    "AaveAdapterSettlementLogic:_COLLATERALIZATION=Collateralization",
    "AaveAdapterUserLogic:_SELF=AaveAdapterUserLogic",
    "AaveAdapterExitLogic:_SELF=AaveAdapterExitLogic",
    "AaveAdapterCollateralLogic:_SELF=AaveAdapterCollateralLogic",
    "AaveAdapterSettlementLogic:_SELF=AaveAdapterSettlementLogic",
    "Collateralization:_ADAPTER=AaveAdapter"
  ],
  // Per-rule SMT timeout and split depth sized for the ghost-heavy rules of this spec.
  // -enableStorageSplitting false: the ALL_TLOAD and ALL_TSTORE hooks of setup/TransientModel.spec (empty transient
  // storage at the start of each rule) need unsplit storage.
  "prover_args": ["-mediumTimeout 60", "-depth 15", "-enableStorageSplitting false"],
  // Vacuity and tautology checks on every rule; a vacuous rule is treated as a failed rule.
  "rule_sanity": "basic",
  "msg": "AaveAdapter backing and binding",
  // certoraMutate (mutation-gate.yml): Gambit mutants of every Avana implementation file the verified contract is
  // built from (the files above and the src/ base contracts they inherit), with the per-file mutant count of
  // security/mutation-layers.json: 10 for a file in layer 2.1 or in no layer, 20 for one in layers 2.2-2.6. No seed:
  // certora-cli 8.20.3 hands conf integers to Gambit as strings, and Gambit refuses a string seed.
  "mutations": {
    "gambit": [
      {"filename": "src/policy/aave-adapter/AaveAdapter.sol", "num_mutants": 10},
      {"filename": "src/policy/aave-adapter/AaveAdapterUserLogic.sol", "num_mutants": 10},
      {"filename": "src/policy/aave-adapter/AaveAdapterExitLogic.sol", "num_mutants": 10},
      {"filename": "src/policy/aave-adapter/AaveAdapterCollateralLogic.sol", "num_mutants": 10},
      {"filename": "src/policy/aave-adapter/AaveAdapterSettlementLogic.sol", "num_mutants": 10},
      {"filename": "src/policy/aave-adapter/AaveAdapterSteps.sol", "num_mutants": 10},
      {"filename": "src/policy/aave-adapter/AaveAdapterStorage.sol", "num_mutants": 10}
    ]
  }
}
