{
  // LPVaultSwap: entry gates of liquidate, the one liquidation entry point, for any caller (freeze, deadline, minimum
  // payout; the committed-operator registry gates nothing), no pause, breaker or foreign freeze reads, no breaker
  // writes, balance and allowance neutrality, the caller funding Kf passed to liquidationCall with no flash loan, the
  // waterfall with the oracle-value fee, the keeper reward, the borrower surplus and the shortfall top-up, with
  // keeperOut = Kf + R + shortfall - D - A - B >= 0 paid to the caller (no settlement budget), every seized unit burned
  // and settled, per-leg minimum outputs, no pool token paid out (no in-kind settlement), a working route per released
  // token, pending settlement into the First-Loss Reserve of the market's (funding Hub, debt asset), repay with collateral,
  // the committed-operator registry, roles, the deleverage-only flash callback, and the settlement arithmetic.
  // PROP-015 ... 022, 034, 035, 036, 037, 044, 047, 048, 049, 051, 053, 057, 059, 060, 063, 066, 068, 069, 070, 072,
  // 074, 084, 097.
  // Holds for the verified implementation.
  // The implementation dispatches liquidate, settlePending, deleverage and onFlashLoan by delegatecall to three
  // immutable logic contracts (2.11 Storage), linked here so the prover resolves the delegatecalls to their real code.
  "files": [
    "src/liquidation/lp-vault-swap/LPVaultSwap.sol:LPVaultSwap",
    "src/liquidation/lp-vault-swap/LPVaultSwapLiquidationLogic.sol:LPVaultSwapLiquidationLogic",
    "src/liquidation/lp-vault-swap/LPVaultSwapPendingLogic.sol:LPVaultSwapPendingLogic",
    "src/liquidation/lp-vault-swap/LPVaultSwapDeleverageLogic.sol:LPVaultSwapDeleverageLogic"
  ],
  "link": [
    "LPVaultSwap:_LIQUIDATION_LOGIC=LPVaultSwapLiquidationLogic",
    "LPVaultSwap:_PENDING_LOGIC=LPVaultSwapPendingLogic",
    "LPVaultSwap:_DELEVERAGE_LOGIC=LPVaultSwapDeleverageLogic"
  ],
  "verify": "LPVaultSwap:certora/specs/LPVaultSwap.spec",
  // CI installs solc 0.8.28 on PATH under this exact name (REQ-ARCH-053 compiler pin).
  "solc": "solc-0.8.28",
  "solc_evm_version": "cancun",
  // Optimizer runs of foundry.toml [profile.default], so the verified bytecode is the deployed bytecode.
  "solc_optimize": "10000",
  // Remappings of contracts/remappings.txt.
  "packages": [
    "forge-std=dependencies/forge-std-1.17.0/src",
    "halmos-cheatcodes=dependencies/halmos-cheatcodes-6da4e69/src",
    "@openzeppelin/contracts=dependencies/@openzeppelin-contracts-5.1.0",
    "@openzeppelin/contracts-upgradeable=dependencies/@openzeppelin-contracts-upgradeable-5.1.0",
    "aave-v4=dependencies/aave-v4-a3ef63e/src",
    "@uniswap/v3-core=dependencies/uniswap-v3-core-5ea68a7",
    "@uniswap/v3-periphery=dependencies/uniswap-v3-periphery-24ccf01",
    "gho-core=dependencies/gho-core-c6335a0/src",
    "solady=dependencies/solady-0.1.26/src"
  ],
  // Loops: up to four pool legs with their primary and backup swap routes, and the committed-operator list in
  // removeKeeper and activeKeeperCount (rules start from states with at most 4 registered operators; the floor itself is
  // a count check). 4 iterations unroll every fixed loop.
  "optimistic_loop": true,
  "loop_iter": "4",
  // Every external call of the verified contract is summarised in the spec or targets an external contract whose fallback is never reached (Avana sends no ETH and makes no empty-calldata calls), so an unresolved fallback cannot change state.
  "optimistic_fallback": true,
  // Hashed inputs are fixed-size: mapping keys (one to three words), the CREATE2 preimage of a proxy address (85 bytes) and the ERC-7201 namespace ids; none exceeds the 224-byte bound, so the bounded-length hashing model is exact for these contracts.
  "optimistic_hashing": true,
  "hashing_length_bound": "224",
  // Parametric rules range over LPVaultSwap's own functions.
  "parametric_contracts": ["LPVaultSwap"],
  // Per-rule SMT timeout and split depth sized for the ghost-heavy rules of this spec.
  // -enableStorageSplitting false: the ALL_TLOAD and ALL_TSTORE hooks of setup/TransientModel.spec (empty transient
  // storage at the start of each rule) need unsplit storage.
  "prover_args": ["-mediumTimeout 60", "-depth 15", "-enableStorageSplitting false"],
  // Vacuity and tautology checks on every rule; a vacuous rule is treated as a failed rule.
  "rule_sanity": "basic",
  "msg": "LPVaultSwap liquidation and settlement",
  // certoraMutate (mutation-gate.yml): Gambit mutants of every Avana implementation file the verified contract is
  // built from (the files above and the src/ base contracts they inherit), with the per-file mutant count of
  // security/mutation-layers.json: 10 for a file in layer 2.1 or in no layer, 20 for one in layers 2.2-2.6. No seed:
  // certora-cli 8.20.3 hands conf integers to Gambit as strings, and Gambit refuses a string seed.
  "mutations": {
    "gambit": [
      {"filename": "src/liquidation/lp-vault-swap/LPVaultSwap.sol", "num_mutants": 10},
      {"filename": "src/liquidation/lp-vault-swap/LPVaultSwapLiquidationLogic.sol", "num_mutants": 10},
      {"filename": "src/liquidation/lp-vault-swap/LPVaultSwapPendingLogic.sol", "num_mutants": 10},
      {"filename": "src/liquidation/lp-vault-swap/LPVaultSwapDeleverageLogic.sol", "num_mutants": 10},
      {"filename": "src/liquidation/lp-vault-swap/LPVaultSwapSettlement.sol", "num_mutants": 10},
      {"filename": "src/liquidation/lp-vault-swap/LPVaultSwapStorage.sol", "num_mutants": 10}
    ]
  }
}
