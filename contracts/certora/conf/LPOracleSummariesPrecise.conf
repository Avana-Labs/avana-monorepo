{
  // Optional long run, not part of the gate: LPOracle.spec assumes these library facts as Aave's V4 library
  // verification does, and test/differential/MathSummaries.differential.t.sol checks them against an exact reference.
  // LPOracle summaries, word mode: the 512-bit limb facts of OpenZeppelin Math.mulDiv and v4-core FullMath.mulDiv that
  // LPOracleSummaries.conf (integer mode) requires by name to prove both are floor(x * y / den).
  "files": [
    "test/utils/harness/LPOracleSummariesHarness.sol:LPOracleSummariesHarness"
  ],
  "verify": "LPOracleSummariesHarness:certora/specs/LPOracleSummaries.spec",
  // Word mode: the mulDiv limb rules, whose bitwise operations are exact only with precise_bitwise_ops (which bounds
  // every CVL integer to a word; the rules use no operation that wraps).
  "rule": ["ozMulDivReverts", "ozMulDivRemainder", "fullMathMulDivReverts", "fullMathMulDivRemainder"],
  "precise_bitwise_ops": true,
  // CI installs solc 0.8.28 on PATH under this exact name (REQ-ARCH-053 compiler pin).
  "solc": "solc-0.8.28",
  "solc_evm_version": "cancun",
  // Optimizer runs of foundry.toml [profile.default], so the verified bytecode is the deployed bytecode.
  "solc_optimize": "10000",
  // Remappings of contracts/remappings.txt.
  "packages": [
    "forge-std=dependencies/forge-std-1.17.0/src",
    "halmos-cheatcodes=dependencies/halmos-cheatcodes-6da4e69/src",
    "@openzeppelin/contracts=dependencies/@openzeppelin-contracts-5.1.0",
    "@openzeppelin/contracts-upgradeable=dependencies/@openzeppelin-contracts-upgradeable-5.1.0",
    "aave-v4=dependencies/aave-v4-a3ef63e/src",
    "@uniswap/v3-core=dependencies/uniswap-v3-core-5ea68a7",
    "@uniswap/v3-periphery=dependencies/uniswap-v3-periphery-24ccf01",
    "@uniswap/v4-core=dependencies/uniswap-v4-core-e50237c",
    "gho-core=dependencies/gho-core-c6335a0/src",
    "solady=dependencies/solady-0.1.26/src"
  ],
  // No loops on the paths the rules take (OpenZeppelin's Math.sqrt and mulDiv are unrolled).
  "optimistic_loop": true,
  "loop_iter": "1",
  // The arithmetic rules multiply symbolic integers; without nonlinear solving the prover over-approximates products
  // and can report spurious violations.
  "prover_args": ["-smt_nonLinearArithmetic true", "-mediumTimeout 120", "-depth 15"],
  "smt_timeout": "1200",
  // Vacuity and tautology checks on every rule; a vacuous rule is treated as a failed rule.
  "rule_sanity": "basic",
  "msg": "LPOracle library summaries: mulDiv limbs in word mode"
}
