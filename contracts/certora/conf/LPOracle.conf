{
  // LPOracle: serving never reverts and is positive, served price by state, disagreement and failure timers across a
  // route-version change, restricted setters, admin invariant and the oracle arithmetic. PROP-023, 024, 025, 026,
  // 027, 034, 044, 049, 070, 074. The rules run on the deployable concentrated-liquidity implementation LPOracleCL (the
  // AMM-neutral base src/oracle/lp-oracle/LPOracle.sol with the concentrated-liquidity pricing module compiled in), the
  // code every Uniswap v3 and Slipstream market proxy runs.
  // The implementation runs its views, poke and listing in three immutable logic contracts by delegatecall
  // (REQ-ORACLE-106); the conf lists them, and a run links the _VIEW_LOGIC, _POKE_LOGIC and _LISTING_LOGIC immutables
  // to them, and the _MODULE_LOGIC immutable of the implementation and its three logic contracts to the one
  // LPOracleCLModuleLogic, which runs the concentrated-liquidity pricing hooks by delegatecall.
  "files": [
    "src/oracle/lp-oracle/LPOracleCL.sol:LPOracleCL",
    "src/oracle/lp-oracle/LPOracleCLViewLogic.sol:LPOracleCLViewLogic",
    "src/oracle/lp-oracle/LPOracleCLPokeLogic.sol:LPOracleCLPokeLogic",
    "src/oracle/lp-oracle/LPOracleCLListingLogic.sol:LPOracleCLListingLogic",
    "src/oracle/lp-oracle/LPOracleCLModuleLogic.sol:LPOracleCLModuleLogic"
  ],
  "verify": "LPOracleCL:certora/specs/LPOracle.spec",
  // CI installs solc 0.8.28 on PATH under this exact name (REQ-ARCH-053 compiler pin).
  "solc": "solc-0.8.28",
  "solc_evm_version": "cancun",
  // Optimizer runs of the foundry.toml compilation restrictions on LPOracleCL.sol and its logic contracts (200), so the
  // verified bytecode is the deployed bytecode.
  "solc_optimize": "200",
  // Remappings of contracts/remappings.txt.
  "packages": [
    "forge-std=dependencies/forge-std-1.17.0/src",
    "halmos-cheatcodes=dependencies/halmos-cheatcodes-6da4e69/src",
    "@openzeppelin/contracts=dependencies/@openzeppelin-contracts-5.1.0",
    "@openzeppelin/contracts-upgradeable=dependencies/@openzeppelin-contracts-upgradeable-5.1.0",
    "aave-v4=dependencies/aave-v4-a3ef63e/src",
    "@uniswap/v3-core=dependencies/uniswap-v3-core-5ea68a7",
    "@uniswap/v3-periphery=dependencies/uniswap-v3-periphery-24ccf01",
    "gho-core=dependencies/gho-core-c6335a0/src",
    "solady=dependencies/solady-0.1.26/src"
  ],
  // Fixed loops over 2 tokens x 2 routes x at most 2 legs; four iterations cover every one of them.
  "optimistic_loop": true,
  "loop_iter": "4",
  // Every external call of the verified contract is summarised in the spec or targets an external contract whose fallback is never reached (Avana sends no ETH and makes no empty-calldata calls), so an unresolved fallback cannot change state.
  "optimistic_fallback": true,
  // Hashed inputs are fixed-size: mapping keys, the breaker debt key (abi.encode of two words, 64 bytes), operation ids (keccak of fixed-length encodings) and the ERC-7201 namespace ids; none exceeds the 224-byte bound, so the bounded-length hashing model is exact for these contracts.
  "optimistic_hashing": true,
  "hashing_length_bound": "224",
  // Exposes the ERC-7201 struct annotated erc7201:avana.storage.LPOracle as
  // currentContract.ext_avana_storage_LPOracle, so rules read accepted, failedSince, disagreeSince and routeVersion.
  "storage_extension_annotation": true,
  // Per-rule SMT timeout and split depth sized for the ghost-heavy rules of this spec.
  "prover_args": ["-mediumTimeout 60", "-depth 15"],
  // Vacuity and tautology checks on every rule; a vacuous rule is treated as a failed rule.
  "rule_sanity": "basic",
  "msg": "LPOracle serving and timers",
  // certoraMutate (mutation-gate.yml): Gambit mutants of every Avana implementation file the verified contract is
  // built from (the files above and the src/ base contracts they inherit), with the per-file mutant count of
  // security/mutation-layers.json: 10 for a file in layer 2.1 or in no layer, 20 for one in layers 2.2-2.6. No seed:
  // certora-cli 8.20.3 hands conf integers to Gambit as strings, and Gambit refuses a string seed.
  "mutations": {
    "gambit": [
      {"filename": "src/oracle/lp-oracle/LPOracle.sol", "num_mutants": 10},
      {"filename": "src/oracle/lp-oracle/LPOracleConfig.sol", "num_mutants": 10},
      {"filename": "src/oracle/lp-oracle/LPOracleEval.sol", "num_mutants": 10},
      {"filename": "src/oracle/lp-oracle/LPOracleListing.sol", "num_mutants": 10},
      {"filename": "src/oracle/lp-oracle/LPOracleListingLogic.sol", "num_mutants": 10},
      {"filename": "src/oracle/lp-oracle/LPOracleLogicBase.sol", "num_mutants": 10},
      {"filename": "src/oracle/lp-oracle/LPOraclePoke.sol", "num_mutants": 10},
      {"filename": "src/oracle/lp-oracle/LPOraclePokeLogic.sol", "num_mutants": 10},
      {"filename": "src/oracle/lp-oracle/LPOracleReads.sol", "num_mutants": 10},
      {"filename": "src/oracle/lp-oracle/LPOracleRecovery.sol", "num_mutants": 10},
      {"filename": "src/oracle/lp-oracle/LPOracleStorage.sol", "num_mutants": 10},
      {"filename": "src/oracle/lp-oracle/LPOracleViewLogic.sol", "num_mutants": 10},
      {"filename": "src/oracle/lp-oracle/LPOracleViews.sol", "num_mutants": 10},
      {"filename": "src/oracle/lp-oracle/LPOracleCL.sol", "num_mutants": 10},
      {"filename": "src/oracle/lp-oracle/LPOracleCLPokeLogic.sol", "num_mutants": 10},
      {"filename": "src/oracle/lp-oracle/LPOracleCLListingLogic.sol", "num_mutants": 10},
      {"filename": "src/oracle/lp-oracle/LPOracleCLInitLogic.sol", "num_mutants": 10},
      {"filename": "src/oracle/lp-oracle/LPOracleCLViewLogic.sol", "num_mutants": 10},
      {"filename": "src/oracle/lp-oracle/LPOracleCLModule.sol", "num_mutants": 10},
      {"filename": "src/oracle/lp-oracle/LPOracleCLPool.sol", "num_mutants": 10},
      {"filename": "src/oracle/lp-oracle/LPOracleCLModuleLogic.sol", "num_mutants": 10},
      {"filename": "src/oracle/lp-oracle/LPOracleCLModuleCaller.sol", "num_mutants": 10}
    ]
  }
}
