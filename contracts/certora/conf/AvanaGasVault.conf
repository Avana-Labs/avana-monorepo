{
  // AvanaGasVault (keeper gas, 2.23): the 24 h cap over any window, never above target, ETH only to listed signers or
  // TREASURY, guardian tighten-only, withdrawal to TREASURY by TIMELOCK only, no call with calldata. PROP-113.
  // Runs only on the local WSL prover queue (certora/README.md); never in GitHub Actions or a hosted prover.
  "files": [
    "src/periphery/gas-vault/AvanaGasVault.sol:AvanaGasVault"
  ],
  "verify": "AvanaGasVault:certora/specs/AvanaGasVault.spec",
  // CI installs solc 0.8.28 on PATH under this exact name (REQ-ARCH-053 compiler pin).
  "solc": "solc-0.8.28",
  "solc_evm_version": "cancun",
  // Optimizer runs of foundry.toml [profile.default], so the verified bytecode is the deployed bytecode.
  "solc_optimize": "10000",
  // Remappings of contracts/remappings.txt.
  "packages": [
    "forge-std=dependencies/forge-std-1.17.0/src",
    "halmos-cheatcodes=dependencies/halmos-cheatcodes-6da4e69/src",
    "@openzeppelin/contracts=dependencies/@openzeppelin-contracts-5.1.0",
    "@openzeppelin/contracts-upgradeable=dependencies/@openzeppelin-contracts-upgradeable-5.1.0",
    "aave-v4=dependencies/aave-v4-a3ef63e/src",
    "@uniswap/v3-core=dependencies/uniswap-v3-core-5ea68a7",
    "@uniswap/v3-periphery=dependencies/uniswap-v3-periphery-24ccf01",
    "gho-core=dependencies/gho-core-c6335a0/src",
    "solady=dependencies/solady-0.1.26/src"
  ],
  // `_window` walks its 4 slots exactly; `topUpAll` is checked with up to 4 listed signers (the spec header).
  "optimistic_loop": true,
  "loop_iter": "4",
  // The vault's only external calls are ETH transfers (empty calldata) to a signer or TREASURY; the reentrancy guard
  // closes every state-changing entry point a recipient could reach except fund/receive, which only add ETH.
  "optimistic_fallback": true,
  // Hashed inputs are mapping keys of one word.
  "optimistic_hashing": true,
  "hashing_length_bound": "224",
  "prover_args": ["-mediumTimeout 60", "-depth 15"],
  // Vacuity and tautology checks on every rule; a vacuous rule is treated as a failed rule.
  "rule_sanity": "basic",
  "msg": "AvanaGasVault keeper gas",
  // certoraMutate (local queue only): Gambit mutants of the vault, 20 as a layer 2.6 file of security/mutation-layers.json.
  "mutations": {
    "gambit": [
      {"filename": "src/periphery/gas-vault/AvanaGasVault.sol", "num_mutants": 20}
    ]
  }
}
