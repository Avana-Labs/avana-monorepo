{
  // MarketRegistry: pause state and reason, address freeze, debt-reserve set at activation and removal, role map
  // and admin invariant. PROP-034, 041, 061, 070, 071. Holds for the verified MarketRegistry implementation.
  // The router serves views and checks callers; each write body runs by delegatecall in one of six immutable logic
  // contracts, linked here so the prover resolves the delegatecalls to their real code.
  "files": [
    "src/policy/market-registry/MarketRegistry.sol:MarketRegistry",
    "src/policy/market-registry/MarketRegistryHubsLogic.sol:MarketRegistryHubsLogic",
    "src/policy/market-registry/MarketRegistryListingLogic.sol:MarketRegistryListingLogic",
    "src/policy/market-registry/MarketRegistryActivationLogic.sol:MarketRegistryActivationLogic",
    "src/policy/market-registry/MarketRegistryRoutesLogic.sol:MarketRegistryRoutesLogic",
    // The safety logic through its harness: the unchanged contract plus one view that compares its implementation
    // immutables with the registry's (certora/harness/MarketRegistrySafetyLogicHarness.sol).
    "certora/harness/MarketRegistrySafetyLogicHarness.sol:MarketRegistrySafetyLogicHarness",
    "src/policy/market-registry/MarketRegistryWindDownLogic.sol:MarketRegistryWindDownLogic"
  ],
  "link": [
    "MarketRegistry:_HUBS_LOGIC=MarketRegistryHubsLogic",
    "MarketRegistry:_LISTING_LOGIC=MarketRegistryListingLogic",
    "MarketRegistry:_ACTIVATION_LOGIC=MarketRegistryActivationLogic",
    "MarketRegistry:_ROUTES_LOGIC=MarketRegistryRoutesLogic",
    "MarketRegistry:_SAFETY_LOGIC=MarketRegistrySafetyLogicHarness",
    "MarketRegistry:_WIND_DOWN_LOGIC=MarketRegistryWindDownLogic"
  ],
  "verify": "MarketRegistry:certora/specs/MarketRegistry.spec",
  // CI installs solc 0.8.28 on PATH under this exact name (REQ-ARCH-053 compiler pin).
  "solc": "solc-0.8.28",
  "solc_evm_version": "cancun",
  // Optimizer runs of foundry.toml [profile.default], so the verified bytecode is the deployed bytecode.
  "solc_optimize": "10000",
  // Remappings of contracts/remappings.txt.
  "packages": [
    "forge-std=dependencies/forge-std-1.17.0/src",
    "halmos-cheatcodes=dependencies/halmos-cheatcodes-6da4e69/src",
    "@openzeppelin/contracts=dependencies/@openzeppelin-contracts-5.1.0",
    "@openzeppelin/contracts-upgradeable=dependencies/@openzeppelin-contracts-upgradeable-5.1.0",
    "aave-v4=dependencies/aave-v4-a3ef63e/src",
    "@uniswap/v3-core=dependencies/uniswap-v3-core-5ea68a7",
    "@uniswap/v3-periphery=dependencies/uniswap-v3-periphery-24ccf01",
    "gho-core=dependencies/gho-core-c6335a0/src",
    "solady=dependencies/solady-0.1.26/src"
  ],
  // Rolling 24-hour freeze window = 24 one-hour buckets; the rules read it through freezesInWindow, whose loop the
  // prover unrolls to loop_iter. Four iterations cover the activation loops over a Spoke's debt reserves (at most
  // four in these rules) and the route legs (at most two per route); the freeze-window sum is checked by TEST-229
  // over all 24 buckets.
  "optimistic_loop": true,
  "loop_iter": "4",
  // Every external call of the verified contract is summarised in the spec or targets an external contract whose fallback is never reached (Avana sends no ETH and makes no empty-calldata calls), so an unresolved fallback cannot change state.
  "optimistic_fallback": true,
  // Hashed inputs are fixed-size: mapping keys, the breaker debt key (abi.encode of two words, 64 bytes), operation ids (keccak of fixed-length encodings) and the ERC-7201 namespace ids; none exceeds the 224-byte bound, so the bounded-length hashing model is exact for these contracts.
  "optimistic_hashing": true,
  "hashing_length_bound": "224",
  // Per-rule SMT timeout and split depth sized for the ghost-heavy rules of this spec.
  // -disableInputSizeValidation: the router forwards msg.data unchanged to its logic contract by delegatecall, and its
  // own entry points do not decode the struct and array arguments they forward, so the prover's lower bound on the
  // forwarded buffer (selector, address, offset) is below the ABI minimum of the logic function it inlines and its
  // internal size check aborts the run. The logic contract decodes the same bytes, so the check adds nothing here.
  "prover_args": ["-mediumTimeout 60", "-depth 15", "-disableInputSizeValidation true"],
  // Vacuity and tautology checks on every rule; a vacuous rule is treated as a failed rule.
  "rule_sanity": "basic",
  "msg": "MarketRegistry pause, freeze and debt-reserve set"
}
