{
  // RiskModule listing, activation and governance: listPool's checks and records, activateMarket's vault-token and
  // Aave reserve checks, the liquidation settings copied from the price Spoke (max bonus = the higher token's; bonus
  // factor, health factor for max bonus and target health factor = the price Spoke's), an active market never changes,
  // and only the AccessManager-authorized role changes each setting (design/risk.md).
  // The verified contract is the test harness: the RiskModule plus a view of the listing tick.
  // The `restricted` check's AccessManager decision is the ghost AuthorityModel, bound at AuthorityUtils.canCallWithDelay.
  "files": [
    "test/utils/harness/RiskModuleHarness.sol:RiskModuleHarness"
  ],
  "verify": "RiskModuleHarness:certora/specs/RiskModuleActivation.spec",
  // CI installs solc 0.8.28 on PATH under this exact name (REQ-ARCH-053 compiler pin).
  "solc": "solc-0.8.28",
  "solc_evm_version": "cancun",
  // Optimizer runs of foundry.toml [profile.default], so the verified bytecode is the deployed bytecode.
  "solc_optimize": "10000",
  // Remappings of contracts/remappings.txt.
  "packages": [
    "forge-std=dependencies/forge-std-1.17.0/src",
    "halmos-cheatcodes=dependencies/halmos-cheatcodes-6da4e69/src",
    "@openzeppelin/contracts=dependencies/@openzeppelin-contracts-5.1.0",
    "@openzeppelin/contracts-upgradeable=dependencies/@openzeppelin-contracts-upgradeable-5.1.0",
    "aave-v4=dependencies/aave-v4-a3ef63e/src",
    "@uniswap/v3-core=dependencies/uniswap-v3-core-5ea68a7",
    "@uniswap/v3-periphery=dependencies/uniswap-v3-periphery-24ccf01",
    "@uniswap/v4-core=dependencies/uniswap-v4-core-e50237c",
    "gho-core=dependencies/gho-core-c6335a0/src",
    "solady=dependencies/solady-0.1.26/src"
  ],
  // The keeper, coverage-Spoke and debt-reserve loops are
  // bounded by optimistic unrolling; no rule depends on more iterations. The other loops on the listPool path are
  // summarized in the spec: ClTickMath.getTickAtSqrtPrice (a fixed 14-step loop) and BandMath.unitDecimals (the 6..18
  // search), with LPPriceMath.sqrtPriceX96, so no listPool path is cut by the bound.
  "optimistic_loop": true,
  "loop_iter": "2",
  // Hashed inputs: mapping keys (no AccessManager in the scene).
  "optimistic_hashing": true,
  "hashing_length_bound": "288",
  "prover_args": ["-mediumTimeout 60", "-depth 15"],
  // Vacuity and tautology checks on every rule; a vacuous rule is treated as a failed rule.
  "rule_sanity": "basic",
  "msg": "RiskModule listing, activation checks, copied liquidation settings and setter authority"
}
