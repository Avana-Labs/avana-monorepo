{
  // RiskModule bands: a listed band never changes, listPool's checks hold (the Custom range band contains the listing
  // price, spans at least the minimum width and is narrower than full range), the Full range band is the pool's usable
  // tick range, and only the AccessManager-authorized DAO role changes the Spoke widths
  // (src/policy/risk-module/DESIGN.md). Holds for the RiskModule of src/policy/risk-module; RiskModule.conf covers the
  // legacy one.
  // The verified contract is the test harness: the RiskModule plus a view of the listing tick.
  // OpenZeppelin's AccessManager v5.1.0 is in the scene so the `restricted` check reads a real role decision.
  "files": [
    "test/utils/harness/RiskModuleHarness.sol:RiskModuleHarness",
    "dependencies/@openzeppelin-contracts-5.1.0/access/manager/AccessManager.sol:AccessManager"
  ],
  "verify": "RiskModuleHarness:certora/specs/RiskModuleBands.spec",
  // CI installs solc 0.8.28 on PATH under this exact name (REQ-ARCH-053 compiler pin).
  "solc": "solc-0.8.28",
  "solc_evm_version": "cancun",
  // Optimizer runs of foundry.toml [profile.default], so the verified bytecode is the deployed bytecode.
  "solc_optimize": "10000",
  // Remappings of contracts/remappings.txt.
  "packages": [
    "forge-std=dependencies/forge-std-1.17.0/src",
    "halmos-cheatcodes=dependencies/halmos-cheatcodes-6da4e69/src",
    "@openzeppelin/contracts=dependencies/@openzeppelin-contracts-5.1.0",
    "@openzeppelin/contracts-upgradeable=dependencies/@openzeppelin-contracts-upgradeable-5.1.0",
    "aave-v4=dependencies/aave-v4-a3ef63e/src",
    "@uniswap/v3-core=dependencies/uniswap-v3-core-5ea68a7",
    "@uniswap/v3-periphery=dependencies/uniswap-v3-periphery-24ccf01",
    "@uniswap/v4-core=dependencies/uniswap-v4-core-e50237c",
    "gho-core=dependencies/gho-core-c6335a0/src",
    "solady=dependencies/solady-0.1.26/src"
  ],
  // A listing route has at most two feeds (tokenPrice), and the keeper, coverage-Spoke and debt-reserve loops are
  // bounded by optimistic unrolling; no rule depends on more iterations.
  "optimistic_loop": true,
  "loop_iter": "2",
  // Hashed inputs: mapping keys, the market's feeds hash (abi.encode of two routes of at most two feeds, 256 bytes)
  // and the AccessManager's operation ids.
  "optimistic_hashing": true,
  "hashing_length_bound": "288",
  "prover_args": ["-mediumTimeout 60", "-depth 15"],
  // Vacuity and tautology checks on every rule; a vacuous rule is treated as a failed rule.
  "rule_sanity": "basic",
  "msg": "RiskModule bands: immutable bands, listing checks, full range ticks, width authority"
}
