{
  // Avana Stable LP Hub (Aave V4 Hub at a3ef63e, real code): vault-token added assets == added shares and the
  // share preview identity. PROP-011, 040.
  "files": [
    "dependencies/aave-v4-a3ef63e/src/hub/instances/HubInstance.sol:HubInstance"
  ],
  "verify": "HubInstance:certora/specs/Hub.spec",
  // CI installs solc 0.8.28 on PATH under this exact name (REQ-ARCH-053 compiler pin).
  "solc": "solc-0.8.28",
  "solc_evm_version": "cancun",
  // Aave's own hub profile (foundry.toml [profile.aave] additional_compiler_profiles: via-IR, 22,300 runs), so the verified bytecode is the release bytecode.
  "solc_optimize": "22300",
  "solc_via_ir": true,
  // Remappings of contracts/remappings.txt.
  "packages": [
    "src=dependencies/aave-v4-a3ef63e/src"
  ],
  // The Hub's spoke and asset loops are not reached by the rules' functions with no draws; two iterations cover
  // the EnumerableSet paths of transferShares.
  "optimistic_loop": true,
  "loop_iter": "2",
  // Every external call of the verified contract is summarised in the spec or targets an external contract whose fallback is never reached (Avana sends no ETH and makes no empty-calldata calls), so an unresolved fallback cannot change state.
  "optimistic_fallback": true,
  // Hashed inputs are fixed-size: mapping keys (one to three words), the CREATE2 preimage of a proxy address (85 bytes) and the ERC-7201 namespace ids; none exceeds the 224-byte bound, so the bounded-length hashing model is exact for these contracts.
  "optimistic_hashing": true,
  "hashing_length_bound": "224",
  // Per-rule SMT timeout and split depth sized for the ghost-heavy rules of this spec.
  "prover_args": ["-mediumTimeout 60", "-depth 15"],
  // Vacuity and tautology checks on every rule; a vacuous rule is treated as a failed rule.
  "rule_sanity": "basic",
  "msg": "Aave V4 Hub shares == assets"
}
