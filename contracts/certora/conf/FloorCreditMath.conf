{
  // FloorCreditMath: the floor credit is at most L * r0 and L * r1 (the band edges), is monotone in L, and is
  // covered by the position's value at every price in the band; the library reverts outside the band.
  // contracts/design/vault.md#appendix-floor-credit-proof. A supplementary check: the proof is on paper and the code is checked
  // against the formula by Halmos and the fuzz suite.
  // The verified contract is the test harness that wraps the library's internal function in an external one.
  "files": [
    "test/utils/harness/FloorCreditMathHarness.sol:FloorCreditMathHarness"
  ],
  "verify": "FloorCreditMathHarness:certora/specs/FloorCreditMath.spec",
  // CI installs solc 0.8.28 on PATH under this exact name (REQ-ARCH-053 compiler pin).
  "solc": "solc-0.8.28",
  "solc_evm_version": "cancun",
  // Optimizer runs of foundry.toml [profile.default], so the verified bytecode is the deployed bytecode.
  "solc_optimize": "10000",
  // Remappings of contracts/remappings.txt.
  "packages": [
    "forge-std=dependencies/forge-std-1.17.0/src",
    "halmos-cheatcodes=dependencies/halmos-cheatcodes-6da4e69/src",
    "@openzeppelin/contracts=dependencies/@openzeppelin-contracts-5.1.0",
    "@openzeppelin/contracts-upgradeable=dependencies/@openzeppelin-contracts-upgradeable-5.1.0",
    "aave-v4=dependencies/aave-v4-a3ef63e/src",
    "@uniswap/v3-core=dependencies/uniswap-v3-core-5ea68a7",
    "@uniswap/v3-periphery=dependencies/uniswap-v3-periphery-24ccf01",
    "@uniswap/v4-core=dependencies/uniswap-v4-core-e50237c",
    "gho-core=dependencies/gho-core-c6335a0/src",
    "solady=dependencies/solady-0.1.26/src"
  ],
  // No loops on the paths the rules take.
  "optimistic_loop": true,
  "loop_iter": "1",
  // The arithmetic rules multiply symbolic integers; without nonlinear solving the prover over-approximates products
  // and can report spurious violations. Each rule's proof steps keep every query to one product monotonicity or
  // polynomial identity.
  "prover_args": ["-smt_nonLinearArithmetic true", "-mediumTimeout 120", "-depth 15"],
  "smt_timeout": "1200",
  // Vacuity and tautology checks on every rule; a vacuous rule is treated as a failed rule.
  "rule_sanity": "basic",
  "msg": "FloorCreditMath edge ratios, monotonicity and value floor"
  // No `mutations` section: the arithmetic rules are over CVL integers and do not read the library's bytecode, so a
  // Gambit mutant of FloorCreditMath.sol could only be caught by the revert rule; the library's mutants are caught by
  // its Foundry suites (test/fuzz/FloorCreditMath.fuzz.t.sol).
}
