{
  // RiskModule drift check: the three Aave settings every Avana collateral reserve keeps. PROP-078.
  // The RiskModule runs its check bodies in five stateless logic contracts by plain calls; each is linked through the
  // implementation immutable that holds it, and the breaker, pledge, borrow and status logic link their own drift,
  // breaker and borrow immutables, so every check is the verified code path.
  "files": [
    "src/policy/risk-module/RiskModule.sol:RiskModule",
    "src/policy/risk-module/RiskModuleDriftLogic.sol:RiskModuleDriftLogic",
    "src/policy/risk-module/RiskModuleBreakerLogic.sol:RiskModuleBreakerLogic",
    "src/policy/risk-module/RiskModulePledgeLogic.sol:RiskModulePledgeLogic",
    "src/policy/risk-module/RiskModuleBorrowLogic.sol:RiskModuleBorrowLogic",
    "src/policy/risk-module/RiskModuleStatusLogic.sol:RiskModuleStatusLogic"
  ],
  "link": [
    "RiskModule:_DRIFT_LOGIC=RiskModuleDriftLogic",
    "RiskModule:_BREAKER_LOGIC=RiskModuleBreakerLogic",
    "RiskModule:_PLEDGE_LOGIC=RiskModulePledgeLogic",
    "RiskModule:_BORROW_LOGIC=RiskModuleBorrowLogic",
    "RiskModule:_STATUS_LOGIC=RiskModuleStatusLogic",
    "RiskModuleBreakerLogic:_DRIFT=RiskModuleDriftLogic",
    "RiskModulePledgeLogic:_DRIFT=RiskModuleDriftLogic",
    "RiskModulePledgeLogic:_BREAKER=RiskModuleBreakerLogic",
    "RiskModuleBorrowLogic:_DRIFT=RiskModuleDriftLogic",
    "RiskModuleBorrowLogic:_BREAKER=RiskModuleBreakerLogic",
    "RiskModuleStatusLogic:_DRIFT=RiskModuleDriftLogic",
    "RiskModuleStatusLogic:_BREAKER=RiskModuleBreakerLogic",
    "RiskModuleStatusLogic:_BORROW=RiskModuleBorrowLogic"
  ],
  "verify": "RiskModule:certora/specs/RiskModuleDrift.spec",
  // CI installs solc 0.8.28 on PATH under this exact name (REQ-ARCH-053 compiler pin).
  "solc": "solc-0.8.28",
  "solc_evm_version": "cancun",
  // Optimizer runs of foundry.toml [profile.default], so the verified bytecode is the deployed bytecode.
  "solc_optimize": "10000",
  // Remappings of contracts/remappings.txt.
  "packages": [
    "forge-std=dependencies/forge-std-1.17.0/src",
    "halmos-cheatcodes=dependencies/halmos-cheatcodes-6da4e69/src",
    "@openzeppelin/contracts=dependencies/@openzeppelin-contracts-5.1.0",
    "@openzeppelin/contracts-upgradeable=dependencies/@openzeppelin-contracts-upgradeable-5.1.0",
    "aave-v4=dependencies/aave-v4-a3ef63e/src",
    "@uniswap/v3-core=dependencies/uniswap-v3-core-5ea68a7",
    "@uniswap/v3-periphery=dependencies/uniswap-v3-periphery-24ccf01",
    "gho-core=dependencies/gho-core-c6335a0/src",
    "solady=dependencies/solady-0.1.26/src"
  ],
  // The scope loops walk the Spoke's reserves [0, getReserveCount()) and the registry's debt reserves; the rules
  // require at most four of each (MAX_RESERVES), which four iterations cover exactly.
  "optimistic_loop": true,
  "loop_iter": "4",
  // Every external call of the verified contract is summarised in the spec or targets an external contract whose fallback is never reached (Avana sends no ETH and makes no empty-calldata calls), so an unresolved fallback cannot change state.
  "optimistic_fallback": true,
  // Hashed inputs are fixed-size: mapping keys, the breaker debt key (abi.encode of two words, 64 bytes), operation ids (keccak of fixed-length encodings) and the ERC-7201 namespace ids; none exceeds the 224-byte bound, so the bounded-length hashing model is exact for these contracts.
  "optimistic_hashing": true,
  "hashing_length_bound": "224",
  // Per-rule SMT timeout and split depth sized for the ghost-heavy rules of this spec.
  "prover_args": ["-mediumTimeout 60", "-depth 15"],
  // Vacuity and tautology checks on every rule; a vacuous rule is treated as a failed rule.
  "rule_sanity": "basic",
  "msg": "RiskModule drift settings",
  // certoraMutate (mutation-gate.yml): Gambit mutants of every Avana implementation file the verified contract is
  // built from (the files above and the src/ base contracts they inherit), with the per-file mutant count of
  // security/mutation-layers.json: 10 for a file in layer 2.1 or in no layer, 20 for one in layers 2.2-2.6. No seed:
  // certora-cli 8.20.3 hands conf integers to Gambit as strings, and Gambit refuses a string seed.
  "mutations": {
    "gambit": [
      {"filename": "src/policy/risk-module/RiskModule.sol", "num_mutants": 10},
      {"filename": "src/policy/risk-module/RiskModuleBase.sol", "num_mutants": 10},
      {"filename": "src/policy/risk-module/RiskModuleBorrowLogic.sol", "num_mutants": 10},
      {"filename": "src/policy/risk-module/RiskModuleBorrowScope.sol", "num_mutants": 10},
      {"filename": "src/policy/risk-module/RiskModuleBreakerLogic.sol", "num_mutants": 10},
      {"filename": "src/policy/risk-module/RiskModuleDriftLogic.sol", "num_mutants": 10},
      {"filename": "src/policy/risk-module/RiskModulePledgeLogic.sol", "num_mutants": 10},
      {"filename": "src/policy/risk-module/RiskModulePreview.sol", "num_mutants": 10},
      {"filename": "src/policy/risk-module/RiskModuleStatusLogic.sol", "num_mutants": 10}
    ]
  }
}
