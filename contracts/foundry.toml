# Avana Foundry workspace.
# Compiler settings follow REQ-ARCH-053: Solidity 0.8.28, EVM cancun, no linked libraries in
# upgradeable contracts. Dependencies are installed by Soldeer into dependencies/ and pinned in
# soldeer.lock (TEST-001); there are no git submodules.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["dependencies"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
via_ir = false
# No metadata hash in the bytecode: the bytecode check before deployments/verified/ compares
# runtime code byte for byte, and a comment or path change must not alter it.
bytecode_hash = "none"
cbor_metadata = false
# Deterministic builds across machines and CI.
auto_detect_solc = false
offline = false
# Only the remappings in remappings.txt; no guessing from dependency folders.
auto_detect_remappings = false
# Off: with dynamic test linking on, `vm.expectRevert()` before a reverting `new` skipped every later statement of the test.
dynamic_test_linking = false
# Fork tests run in their own profile and differential tests in theirs (FFI); Halmos `check_`
# functions are ignored by forge test.
no_match_path = "test/{fork,differential}/**"
fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read", path = "./out-aave" },
  { access = "read", path = "./out-univ3" },
  { access = "read", path = "./out-univ3-periphery" },
  { access = "read", path = "./out-aave-v3" },
  { access = "read", path = "./out-aerodrome" },
  { access = "read", path = "./out-chainlink-ocr2" },
  { access = "read", path = "./out-chainlink-proxy" },
  { access = "read", path = "./out-slipstream-v1" },
  { access = "read", path = "./out-slipstream-main" },
  { access = "read", path = "../deployments" },
  { access = "read-write", path = "./deployments-local" },
  { access = "read", path = "./script/deploy/config" },
]
gas_reports = ["*"]
# Collateralization is immutable and may not delegatecall (REQ-COLL-001), so it cannot be split into logic contracts
# the way the ParameterStore is; under the legacy pipeline its runtime code is about 27 KB at any optimizer setting.
# The IR pipeline at 200 runs brings it to about 22.3 KB, inside EIP-170's 24,576 bytes with margin. Only the
# deployable file is restricted: its facets, the harnesses that inherit them and every other contract keep the
# default settings. certora/conf/Collateralization.conf compiles with the same two settings.
# Each LPOracle implementation is a proxy target plus three logic contracts (views, poke, listing), each carrying the
# evaluation core and the AMM protocol's pricing module; at 10,000 runs the poke and listing logic exceed EIP-170, at 200
# runs they fit. The base's test harness and fuzz target compile the same way; each AMM protocol's deployable LPOracle
# files take the same restriction. The concentrated-liquidity implementation (LPOracleCL.sol) also runs its pricing
# module in its own contract (LPOracleCLModuleLogic.sol, by delegatecall) and splits initialization from checkConfig
# (LPOracleCLInitLogic.sol, LPOracleCLListingLogic.sol); its four logic files (poke, listing, initialization, views) take
# the same restriction, so each of its contracts fits EIP-170 with the 1,024-byte margin at 200 runs.
# The concentrated-liquidity LPVaults carry the shared custody, binding and pricing base plus their AMM protocol's hooks;
# at 10,000 runs the Slipstream LPVault is within about 140 bytes of EIP-170, and with the unit exponent of SPEC-ORC-005
# (narrow 18/18-decimal ranges) it was 531 bytes over its 1,024-byte margin at 1,000 runs. At 200 runs both keep the
# margin. Both deployable files take the same setting so their margins stay alike; everything compiled with them (the
# shared base, the Uniswap v3 test harness, their test suites) builds with it too, and every other contract keeps the
# default. certora/conf/LPVault.conf,
# LPVaultSlipstream.conf, UniswapV3Integration.conf and SlipstreamIntegration.conf compile with the same runs.
additional_compiler_profiles = [
  { name = "collateralization", optimizer = true, via_ir = true, optimizer_runs = 200 },
  { name = "lporacle", optimizer = true, via_ir = false, optimizer_runs = 200 },
  { name = "clvault", optimizer = true, via_ir = false, optimizer_runs = 200 },
]
# The DebtOracle implementation (one proxy per non-GHO debt asset) is about 27.8 KB under the legacy pipeline at 10,000
# runs and 24.5 KB at 200 runs, too close to EIP-170; the IR pipeline at 200 runs brings it to about 23.3 KB. The
# restriction covers its abstract parts (DebtOracleStorage, Reads, Evaluation, Recovery) too, so they are compiled
# only with the contract that uses them. certora/conf/DebtOracle.conf compiles with the same two settings.
# LPVaultSwap is its implementation (roles, the committed-operator registry, views and dispatch, at the default runs)
# plus three logic contracts (liquidate, settlePending, deleverage with its flash callback), each carrying the shared
# settlement steps; at 10,000 runs the liquidation and deleverage logic exceed EIP-170, at 200 runs they fit with margin.
compilation_restrictions = [
  { paths = "src/custody/collateralization/Collateralization.sol", via_ir = true, optimizer_runs = 200 },
  { paths = "src/oracle/debt-oracle/DebtOracle*.sol", via_ir = true, optimizer_runs = 200 },
  { paths = "test/utils/harness/LPOracleHarness.sol", via_ir = false, optimizer_runs = 200 },
  { paths = "src/oracle/lp-oracle/LPOracleCL.sol", via_ir = false, optimizer_runs = 200 },
  { paths = "src/oracle/lp-oracle/LPOracleCLPokeLogic.sol", via_ir = false, optimizer_runs = 200 },
  { paths = "src/oracle/lp-oracle/LPOracleCLListingLogic.sol", via_ir = false, optimizer_runs = 200 },
  { paths = "src/oracle/lp-oracle/LPOracleCLInitLogic.sol", via_ir = false, optimizer_runs = 200 },
  { paths = "src/oracle/lp-oracle/LPOracleCLViewLogic.sol", via_ir = false, optimizer_runs = 200 },
  { paths = "src/oracle/lp-oracle/LPOracleCLModuleLogic.sol", via_ir = false, optimizer_runs = 200 },
  { paths = "test/invariant/echidna/LPOracleProperties.sol", via_ir = false, optimizer_runs = 200 },
  # These Echidna harnesses deploy the real ParameterStore tighten and loosen logic, or the real LPVaultSwap
  # implementation, in their constructor; at 10,000 runs their initcode passed EIP-3860's 49,152 bytes. Optimizer
  # runs change only bytecode size and gas, not behaviour; the deployable contracts keep their own settings.
  { paths = "test/invariant/echidna/ParameterStoreProperties.sol", via_ir = false, optimizer_runs = 200 },
  { paths = "test/invariant/echidna/LPVaultSwapProperties.sol", via_ir = false, optimizer_runs = 200 },
  # The steered invariant handlers of Collateralization and the Integration suite carry their steering and balance
  # checks in one contract each; at 10,000 runs their runtime code passed EIP-170 (25,351 and 24,729 bytes), which
  # fails `forge build --sizes`. As above, runs change only size and gas.
  { paths = "test/invariant/handlers/CollateralizationHandler.sol", via_ir = false, optimizer_runs = 200 },
  { paths = "test/invariant/handlers/IntegrationHandler.sol", via_ir = false, optimizer_runs = 200 },
  { paths = "src/amm/slipstream/SlipstreamIntegration.sol", via_ir = false, optimizer_runs = 200 },
  { paths = "src/amm/uniswap-v3/UniswapV3Integration.sol", via_ir = false, optimizer_runs = 200 },
  { paths = "src/liquidation/lp-vault-swap/LPVaultSwap*Logic.sol", via_ir = true, optimizer_runs = 200 },
  { paths = "src/lens/lens/Lens*Module.sol", via_ir = true, optimizer_runs = 200 },
]

[profile.default.fuzz]
# 1,000 runs keeps the local loop under a few minutes; CI raises it to Aave V4's 10,000 (TEST-007).
runs = 1_000
# Fixed seed so a local failure reproduces on every machine; CI overrides it per run.
seed = "0xa7a7a"
max_test_rejects = 131_072
# Dictionary weighting toward values seen in storage and events: share, liquidity and price
# boundaries matter more than uniform random words.
dictionary_weight = 60
include_storage = true
include_push_bytes = true

[profile.default.invariant]
# Local smoke depth; the invariant and ci profiles run the full campaign.
runs = 64
depth = 64
# Off by default: safety handlers bound their inputs but are allowed to hit reverting paths
# (TEST-007). Liveness handlers assert success inside the handler instead.
fail_on_revert = false
call_override = false
dictionary_weight = 80
include_storage = true
include_push_bytes = true
shrink_run_limit = 5_000
show_metrics = true

[profile.lite]
# Local iteration only (FOUNDRY_PROFILE=lite): the optimizer is off outside the via-IR compilation restrictions, so a
# rebuild takes a fraction of the default time. Its own out/ and cache/ keep the default build warm when switching back.
# No contract size limit here: unoptimized code is larger, and script/check-sizes.sh judges sizes on the default build.
# Gas figures differ without the optimizer; gas tests, the gate, coverage, CI and every release build use the default.
optimizer = false
out = "out-lite"
cache_path = "cache-lite"
code_size_limit = 10_000_000

[profile.ci]
# Fresh seed per CI run (taken from the environment by the workflow) so coverage grows over time.
[profile.ci.fuzz]
runs = 10_000
max_test_rejects = 1_000_000

[profile.ci.invariant]
# 10,000 runs per TEST-007; depth 100 covers the longest operation sequence in the Quint models
# (pledge, borrow, price move, liquidation, repay, withdraw interleaved across 3 accounts).
runs = 10_000
depth = 100
fail_on_revert = false
shrink_run_limit = 10_000

[profile.aave]
# Builds the pinned Aave V4 release with Aave's own compiler settings into out-aave/, so the Hub,
# Spokes, AaveOracle, configurators and LiquidationLogic that fixtures and deploy scripts use have
# the runtime code of the release (TEST-002, TEST-134). Fixtures deploy from these artifacts with
# deployCode/vm.getCode; nothing in Avana's src/ or test/ imports Aave sources, so Aave's settings
# never leak into Avana's build. SpokeInstance links LiquidationLogic at its CREATE2 address,
# supplied through FOUNDRY_LIBRARIES by the library step in script/README.md.
src = "dependencies/aave-v4-a3ef63e/src"
test = "dependencies/aave-v4-a3ef63e/src/deployments"
# aave-deploy/ holds AvanaAaveV4Roles, which runs Aave's own role procedures for the local fixture; it is compiled here,
# with Aave's settings, so Avana's default build never imports Aave sources.
script = "aave-deploy"
out = "out-aave"
cache_path = "cache-aave"
optimizer = true
optimizer_runs = 44_444_444
via_ir = false
bytecode_hash = "none"
# Aave keeps the CBOR metadata section (its default); only the hash is dropped.
cbor_metadata = true
no_match_path = ""
additional_compiler_profiles = [
  { name = "hub", optimizer = true, via_ir = true, optimizer_runs = 22_300 },
  { name = "spoke", optimizer = true, via_ir = true, optimizer_runs = 750 },
]
compilation_restrictions = [
  { paths = "dependencies/aave-v4-a3ef63e/src/hub/instances/HubInstance.sol", via_ir = true, optimizer_runs = 22_300 },
  { paths = "dependencies/aave-v4-a3ef63e/src/spoke/instances/SpokeInstance.sol", via_ir = true, optimizer_runs = 750 },
]

[profile.univ3]
# The pinned Uniswap v3 core release (5ea68a7: factory and pool) for local and test-network deployments
# (deployments/README.md), built alone with Uniswap's settings (Solidity 0.7.6, istanbul, 800 runs, no metadata hash)
# into out-univ3/. Built alone, the pool's creation code hashes to Uniswap's canonical POOL_INIT_CODE_HASH
# 0xe34f199b…8b54, which the position manager and Avana's UniswapV3Integration use to derive pool addresses; compiled
# in one job with other sources it does not (the hash moved to 0x664ea9b6…2c20 when the periphery shared the job).
# Tests deploy the factory with deployCode("out-univ3/UniswapV3Factory.sol/UniswapV3Factory.json") and create pools
# through it. Build it alone before the tests or the deploy: `FOUNDRY_PROFILE=univ3 forge build` (make build-univ3).
src = "dependencies/uniswap-v3-core-5ea68a7/contracts"
test = "dependencies/uniswap-v3-core-5ea68a7/contracts/test"
script = "dependencies/uniswap-v3-core-5ea68a7/contracts/test"
out = "out-univ3"
cache_path = "cache-univ3"
solc_version = "0.7.6"
evm_version = "istanbul"
optimizer = true
optimizer_runs = 800
via_ir = false
bytecode_hash = "none"
cbor_metadata = true
no_match_path = ""
skip = ["dependencies/uniswap-v3-core-5ea68a7/contracts/test/**"]
additional_compiler_profiles = []
compilation_restrictions = []

[profile.univ3-periphery]
# The pinned Uniswap v3 periphery (24ccf01): NonfungiblePositionManager at Uniswap's 2,000 runs and SwapRouter, with
# OpenZeppelin 3.4.2-solc-0.7 through a remapping scoped to the periphery folder (remappings.txt), into
# out-univ3-periphery/. Scripts deploy from the artifacts with vm.getCode; nothing in src/ or test/ imports them.
src = "external/univ3"
test = "external/univ3"
script = "external/univ3"
out = "out-univ3-periphery"
cache_path = "cache-univ3-periphery"
solc_version = "0.7.6"
evm_version = "istanbul"
optimizer = true
optimizer_runs = 1_000_000
via_ir = false
bytecode_hash = "none"
cbor_metadata = true
no_match_path = ""
additional_compiler_profiles = [{ name = "npm", optimizer = true, via_ir = false, optimizer_runs = 2_000 }]
compilation_restrictions = [
  { paths = "dependencies/uniswap-v3-periphery-24ccf01/contracts/NonfungiblePositionManager.sol", optimizer_runs = 2_000 },
]

[profile.slipstream-v1]
# Aerodrome Slipstream at tag v1.0.0 (37eead2), for local and test-network deployments only (deployments/README.md):
# CLFactory, CLPool, NonfungiblePositionManager, SwapRouter and the gauge factory with Slipstream's settings (Solidity
# 0.7.6, 200 runs, no metadata hash) into out-slipstream-v1/. OpenZeppelin 3.4 and ExcessivelySafeCall come through
# remappings scoped to the Slipstream folder.
src = "external/slipstream-v1"
test = "external/slipstream-v1"
script = "external/slipstream-v1"
out = "out-slipstream-v1"
cache_path = "cache-slipstream-v1"
solc_version = "0.7.6"
evm_version = "istanbul"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = true
no_match_path = ""

[profile.slipstream-main]
# Aerodrome Slipstream at main f8717fa (2026-04-10), built like slipstream-v1 into out-slipstream-main/.
src = "external/slipstream-main"
test = "external/slipstream-main"
script = "external/slipstream-main"
out = "out-slipstream-main"
cache_path = "cache-slipstream-main"
solc_version = "0.7.6"
evm_version = "istanbul"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = true
no_match_path = ""

[profile.aave-v3]
# Aave V3 origin v3.7.0 (cff15de) for the test-network world's flash-loan lender (deployments/README.md), with its own
# settings (Solidity 0.8.27, shanghai, 200 runs, no metadata hash) into out-aave-v3/. Its imports reach solidity-utils
# (fdc69f9), OpenZeppelin upgradeable 5.1.0 (fa52531) and OpenZeppelin 5.1.0 through remappings scoped to those
# folders (remappings.txt). Libraries are linked at deployment, as Aave's own scripts do.
src = "dependencies/aave-v3-origin-3.7.0/src"
test = "dependencies/aave-v3-origin-3.7.0/src/deployments"
script = "dependencies/aave-v3-origin-3.7.0/src/deployments"
out = "out-aave-v3"
cache_path = "cache-aave-v3"
solc_version = "0.8.27"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = true
no_match_path = ""

[profile.aerodrome]
# Aerodrome contracts v1.0 (1e08fb9: Voter, VotingEscrow, FactoryRegistry, gauge and rewards factories, Minter, AERO)
# for the test-network world, with Aerodrome's settings (Solidity 0.8.19, 200 runs) into out-aerodrome/; OpenZeppelin
# 4.8.0 (7b3e7b7) through a remapping scoped to the Aerodrome folder.
src = "external/aerodrome"
test = "external/aerodrome"
script = "external/aerodrome"
out = "out-aerodrome"
cache_path = "cache-aerodrome"
solc_version = "0.8.19"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
no_match_path = ""

[profile.chainlink-ocr2]
# Chainlink's OCR2 data-feed aggregator from libocr (199a6f1, contract2/: AccessControlledOCR2Aggregator,
# SimpleWriteAccessController) for the test-network world's price feeds, Solidity 0.8.19 at 1,000 runs (at 1,000,000
# runs AccessControlledOCR2Aggregator is 24,903 bytes, over EIP-170), into out-chainlink-ocr2/.
src = "dependencies/libocr-199a6f1/contract2"
test = "dependencies/libocr-199a6f1/contract2"
script = "dependencies/libocr-199a6f1/contract2"
out = "out-chainlink-ocr2"
cache_path = "cache-chainlink-ocr2"
solc_version = "0.8.19"
evm_version = "paris"
optimizer = true
optimizer_runs = 1_000
via_ir = false
no_match_path = ""

[profile.chainlink-proxy]
# Chainlink's EACAggregatorProxy from smartcontractkit/chainlink tag v2.10.0 (0fe6514, contracts/src/v0.6, vendored
# file by file under external/chainlink-v2.10.0/ with its imports), Solidity 0.6.6, into out-chainlink-proxy/.
src = "external/chainlink-v2.10.0/src/v0.6"
test = "external/chainlink-v2.10.0/src/v0.6"
script = "external/chainlink-v2.10.0/src/v0.6"
out = "out-chainlink-proxy"
cache_path = "cache-chainlink-proxy"
solc_version = "0.6.6"
evm_version = "istanbul"
optimizer = true
optimizer_runs = 1_000_000
via_ir = false
no_match_path = ""

[profile.differential]
# FFI differential fuzzing of the LPOracle against the `fractions.Fraction` reference in
# test/differential/reference/ (TEST-037). FFI is enabled only in this profile.
ffi = true
match_path = "test/differential/**"
no_match_path = "test/fork/**"

[profile.differential.fuzz]
# Each run spawns a Python process; 2,000 runs bound a run to minutes while covering every tick
# bucket the reference partitions.
runs = 2_000

[profile.invariant]
# Dedicated deep campaign over test/invariant only: fewer runs than ci, but four times the call
# depth, to reach states that need long histories (incident clock, cooldown, grace latch).
match_path = "test/invariant/**"
no_match_path = "test/fork/**"

[profile.invariant.invariant]
runs = 2_000
depth = 400
fail_on_revert = false
shrink_run_limit = 10_000
show_metrics = true

[profile.fork]
# Mainnet fork for third-party behaviour: Uniswap v3, Chainlink, the Aave V3 Pool, the GHO
# Stability Modules and the Sky LitePSM (Q-074). The fixture forks at the block pinned in
# test/utils/fixtures/ForkConstants.sol (mainnetForkBlock(), baseForkBlock()); the
# MAINNET_FORK_BLOCK/BASE_FORK_BLOCK variables override it whenever they are set, which only
# local runs do.
match_path = "test/fork/**"
no_match_path = "test/halmos/**"
eth_rpc_url = "${RPC_MAINNET}"
# Fork RPC responses are cached under ~/.foundry/cache/rpc, keyed by block.
no_storage_caching = false

[profile.fork.fuzz]
# Each fork run costs RPC round-trips; 256 runs keeps a cold-cache run under the CI time budget.
runs = 256

[profile.fork.invariant]
runs = 32
depth = 50
fail_on_revert = false

[profile.smt]
# Solidity SMTChecker (PROP-043, PROP-044): no reachable overflow, underflow, division by zero or
# failing assert in the immutable contracts, the LPOracle, DebtOracle, LPVaultSwap, the AaveAdapter (router and its four
# logic contracts), the RiskModule, the ParameterStore and the swap route contracts.
# CHC finds loop and cross-function counterexamples that BMC misses.
optimizer = false

[profile.smt.model_checker]
engine = "chc"
timeout = 100_000
targets = [
  "assert",
  "underflow",
  "overflow",
  "divByZero",
  "constantCondition",
  "popEmptyArray",
  "outOfBounds",
  "balance",
]
invariants = ["contract", "reentrancy"]
show_unproved = true
show_unsupported = true
# PROP-043: the immutable contracts (LPVault, Collateralization, vault token, VaultTokenFactory, ProxyManager,
# PositionProxy, Lock, PayoutEscrow, the First-Loss Reserve, the AvanaTimelock extension), plus the MarketRegistry, which holds the pause
# state. PROP-044: LPOracle, DebtOracle, LPVaultSwap (its implementation and three logic contracts), the AaveAdapter
# router and its four logic contracts, the RiskModule, the ParameterStore and one contract per swap route type
# (PegModule, DexPath, WrapperThenDex).
contracts = { "src/amm/uniswap-v3/UniswapV3Integration.sol" = ["UniswapV3Integration"], "src/custody/collateralization/Collateralization.sol" = ["Collateralization"], "src/vault-token/vault-token/VaultToken.sol" = ["VaultToken"], "src/vault-token/vault-token-factory/VaultTokenFactory.sol" = ["VaultTokenFactory"], "src/proxy/proxy-manager/ProxyManager.sol" = ["ProxyManager"], "src/proxy/position-proxy/PositionProxy.sol" = ["PositionProxy"], "src/lock/lock/Lock.sol" = ["Lock"], "src/governance/timelock/AvanaTimelock.sol" = ["AvanaTimelock"], "src/liquidation/payout-escrow/PayoutEscrow.sol" = ["PayoutEscrow"], "src/coverage/first-loss-reserve/AvanaFirstLossReserve.sol" = ["AvanaFirstLossReserve"], "src/policy/market-registry/MarketRegistry.sol" = ["MarketRegistry"], "src/policy/parameter-store/ParameterStore.sol" = ["ParameterStore"], "src/policy/risk-module/RiskModule.sol" = ["RiskModule"], "src/oracle/lp-oracle/LPOracle.sol" = ["LPOracle"], "src/oracle/debt-oracle/DebtOracle.sol" = ["DebtOracle"], "src/liquidation/lp-vault-swap/LPVaultSwap.sol" = ["LPVaultSwap"], "src/liquidation/lp-vault-swap/LPVaultSwapLiquidationLogic.sol" = ["LPVaultSwapLiquidationLogic"], "src/liquidation/lp-vault-swap/LPVaultSwapPendingLogic.sol" = ["LPVaultSwapPendingLogic"], "src/liquidation/lp-vault-swap/LPVaultSwapDeleverageLogic.sol" = ["LPVaultSwapDeleverageLogic"], "src/policy/aave-adapter/AaveAdapter.sol" = ["AaveAdapter"], "src/policy/aave-adapter/AaveAdapterUserLogic.sol" = ["AaveAdapterUserLogic"], "src/policy/aave-adapter/AaveAdapterExitLogic.sol" = ["AaveAdapterExitLogic"], "src/policy/aave-adapter/AaveAdapterCollateralLogic.sol" = ["AaveAdapterCollateralLogic"], "src/policy/aave-adapter/AaveAdapterSettlementLogic.sol" = ["AaveAdapterSettlementLogic"], "src/liquidation/settlement-routes/PegModuleRoute.sol" = ["PegModuleRoute"], "src/liquidation/settlement-routes/DexPathRoute.sol" = ["DexPathRoute"], "src/liquidation/settlement-routes/WrapperThenDexRoute.sol" = ["WrapperThenDexRoute"] }

[profile.coverage]
# Coverage builds without the optimizer and without via-IR so source maps stay exact. Fork,
# differential, Halmos and invariant suites are excluded: coverage measures the unit, fuzz,
# integration and hostile suites.
# The default profile's compilation_restrictions would otherwise apply here too, and in a via-IR or optimized build
# forge records a ternary as 0/0, the body of a single-statement `if` as 0 and a revert merged with an identical one as
# 0, however often tests run them. Only files that do not compile without them keep a restriction: the DebtOracle files
# need via-IR ("stack too deep" in the legacy pipeline), built here without the optimizer; the two AMM integrations need
# the optimizer ("stack too deep" in ABI decoding without it), built here with the legacy pipeline.
optimizer = false
via_ir = false
# Unoptimized, instrumented code spends more gas per call than the ci profile's build: Cascade's 100-account setUp
# ran out of the default 2^30 test gas limit (a DebtOracle poke then saw less than its 900,000 gas floor). Coverage
# measures branches, not gas, so its limit is 2^32.
gas_limit = 4294967296
no_match_path = "test/{fork,differential,halmos,invariant}/**"
additional_compiler_profiles = [
  { name = "coverage-ir", optimizer = false, via_ir = true },
  { name = "coverage-integrations", optimizer = true, via_ir = false, optimizer_runs = 200 },
]
compilation_restrictions = [
  { paths = "src/oracle/debt-oracle/DebtOracle*.sol", via_ir = true },
  { paths = "src/amm/slipstream/SlipstreamIntegration.sol", via_ir = false, optimizer_runs = 200 },
  { paths = "src/amm/uniswap-v3/UniswapV3Integration.sol", via_ir = false, optimizer_runs = 200 },
]

[profile.coverage.fuzz]
runs = 64

[profile.gas]
# Gas snapshots (`make gas`, CI `test` job): suites in test/gas/ name each measured operation with
# vm.snapshotGasLastCall(group, label) or vm.startSnapshotGas/vm.stopSnapshotGas, and forge writes
# snapshots/<group>.json, which is committed. With the check on, a value that differs from the committed
# snapshot fails the run; `make gas` (FORGE_SNAPSHOT_CHECK=false) rewrites the files for review.
match_path = "test/gas/**"
isolate = true
gas_snapshot_check = true

[profile.governance]
# Governance operation fork tests (docs/governance/README.md, Operations): read and write the before/after
# snapshots of each operation folder under ../docs/governance/operations/.
match_path = "test/governance/**"
fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read", path = "./out-aave" },
  { access = "read", path = "../deployments" },
  { access = "read-write", path = "./deployments-local" },
  { access = "read-write", path = "../docs/governance/operations" },
]

[rpc_endpoints]
mainnet = "${RPC_MAINNET}"
sepolia = "${RPC_SEPOLIA}"
base = "${RPC_BASE}"
base_sepolia = "${RPC_BASE_SEPOLIA}"
anvil = "http://127.0.0.1:8545"

[etherscan]
