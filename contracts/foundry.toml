# Avana Foundry workspace.
# Compiler settings follow REQ-ARCH-053: Solidity 0.8.28, EVM cancun, no linked libraries in
# upgradeable contracts. Dependencies are installed by Soldeer into dependencies/ and pinned in
# soldeer.lock (TEST-001); there are no git submodules.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["dependencies"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
via_ir = false
# No metadata hash in the bytecode: the bytecode check before deployments/verified/ compares
# runtime code byte for byte, and a comment or path change must not alter it.
bytecode_hash = "none"
cbor_metadata = false
# Deterministic builds across machines and CI.
auto_detect_solc = false
offline = false
# Only the remappings in remappings.txt; no guessing from dependency folders.
auto_detect_remappings = false
# Off: with dynamic test linking on, `vm.expectRevert()` before a reverting `new` skipped every later statement of the test.
dynamic_test_linking = false
# Fork tests run in their own profile and differential tests in theirs (FFI); Halmos `check_`
# functions are ignored by forge test.
no_match_path = "test/{fork,differential}/**"
fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read", path = "./out-aave" },
  { access = "read", path = "./out-univ3" },
  { access = "read", path = "./out-univ3-periphery" },
  { access = "read", path = "./out-aave-v3" },
  { access = "read", path = "./out-aerodrome" },
  { access = "read", path = "./out-univ4" },
  { access = "read", path = "./out-permit2" },
  { access = "read", path = "./out-chainlink-ocr2" },
  { access = "read", path = "./out-chainlink-proxy" },
  { access = "read", path = "./out-slipstream-v1" },
  { access = "read", path = "./out-slipstream-main" },
  { access = "read", path = "../deployments" },
  { access = "read-write", path = "./deployments-local" },
  { access = "read", path = "./script/deploy/config" },
  # 03_DeployAvana deploys the operator FlashLiquidator from the liquidator package's build.
  { access = "read", path = "../liquidator/out" },
]
gas_reports = ["*"]
# Extra compiler profiles the restrictions below select: via-IR at 200 runs, and the legacy pipeline at 200 runs. The
# names are kept so deploy artifacts keep their paths.
additional_compiler_profiles = [
  { name = "collateralization", optimizer = true, via_ir = true, optimizer_runs = 200 },
  { name = "clvault", optimizer = true, via_ir = false, optimizer_runs = 200 },
]
compilation_restrictions = [
  # The RiskModule inlines the tick, floor-credit and listing-price math; at 10,000 runs it is 25.7 kB, past EIP-170,
  # at 200 runs 22.5 kB. Its calls are governance listings and views, where the extra gas does not matter.
  { paths = "src/risk/RiskModule.sol", via_ir = false, optimizer_runs = 200 },
]

[profile.default.fuzz]
# 1,000 runs keeps the local loop under a few minutes; CI raises it to Aave V4's 10,000 (TEST-007).
runs = 1_000
# Fixed seed so a local failure reproduces on every machine; CI overrides it per run.
seed = "0xa7a7a"
max_test_rejects = 131_072
# Dictionary weighting toward values seen in storage and events: share, liquidity and price
# boundaries matter more than uniform random words.
dictionary_weight = 60
include_storage = true
include_push_bytes = true

[profile.default.invariant]
# Local smoke depth; the invariant and ci profiles run the full campaign.
runs = 64
depth = 64
# Off by default: safety handlers bound their inputs but are allowed to hit reverting paths
# (TEST-007). Liveness handlers assert success inside the handler instead.
fail_on_revert = false
call_override = false
dictionary_weight = 80
include_storage = true
include_push_bytes = true
shrink_run_limit = 5_000
show_metrics = true

[profile.lite]
# Local iteration only (FOUNDRY_PROFILE=lite): the optimizer is off outside the via-IR compilation restrictions, so a
# rebuild takes a fraction of the default time. Its own out/ and cache/ keep the default build warm when switching back.
# No contract size limit here: unoptimized code is larger, and script/check-sizes.sh judges sizes on the default build.
# Gas figures differ without the optimizer; gas tests, the gate, coverage, CI and every release build use the default.
optimizer = false
out = "out-lite"
cache_path = "cache-lite"
code_size_limit = 10_000_000

[profile.halmos]
# The Halmos build (FOUNDRY_PROFILE=halmos in the slow tier's build step and Halmos jobs): src/ and test/halmos/ with
# what they import, and no scripts (the script directory is test/halmos/ too). Every compiler setting, compilation
# restriction and additional compiler profile is the default profile's, so each contract compiles as in the default
# build. Its own out/ and cache/ keep the default build warm; script/security-slow.sh reads the output directory from
# `forge config`.
test = "test/halmos"
script = "test/halmos"
out = "out-halmos"
cache_path = "cache-halmos"

[profile.ci]
# Fresh seed per CI run (taken from the environment by the workflow) so coverage grows over time.
[profile.ci.fuzz]
runs = 10_000
max_test_rejects = 1_000_000

[profile.ci.invariant]
# 1,000 runs at depth 100 per TEST-007: 100,000 handler calls per campaign on every push to main. Depth 100 covers the
# longest operation sequence in the Quint models (pledge, borrow, price move, liquidation, repay, withdraw interleaved
# across 3 accounts). The deep campaign of every file runs nightly in the invariant profile below.
runs = 1_000
depth = 100
fail_on_revert = false
shrink_run_limit = 10_000

[profile.aave]
# Builds the pinned Aave V4 release with Aave's own compiler settings into out-aave/, so the Hub,
# Spokes, AaveOracle, configurators and LiquidationLogic that fixtures and deploy scripts use have
# the runtime code of the release (TEST-002, TEST-134). Fixtures deploy from these artifacts with
# deployCode/vm.getCode; nothing in Avana's src/ or test/ imports Aave sources, so Aave's settings
# never leak into Avana's build. SpokeInstance keeps its LiquidationLogic placeholder;
# script/deploy/01_DeployAaveV4 links it to LiquidationLogic's CREATE2 address at deployment.
src = "dependencies/aave-v4-a3ef63e/src"
test = "dependencies/aave-v4-a3ef63e/src/deployments"
# aave-deploy/ holds AvanaAaveV4Roles, which runs Aave's own role procedures for the local fixture; it is compiled here,
# with Aave's settings, so Avana's default build never imports Aave sources.
script = "aave-deploy"
out = "out-aave"
cache_path = "cache-aave"
optimizer = true
optimizer_runs = 44_444_444
via_ir = false
bytecode_hash = "none"
# Aave keeps the CBOR metadata section (its default); only the hash is dropped.
cbor_metadata = true
no_match_path = ""
additional_compiler_profiles = [
  { name = "hub", optimizer = true, via_ir = true, optimizer_runs = 22_300 },
  { name = "spoke", optimizer = true, via_ir = true, optimizer_runs = 750 },
]
compilation_restrictions = [
  { paths = "dependencies/aave-v4-a3ef63e/src/hub/instances/HubInstance.sol", via_ir = true, optimizer_runs = 22_300 },
  { paths = "dependencies/aave-v4-a3ef63e/src/spoke/instances/SpokeInstance.sol", via_ir = true, optimizer_runs = 750 },
]

[profile.univ3]
# The pinned Uniswap v3 core release (5ea68a7: factory and pool) for local and test-network deployments
# (deployments/README.md), built alone with Uniswap's settings (Solidity 0.7.6, istanbul, 800 runs, no metadata hash)
# into out-univ3/. Built alone, the pool's creation code hashes to Uniswap's canonical POOL_INIT_CODE_HASH
# 0xe34f199b…8b54, which the position manager and Avana's UniswapV3Integration use to derive pool addresses; compiled
# in one job with other sources it does not (the hash moved to 0x664ea9b6…2c20 when the periphery shared the job).
# Tests deploy the factory with deployCode("out-univ3/UniswapV3Factory.sol/UniswapV3Factory.json") and create pools
# through it. Build it alone before the tests or the deploy: `FOUNDRY_PROFILE=univ3 forge build` (make build-univ3).
src = "dependencies/uniswap-v3-core-5ea68a7/contracts"
test = "dependencies/uniswap-v3-core-5ea68a7/contracts/test"
script = "dependencies/uniswap-v3-core-5ea68a7/contracts/test"
out = "out-univ3"
cache_path = "cache-univ3"
solc_version = "0.7.6"
evm_version = "istanbul"
optimizer = true
optimizer_runs = 800
via_ir = false
bytecode_hash = "none"
cbor_metadata = true
no_match_path = ""
skip = ["dependencies/uniswap-v3-core-5ea68a7/contracts/test/**"]
additional_compiler_profiles = []
compilation_restrictions = []

[profile.univ3-periphery]
# The pinned Uniswap v3 periphery (24ccf01): NonfungiblePositionManager at Uniswap's 2,000 runs and SwapRouter, with
# OpenZeppelin 3.4.2-solc-0.7 through a remapping scoped to the periphery folder (remappings.txt), into
# out-univ3-periphery/. Scripts deploy from the artifacts with vm.getCode; nothing in src/ or test/ imports them.
src = "external/univ3"
test = "external/univ3"
script = "external/univ3"
out = "out-univ3-periphery"
cache_path = "cache-univ3-periphery"
solc_version = "0.7.6"
evm_version = "istanbul"
optimizer = true
optimizer_runs = 1_000_000
via_ir = false
bytecode_hash = "none"
cbor_metadata = true
no_match_path = ""
additional_compiler_profiles = [{ name = "npm", optimizer = true, via_ir = false, optimizer_runs = 2_000 }]
compilation_restrictions = [
  { paths = "dependencies/uniswap-v3-periphery-24ccf01/contracts/NonfungiblePositionManager.sol", optimizer_runs = 2_000 },
]

[profile.slipstream-v1]
# Aerodrome Slipstream at tag v1.0.0 (37eead2), for local and test-network deployments only (deployments/README.md):
# CLFactory, CLPool, NonfungiblePositionManager, SwapRouter and the gauge factory with Slipstream's settings (Solidity
# 0.7.6, 200 runs, no metadata hash) into out-slipstream-v1/. OpenZeppelin 3.4 and ExcessivelySafeCall come through
# remappings scoped to the Slipstream folder.
src = "external/slipstream-v1"
test = "external/slipstream-v1"
script = "external/slipstream-v1"
out = "out-slipstream-v1"
cache_path = "cache-slipstream-v1"
solc_version = "0.7.6"
evm_version = "istanbul"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = true
no_match_path = ""

[profile.slipstream-main]
# Aerodrome Slipstream at main f8717fa (2026-04-10), built like slipstream-v1 into out-slipstream-main/.
src = "external/slipstream-main"
test = "external/slipstream-main"
script = "external/slipstream-main"
out = "out-slipstream-main"
cache_path = "cache-slipstream-main"
solc_version = "0.7.6"
evm_version = "istanbul"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = true
no_match_path = ""

[profile.univ4]
# Uniswap v4 core v4.0.0 (e50237c) and periphery 1.0.1 (ea2bf2e) for local and test-network deployments
# (deployments/README.md): PoolManager, PositionManager and StateView with Uniswap's settings (Solidity 0.8.26, cancun,
# via-IR, 44,444,444 runs, the PositionManager at 30,000, no metadata hash) into out-univ4/. Solmate, Permit2's
# interfaces and OpenZeppelin's IERC20 come through remappings scoped to the periphery folder. Tests and scripts deploy
# from the artifacts with deployCode/vm.getCode; nothing in src/ imports them.
src = "external/univ4"
test = "external/univ4"
script = "external/univ4"
out = "out-univ4"
cache_path = "cache-univ4"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 44_444_444
via_ir = true
bytecode_hash = "none"
cbor_metadata = true
no_match_path = ""
additional_compiler_profiles = [{ name = "posm", optimizer = true, via_ir = true, optimizer_runs = 30_000 }]
compilation_restrictions = [
  { paths = "dependencies/uniswap-v4-periphery-ea2bf2e/src/PositionManager.sol", optimizer_runs = 30_000 },
]

[profile.permit2]
# Permit2 (cc56ad0, the commit Uniswap v4 periphery 1.0.1 pins) with its own settings (Solidity 0.8.17, via-IR,
# 1,000,000 runs, no metadata hash) into out-permit2/, for local and test-network deployments of the v4 PositionManager.
src = "external/permit2"
test = "external/permit2"
script = "external/permit2"
out = "out-permit2"
cache_path = "cache-permit2"
solc_version = "0.8.17"
evm_version = "london"
optimizer = true
optimizer_runs = 1_000_000
via_ir = true
bytecode_hash = "none"
cbor_metadata = true
no_match_path = ""
additional_compiler_profiles = []
compilation_restrictions = []

[profile.aave-v3]
# Aave V3 origin v3.7.0 (cff15de) for the test-network world's flash-loan lender (deployments/README.md), with its own
# settings (Solidity 0.8.27, shanghai, 200 runs, no metadata hash) into out-aave-v3/. Its imports reach solidity-utils
# (fdc69f9), OpenZeppelin upgradeable 5.1.0 (fa52531) and OpenZeppelin 5.1.0 through remappings scoped to those
# folders (remappings.txt). Libraries are linked at deployment, as Aave's own scripts do.
src = "dependencies/aave-v3-origin-3.7.0/src"
test = "dependencies/aave-v3-origin-3.7.0/src/deployments"
script = "dependencies/aave-v3-origin-3.7.0/src/deployments"
out = "out-aave-v3"
cache_path = "cache-aave-v3"
solc_version = "0.8.27"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = true
no_match_path = ""

[profile.aerodrome]
# Aerodrome contracts v1.0 (1e08fb9: Voter, VotingEscrow, FactoryRegistry, gauge and rewards factories, Minter, AERO)
# for the test-network world, with Aerodrome's settings (Solidity 0.8.19, 200 runs) into out-aerodrome/; OpenZeppelin
# 4.8.0 (7b3e7b7) through a remapping scoped to the Aerodrome folder.
src = "external/aerodrome"
test = "external/aerodrome"
script = "external/aerodrome"
out = "out-aerodrome"
cache_path = "cache-aerodrome"
solc_version = "0.8.19"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
no_match_path = ""

[profile.chainlink-ocr2]
# Chainlink's OCR2 data-feed aggregator from libocr (199a6f1, contract2/: AccessControlledOCR2Aggregator,
# SimpleWriteAccessController) for the test-network world's price feeds, Solidity 0.8.19 at 1,000 runs (at 1,000,000
# runs AccessControlledOCR2Aggregator is 24,903 bytes, over EIP-170), into out-chainlink-ocr2/.
src = "dependencies/libocr-199a6f1/contract2"
test = "dependencies/libocr-199a6f1/contract2"
script = "dependencies/libocr-199a6f1/contract2"
out = "out-chainlink-ocr2"
cache_path = "cache-chainlink-ocr2"
solc_version = "0.8.19"
evm_version = "paris"
optimizer = true
optimizer_runs = 1_000
via_ir = false
no_match_path = ""

[profile.chainlink-proxy]
# Chainlink's EACAggregatorProxy from smartcontractkit/chainlink tag v2.10.0 (0fe6514, contracts/src/v0.6, vendored
# file by file under external/chainlink-v2.10.0/ with its imports), Solidity 0.6.6, into out-chainlink-proxy/.
src = "external/chainlink-v2.10.0/src/v0.6"
test = "external/chainlink-v2.10.0/src/v0.6"
script = "external/chainlink-v2.10.0/src/v0.6"
out = "out-chainlink-proxy"
cache_path = "cache-chainlink-proxy"
solc_version = "0.6.6"
evm_version = "istanbul"
optimizer = true
optimizer_runs = 1_000_000
via_ir = false
no_match_path = ""

[profile.differential]
# FFI differential fuzzing of the LPOracle against the `fractions.Fraction` reference in
# test/differential/reference/ (TEST-037). FFI is enabled only in this profile.
ffi = true
match_path = "test/differential/**"
no_match_path = "test/fork/**"

[profile.differential.fuzz]
# Each run spawns a Python process; 2,000 runs bound a run to minutes while covering every tick
# bucket the reference partitions.
runs = 2_000

[profile.invariant]
# Dedicated deep campaign over test/invariant only, nightly and on release tags: 2,000 runs at four times the ci call
# depth, 800,000 handler calls, to reach states that need long histories (incident clock, cooldown, grace latch). On
# those runs the test shards leave test/invariant/ out, so each campaign runs once, here. A file that pins its own
# runs and depth inline for the short profiles (`default.invariant.*`) sets this profile's too
# (`invariant.invariant.*`).
match_path = "test/invariant/**"
no_match_path = "test/fork/**"

[profile.invariant.invariant]
runs = 2_000
depth = 400
fail_on_revert = false
shrink_run_limit = 10_000
show_metrics = true

[profile.fork]
# Mainnet fork for third-party behaviour: Uniswap v3, Chainlink, the Aave V3 Pool, the GHO
# Stability Modules and the Sky LitePSM (Q-074). The fixture forks at the block pinned in
# test/utils/fixtures/ForkConstants.sol (mainnetForkBlock(), baseForkBlock()); the
# MAINNET_FORK_BLOCK/BASE_FORK_BLOCK variables override it whenever they are set, which only
# local runs do.
match_path = "test/fork/**"
no_match_path = "test/halmos/**"
eth_rpc_url = "${RPC_MAINNET}"
# Fork RPC responses are cached under ~/.foundry/cache/rpc, keyed by block.
no_storage_caching = false

[profile.fork.fuzz]
# Each fork run costs RPC round-trips; 256 runs keeps a cold-cache run under the CI time budget.
runs = 256

[profile.fork.invariant]
runs = 32
depth = 50
fail_on_revert = false

[profile.smt]
# Solidity SMTChecker (PROP-043, PROP-044): no reachable overflow, underflow, division by zero or
# failing assert in the core contracts.
# CHC finds loop and cross-function counterexamples that BMC misses. The CI job builds only the target contract's
# import graph; solc loads the Z3 library (libz3.so.4.12 for solc 0.8.28 on Linux) and the job fails when no solver ran.
# The model checker reads the source, not the generated code, so the build keeps only the compilation restrictions a
# file needs to compile at all with the optimizer off, as in the coverage profile: the DebtOracle files need via-IR
# (stack too deep in the legacy pipeline), the three AMM integrations the optimizer (stack too deep in ABI decoding).
# Every other file builds once, in the legacy pipeline, so no source is analysed twice.
optimizer = false
via_ir = false
out = "out-smt"
cache_path = "cache-smt"
additional_compiler_profiles = [
  { name = "smt-ir", optimizer = false, via_ir = true },
  { name = "smt-integrations", optimizer = true, via_ir = false, optimizer_runs = 200 },
]
compilation_restrictions = [
  { paths = "src/integrations/slipstream/SlipstreamIntegration.sol", via_ir = false, optimizer_runs = 200 },
  { paths = "src/integrations/uniswap-v3/UniswapV3Integration.sol", via_ir = false, optimizer_runs = 200 },
  { paths = "src/integrations/uniswap-v4/UniswapV4Integration.sol", via_ir = false, optimizer_runs = 200 },
]

[profile.smt.model_checker]
engine = "chc"
timeout = 100_000
targets = [
  "assert",
  "underflow",
  "overflow",
  "divByZero",
  "constantCondition",
  "popEmptyArray",
  "outOfBounds",
  "balance",
]
invariants = ["contract", "reentrancy"]
# z3 only: with no solver available solc reports warnings 7649 (CHC) and 8158 (BMC) instead of failing.
solvers = ["z3"]
show_unproved = true
show_unsupported = true
show_proved_safe = true
# PROP-043 and PROP-044: the core contracts (VaultToken, LPOracle, RiskModule, AaveAdapter, LiquidationModule,
# FirstLossReserve) and the Uniswap v3 integration, which carries the abstract LPVault (the model checker skips abstract
# contracts).
contracts = { "src/integrations/uniswap-v3/UniswapV3Integration.sol" = ["UniswapV3Integration"], "src/token/VaultToken.sol" = ["VaultToken"], "src/oracle/LPOracle.sol" = ["LPOracle"], "src/risk/RiskModule.sol" = ["RiskModule"], "src/adapter/AaveAdapter.sol" = ["AaveAdapter"], "src/liquidation/LiquidationModule.sol" = ["LiquidationModule"], "src/reserve/FirstLossReserve.sol" = ["FirstLossReserve"] }

[profile.coverage]
# Coverage builds without the optimizer and without via-IR so source maps stay exact. Fork,
# differential, Halmos and invariant suites are excluded: coverage measures the unit, fuzz,
# integration and hostile suites.
# The default profile's compilation_restrictions would otherwise apply here too, and in a via-IR or optimized build
# forge records a ternary as 0/0, the body of a single-statement `if` as 0 and a revert merged with an identical one as
# 0, however often tests run them. Only files that do not compile without them keep a restriction: the DebtOracle files
# need via-IR ("stack too deep" in the legacy pipeline), built here without the optimizer; the three AMM integrations need
# the optimizer ("stack too deep" in ABI decoding without it), built here with the legacy pipeline.
optimizer = false
via_ir = false
# Unoptimized, instrumented code spends more gas per call than the ci profile's build: Cascade's 100-account setUp
# ran out of the default 2^30 test gas limit (a DebtOracle poke then saw less than its 900,000 gas floor). Coverage
# measures branches, not gas, so its limit is 2^32.
gas_limit = 4294967296
no_match_path = "test/{fork,differential,halmos,invariant}/**"
additional_compiler_profiles = [
  { name = "coverage-ir", optimizer = false, via_ir = true },
  { name = "coverage-integrations", optimizer = true, via_ir = false, optimizer_runs = 200 },
]
compilation_restrictions = [
  { paths = "src/integrations/slipstream/SlipstreamIntegration.sol", via_ir = false, optimizer_runs = 200 },
  { paths = "src/integrations/uniswap-v3/UniswapV3Integration.sol", via_ir = false, optimizer_runs = 200 },
  { paths = "src/integrations/uniswap-v4/UniswapV4Integration.sol", via_ir = false, optimizer_runs = 200 },
]

[profile.coverage.fuzz]
runs = 64

[profile.mutation]
# Every mutation-gate job (script/slither-mutant-shard.py, script/security-gambit.sh, Necessist): each mutant is one
# recompile of the mutated file's dependents plus its tests, so compile time is almost all of a mutant's cost. Built
# like the coverage profile: no optimizer and no via-IR, except where a file does not compile without them (the
# DebtOracle files need via-IR, the three AMM integrations the optimizer); none of the default profile's size-only
# restrictions. The optimizer and the IR pipeline change gas and bytecode size, not what a test asserts, so a mutant a
# test kills here is killed in the default build too. The two tests whose subject is the release build's gas fail
# without the optimizer (TEST-042 worst-case poke at the minimum gas, TEST-060 exact lock cycle cost); they are left
# out here and run on the default profile for each
# mutant that survives the rest (script/mutation-test.py), so they still kill what they killed before.
optimizer = false
via_ir = false
# Unoptimized code is larger; script/check-sizes.sh judges sizes on the default build.
code_size_limit = 10_000_000
# Unoptimized code spends more gas per call: as in the coverage profile, Cascade's 100-account setUp would run out of
# the default 2^30 test gas limit (a DebtOracle poke then sees less than its 900,000 gas floor).
gas_limit = 4294967296
no_match_test = "test_TEST_042_worstCasePokeCompletesAtMinimumGas|test_TEST_060_exactCycleCost"
additional_compiler_profiles = [
  { name = "mutation-ir", optimizer = false, via_ir = true },
  { name = "mutation-integrations", optimizer = true, via_ir = false, optimizer_runs = 200 },
]
compilation_restrictions = [
  { paths = "src/integrations/slipstream/SlipstreamIntegration.sol", via_ir = false, optimizer_runs = 200 },
  { paths = "src/integrations/uniswap-v3/UniswapV3Integration.sol", via_ir = false, optimizer_runs = 200 },
  { paths = "src/integrations/uniswap-v4/UniswapV4Integration.sol", via_ir = false, optimizer_runs = 200 },
]

[profile.gas]
# Gas snapshots (`make gas`, CI `test` job): suites in test/gas/ name each measured operation with
# vm.snapshotGasLastCall(group, label) or vm.startSnapshotGas/vm.stopSnapshotGas, and forge writes
# snapshots/<group>.json, which is committed. With the check on, a value that differs from the committed
# snapshot fails the run; `make gas` (FORGE_SNAPSHOT_CHECK=false) rewrites the files for review.
match_path = "test/gas/**"
isolate = true
gas_snapshot_check = true

[profile.governance]
# Governance operation fork tests (docs/governance/README.md, Operations): read and write the before/after
# snapshots of each operation folder under ../docs/governance/operations/.
match_path = "test/governance/**"
fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read", path = "./out-aave" },
  { access = "read", path = "../deployments" },
  { access = "read-write", path = "./deployments-local" },
  { access = "read-write", path = "../docs/governance/operations" },
]

[rpc_endpoints]
mainnet = "${RPC_MAINNET}"
sepolia = "${RPC_SEPOLIA}"
base = "${RPC_BASE}"
base_sepolia = "${RPC_BASE_SEPOLIA}"
anvil = "http://127.0.0.1:8545"
# The node script/deploy/step.sh runs a step on, from the environment, so the URL is on no command line.
avana_step = "${AVANA_RPC_URL}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}", chain = 1 }
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"
override_spacing = false
wrap_comments = false
sort_imports = true
contract_new_lines = false
ignore = ["dependencies/**"]

[lint]
# security-fast.sh and the fast-security CI job run `forge lint -D notes`: a finding of any severity fails. Scope is
# src/ (the path is not passed on the command line, so `ignore` applies). Tests may use patterns (unchecked low-level
# calls in hostile components, mixed-case helpers) that the lints flag in production code; external interfaces mirror
# third-party ABIs.
lint_on_build = false
severity = ["high", "medium", "low", "info", "gas"]
ignore = ["dependencies/**", "test/**", "script/**", "src/dependencies/**"]
exclude_lints = [
  # Indexed event fields are fixed by the spec's event definitions and the indexer's topic layout.
  "event-fields",
  # Getters of immutables and constants keep the SCREAMING_SNAKE_CASE name of the value (PROXY_HEALTH_FACTOR_FLOOR()).
  "mixed-case-function",
  # Time-based logic is part of the design (timelock delays, oracle staleness, grace periods); Slither's `timestamp`
  # detector gates each comparison and its triage records the review.
  "block-timestamp",
  # solhint's no-inline-assembly and avoid-low-level-calls gate each site with one reviewed suppression comment.
  "inline-assembly",
  "low-level-calls",
  # Gas suggestion to replace keccak256 with inline assembly, which the rule above keeps out of Avana code.
  "asm-keccak256",
  # Single-use internal functions and modifiers keep implementation files within the 500-line limit (Q-240).
  "internal-function-used-once",
  "modifier-used-only-once",
  # Formula literals (1e18, 10_000 bps) stay inline where the spec writes them; forge fmt writes uint256/int256.
  "literal-instead-of-constant",
  "inconsistent-type-names",
]

[soldeer]
# remappings.txt is maintained by hand: Aave V4 imports its own files as `src/...`, which needs a
# context-scoped remapping that Soldeer does not generate.
remappings_generate = false
remappings_regenerate = false
recursive_deps = false

