sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"
override_spacing = false
wrap_comments = false
sort_imports = true
contract_new_lines = false
ignore = ["dependencies/**"]

[lint]
# security-fast.sh and the fast-security CI job run `forge lint -D notes`: a finding of any severity fails. Scope is
# src/ (the path is not passed on the command line, so `ignore` applies). Tests may use patterns (unchecked low-level
# calls in hostile components, mixed-case helpers) that the lints flag in production code; external interfaces mirror
# third-party ABIs.
lint_on_build = false
severity = ["high", "medium", "low", "info", "gas"]
ignore = ["dependencies/**", "test/**", "script/**", "src/interfaces/external/**"]
exclude_lints = [
  # Indexed event fields are fixed by the spec's event definitions and the indexer's topic layout.
  "event-fields",
  # Getters of immutables and constants keep the SCREAMING_SNAKE_CASE name of the value (PROXY_HEALTH_FACTOR_FLOOR()).
  "mixed-case-function",
  # Time-based logic is part of the design (timelock delays, oracle staleness, grace periods); Slither's `timestamp`
  # detector gates each comparison and its triage records the review.
  "block-timestamp",
  # solhint's no-inline-assembly and avoid-low-level-calls gate each site with one reviewed suppression comment.
  "inline-assembly",
  "low-level-calls",
  # Gas suggestion to replace keccak256 with inline assembly, which the rule above keeps out of Avana code.
  "asm-keccak256",
  # Single-use internal functions and modifiers keep implementation files within the 500-line limit (Q-240).
  "internal-function-used-once",
  "modifier-used-only-once",
  # Formula literals (1e18, 10_000 bps) stay inline where the spec writes them; forge fmt writes uint256/int256.
  "literal-instead-of-constant",
  "inconsistent-type-names",
]

[soldeer]
# remappings.txt is maintained by hand: Aave V4 imports its own files as `src/...`, which needs a
# context-scoped remapping that Soldeer does not generate.
remappings_generate = false
remappings_regenerate = false
recursive_deps = false

