# Pre-commit checks, installed once per clone with `lefthook install` (a single binary; no Node runtime in the hook).
# Each command runs only when matching files are staged; CI repeats every check, so a skipped hook never lets a
# failure through.
pre-commit:
  parallel: false
  commands:
    # Secret scan of the staged changes with the same rules as CI (.gitleaks.toml), so a finding is fixed before it
    # enters history instead of being allowlisted after. Gitleaks comes from PATH or $GITLEAKS; the version CI pins is
    # in .github/workflows/gitleaks.yml. A missing binary fails the hook, so no unscanned change is committed. An
    # allowlist entry in .gitleaksignore needs the owner's approval.
    gitleaks:
      run: '"${GITLEAKS:-gitleaks}" git . --pre-commit --staged --config .gitleaks.toml --redact=100 --no-banner --exit-code=1'
    forge-fmt:
      root: contracts/
      glob: "*.sol"
      run: forge fmt --check {staged_files}
    file-size:
      root: contracts/
      glob: "*.sol"
      run: script/check-file-size.sh
    licence:
      glob: "*.{sol,py,js,mjs,sh,json}"
      run: contracts/script/check-licence.sh

# No AI credit in a commit message; the commit-messages workflow checks the same on a pull request's commits.
commit-msg:
  commands:
    ai-credit:
      run: contracts/script/check-ai-credit.sh --message {1}
