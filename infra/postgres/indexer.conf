# PostgreSQL 17 settings of the indexer database (infra/README.md, PostgreSQL), for a 4 vCPU / 16 GB instance. On a
# managed service, set them in its parameter group (RDS) or database flags (Cloud SQL).

# Memory
shared_buffers = 4GB
effective_cache_size = 12GB
work_mem = 32MB
maintenance_work_mem = 1GB

# Connections: the indexer opens a small pool; the keepers and Convex never connect.
max_connections = 100
idle_in_transaction_session_timeout = 60s
statement_timeout = 120s

# Writes: the backfill inserts in large batches.
wal_compression = on
max_wal_size = 8GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
synchronous_commit = on

# Storage on SSD.
random_page_cost = 1.1
effective_io_concurrency = 200

# Vacuum keeps up with the event_log and series tables.
autovacuum_max_workers = 4
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# Security and audit
ssl = on
password_encryption = scram-sha-256
log_connections = on
log_disconnections = on
log_min_duration_statement = 2000
